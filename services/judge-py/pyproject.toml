[project]
name = "rankwant-judge-py"
version = "0.1.0"
description = "Bake-off nomzod B — Python worker + isolate"
requires-python = ">=3.12"
dependencies = ["redis>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.mypy]
strict = true
files = ["."]

[tool.ruff]
line-length = 100
