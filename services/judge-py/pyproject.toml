[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rankwant-judge-py"
version = "0.1.0"
description = "Bake-off nomzod B — Python worker + isolate"
requires-python = ">=3.12"
dependencies = ["redis>=8.1.0"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "mypy>=2.4.1", "ruff==0.17.5"]

# Flat layout: modullar ildizda yotadi, paket katalogi yo'q. Setuptools
# buni o'zi aniqlay olmaydi va "Multiple top-level modules discovered"
# xatosi bilan yiqiladi — shuning uchun aniq sanab beramiz.
[tool.setuptools]
py-modules = ["main", "judge", "sandbox", "protocol", "preflight"]

[tool.mypy]
python_version = "3.12"
files = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-q"
