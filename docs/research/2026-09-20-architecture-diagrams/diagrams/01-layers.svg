<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>RankWant — layered architecture</title>
<desc>User, Cloudflare edge, Next.js web, Django api/worker/beat, Postgres-Redis-S3, and the isolated judge host behind a security boundary.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

<rect x="330" y="16" width="320" height="48" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="490" y="34" text-anchor="middle" fill="#0C447C" font-size="15" font-weight="600" dominant-baseline="central">User</text>
<text x="490" y="52" text-anchor="middle" fill="#185FA5" font-size="12" dominant-baseline="central">browser · API bot · Telegram</text>
<line x1="490" y1="64" x2="490" y2="86" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="40" y="86" width="900" height="60" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="490" y="108" text-anchor="middle" fill="#3C3489" font-size="15" font-weight="600" dominant-baseline="central">Edge — Cloudflare</text>
<text x="490" y="128" text-anchor="middle" fill="#534AB7" font-size="12" dominant-baseline="central">Tunnel (no inbound port) · maintenance worker · CDN and cache rules · Vary handling</text>

<line x1="200" y1="146" x2="200" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="210" y="161" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">HTML / RSC</text>
<path d="M420 146 L420 264" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="430" y="205" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">/api/*</text>

<rect x="40" y="170" width="340" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="210" y="196" text-anchor="middle" fill="#085041" font-size="15" font-weight="600" dominant-baseline="central">web — Next.js SSR</text>
<text x="210" y="216" text-anchor="middle" fill="#0F6E56" font-size="12" dominant-baseline="central">React 19 · Tailwind 4 · 10 locales</text>

<rect x="40" y="264" width="340" height="70" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="210" y="290" text-anchor="middle" fill="#0C447C" font-size="15" font-weight="600" dominant-baseline="central">api — Django 5.2 LTS + DRF</text>
<text x="210" y="310" text-anchor="middle" fill="#185FA5" font-size="12" dominant-baseline="central">19 domain modules · service layer · OpenAPI</text>
<line x1="210" y1="240" x2="210" y2="264" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="40" y="358" width="160" height="62" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="120" y="381" text-anchor="middle" fill="#0C447C" font-size="13.5" font-weight="600" dominant-baseline="central">worker</text>
<text x="120" y="400" text-anchor="middle" fill="#185FA5" font-size="11.5" dominant-baseline="central">Celery consumer</text>

<rect x="200" y="358" width="180" height="62" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="290" y="381" text-anchor="middle" fill="#0C447C" font-size="13.5" font-weight="600" dominant-baseline="central">beat</text>
<text x="290" y="400" text-anchor="middle" fill="#185FA5" font-size="11.5" dominant-baseline="central">schedule 2 s / 60 s / 1 h</text>
<line x1="120" y1="334" x2="120" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="40" y="444" width="140" height="62" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="110" y="467" text-anchor="middle" fill="#27500A" font-size="13.5" font-weight="600" dominant-baseline="central">Postgres 16</text>
<text x="110" y="486" text-anchor="middle" fill="#3B6D11" font-size="11.5" dominant-baseline="central">metadata</text>

<rect x="190" y="444" width="140" height="62" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="260" y="467" text-anchor="middle" fill="#633806" font-size="13.5" font-weight="600" dominant-baseline="central">Redis 7</text>
<text x="260" y="486" text-anchor="middle" fill="#BA7517" font-size="11.5" dominant-baseline="central">session · Celery · queue</text>

<rect x="700" y="444" width="240" height="62" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="820" y="467" text-anchor="middle" fill="#27500A" font-size="13.5" font-weight="600" dominant-baseline="central">S3 / MinIO</text>
<text x="820" y="486" text-anchor="middle" fill="#3B6D11" font-size="11.5" dominant-baseline="central">test data (referenced as s3://)</text>

<line x1="110" y1="334" x2="110" y2="444" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="260" y1="334" x2="260" y2="444" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>
<path d="M400 334 L400 425 L760 425 L760 444" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="510" y="170" width="430" height="240" rx="16" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="725" y="196" text-anchor="middle" fill="#791F1F" font-size="15" font-weight="600" dominant-baseline="central">judge — separate host (isolation)</text>
<text x="725" y="215" text-anchor="middle" fill="#A32D2D" font-size="11.5" dominant-baseline="central">no inbound port · no DB credential · no outbound internet</text>

<rect x="535" y="232" width="380" height="48" rx="9" fill="#ffffff" stroke="#A32D2D" stroke-width="1"/>
<text x="725" y="250" text-anchor="middle" fill="#791F1F" font-size="13.5" font-weight="600" dominant-baseline="central">judge-go — Go + nsjail</text>
<text x="725" y="268" text-anchor="middle" fill="#A32D2D" font-size="11.5" dominant-baseline="central">selected candidate (bake-off A)</text>

<rect x="535" y="288" width="380" height="48" rx="9" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="725" y="306" text-anchor="middle" fill="#2C2C2A" font-size="13.5" font-weight="600" dominant-baseline="central">judge-py — Python + isolate</text>
<text x="725" y="324" text-anchor="middle" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">bake-off B — same protocol</text>

<text x="725" y="358" text-anchor="middle" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">Both sit behind the JudgeProvider interface and are interchangeable</text>
<text x="725" y="378" text-anchor="middle" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">If the cgroup preflight fails, the worker refuses to start</text>

<path d="M470 300 L510 300" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="490" y="291" text-anchor="middle" fill="#A32D2D" font-size="14" font-weight="700">&#10007;</text>
<text x="490" y="334" text-anchor="middle" fill="#A32D2D" font-size="11">api &#8594; judge is forbidden</text>

<path d="M300 444 L600 410" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="372" y="425" fill="#BA7517" font-size="11.5" dominant-baseline="central">1. pull (BRPOP)</text>
<path d="M690 410 L360 444" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="640" y="425" fill="#0F6E56" font-size="11.5" dominant-baseline="central">2. result (LPUSH)</text>
<path d="M820 410 L820 444" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="832" y="430" fill="#3B6D11" font-size="11.5" dominant-baseline="central">test data</text>
</svg>
