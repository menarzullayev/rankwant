<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>RankWant — judge pull protocol</title>
<desc>API and worker talk to the judge through two Redis queues. The judge never sends a request back: no HTTP, no database access.</desc>
<defs>
<marker id="arp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="980" height="330" fill="#ffffff"/>

<rect x="40" y="40" width="200" height="110" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="140" y="70" text-anchor="middle" fill="#0C447C" font-size="14" font-weight="600" dominant-baseline="central">api + worker</text>
<text x="140" y="92" text-anchor="middle" fill="#185FA5" font-size="11.5" dominant-baseline="central">JudgeProvider.submit()</text>
<text x="140" y="110" text-anchor="middle" fill="#185FA5" font-size="11.5" dominant-baseline="central">JudgeProvider.poll()</text>
<text x="140" y="132" text-anchor="middle" fill="#0F6E56" font-size="11.5" dominant-baseline="central">holds DB credentials</text>

<rect x="390" y="30" width="200" height="60" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="490" y="52" text-anchor="middle" fill="#633806" font-size="12.5" font-weight="600" dominant-baseline="central">rankwant:judge:jobs</text>
<text x="490" y="72" text-anchor="middle" fill="#BA7517" font-size="11.5" dominant-baseline="central">job queue (LPUSH / BRPOP)</text>

<rect x="390" y="104" width="200" height="60" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="490" y="126" text-anchor="middle" fill="#633806" font-size="12.5" font-weight="600" dominant-baseline="central">rankwant:judge:results</text>
<text x="490" y="146" text-anchor="middle" fill="#BA7517" font-size="11.5" dominant-baseline="central">result queue (LPUSH / BRPOP)</text>

<rect x="740" y="40" width="200" height="110" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="840" y="70" text-anchor="middle" fill="#791F1F" font-size="14" font-weight="600" dominant-baseline="central">judge (Go)</text>
<text x="840" y="92" text-anchor="middle" fill="#A32D2D" font-size="11.5" dominant-baseline="central">BRPOP &#8594; sandbox &#8594; LPUSH</text>
<text x="840" y="110" text-anchor="middle" fill="#A32D2D" font-size="11.5" dominant-baseline="central">opens no inbound port</text>
<text x="840" y="132" text-anchor="middle" fill="#27500A" font-size="11.5" dominant-baseline="central">holds no DB credentials</text>

<line x1="240" y1="70" x2="390" y2="62" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arp)"/>
<text x="315" y="55" text-anchor="middle" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">1. LPUSH</text>
<line x1="590" y1="62" x2="740" y2="76" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arp)"/>
<text x="665" y="57" text-anchor="middle" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">2. BRPOP (pull)</text>

<line x1="740" y1="128" x2="590" y2="140" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arp)"/>
<text x="665" y="121" text-anchor="middle" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">3. LPUSH</text>
<line x1="390" y1="140" x2="240" y2="120" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arp)"/>
<text x="315" y="119" text-anchor="middle" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">4. BRPOP (poll)</text>

<path d="M740 178 L240 178" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="490" y="200" text-anchor="middle" fill="#A32D2D" font-size="12.5" dominant-baseline="central">&#10007; no direct path in either direction &#8212; neither HTTP nor database</text>

<text x="40" y="242" fill="#2C2C2A" font-size="12" font-weight="600" dominant-baseline="central">S3 (test data):</text>
<text x="40" y="264" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">The API sends only a reference &#8212; s3://bucket/key. Test bodies are never stored in the database.</text>
<text x="40" y="284" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">The judge reads them with a MinIO client and keeps up to 256 MB cached, clearing the cache when it overflows.</text>
<text x="40" y="308" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">With S3 unconfigured, only jobs carrying inline tests run; the rest fail visibly (IE) rather than silently returning WA.</text>
</svg>
