<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>RankWant — deploy topology, current and target</title>
<desc>Left: the public preview running on a single machine. Right: the target four-host topology derived from the security boundary.</desc>
<rect x="0" y="0" width="980" height="400" fill="#ffffff"/>

<text x="40" y="22" fill="#633806" font-size="14" font-weight="600" dominant-baseline="central">Current &#8212; one machine (public preview)</text>
<rect x="40" y="40" width="440" height="300" rx="16" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="260" y="60" text-anchor="middle" fill="#BA7517" font-size="11.5" dominant-baseline="central">dual-boot Linux/Windows · docker compose -p rankwant</text>

<rect x="60" y="76" width="400" height="42" rx="9" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="260" y="97" text-anchor="middle" fill="#3C3489" font-size="12" dominant-baseline="central">Cloudflare Tunnel &#8212; no open port &#183; rankwant.uz</text>

<rect x="60" y="130" width="190" height="38" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="155" y="149" text-anchor="middle" fill="#085041" font-size="12" dominant-baseline="central">web &#183; 127.0.0.1:8300</text>
<rect x="270" y="130" width="190" height="38" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="365" y="149" text-anchor="middle" fill="#0C447C" font-size="12" dominant-baseline="central">api &#183; 127.0.0.1:8301</text>

<rect x="60" y="178" width="190" height="38" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="155" y="197" text-anchor="middle" fill="#0C447C" font-size="12" dominant-baseline="central">worker + beat</text>
<rect x="270" y="178" width="190" height="38" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="365" y="197" text-anchor="middle" fill="#791F1F" font-size="12" dominant-baseline="central">judge (privileged)</text>

<rect x="60" y="226" width="125" height="38" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="122" y="245" text-anchor="middle" fill="#27500A" font-size="12" dominant-baseline="central">postgres</text>
<rect x="195" y="226" width="125" height="38" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="257" y="245" text-anchor="middle" fill="#633806" font-size="12" dominant-baseline="central">redis</text>
<rect x="330" y="226" width="130" height="38" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="395" y="245" text-anchor="middle" fill="#27500A" font-size="12" dominant-baseline="central">minio</text>

<text x="60" y="288" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">migrate is a separate one-shot service with its own image.</text>
<text x="60" y="306" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">Django admin is not exposed: 127.0.0.1:8301/admin/ only.</text>
<text x="60" y="326" fill="#633806" font-size="11.5" dominant-baseline="central">There is no staging environment.</text>

<text x="520" y="22" fill="#27500A" font-size="14" font-weight="600" dominant-baseline="central">Target &#8212; four hosts</text>
<rect x="520" y="40" width="420" height="300" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="730" y="60" text-anchor="middle" fill="#0F6E56" font-size="11.5" dominant-baseline="central">follows from the security boundary</text>

<rect x="540" y="76" width="380" height="52" rx="9" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="730" y="96" text-anchor="middle" fill="#0C447C" font-size="12.5" font-weight="600" dominant-baseline="central">app &#8212; api + worker</text>
<text x="730" y="114" text-anchor="middle" fill="#185FA5" font-size="11.5" dominant-baseline="central">closest to the database and Redis</text>

<rect x="540" y="138" width="380" height="52" rx="9" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="730" y="158" text-anchor="middle" fill="#085041" font-size="12.5" font-weight="600" dominant-baseline="central">web &#8212; Next.js</text>
<text x="730" y="176" text-anchor="middle" fill="#0F6E56" font-size="11.5" dominant-baseline="central">scales independently (web &#215; 2 is possible)</text>

<rect x="540" y="200" width="380" height="52" rx="9" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
<text x="730" y="220" text-anchor="middle" fill="#791F1F" font-size="12.5" font-weight="600" dominant-baseline="central">judge &#215; N &#8212; dedicated hosts</text>
<text x="730" y="238" text-anchor="middle" fill="#A32D2D" font-size="11.5" dominant-baseline="central">no inbound port &#183; only Redis and S3</text>

<rect x="540" y="262" width="380" height="52" rx="9" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="730" y="282" text-anchor="middle" fill="#27500A" font-size="12.5" font-weight="600" dominant-baseline="central">data &#8212; Postgres + Redis</text>
<text x="730" y="300" text-anchor="middle" fill="#3B6D11" font-size="11.5" dominant-baseline="central">sits between app and judge</text>

<text x="520" y="362" fill="#5F5E5A" font-size="11.5" dominant-baseline="central">Migration notes for the current preview: compose/four-host/README.md</text>
</svg>
