name: rankwant-ci

# CI/smoke uchun override: host portlari e'lon qilinmaydi.
#
# Nega: smoke sinovi compose tarmog'i ICHIDA ishlaydi, ya'ni host portlari
# kerak emas. Ularni e'lon qilmaslik runner'da (va ishlab chiquvchi
# mashinasida) band port sababli tushib qolishning oldini oladi.
# CI/smoke uchun override: host portlari e'lon qilinmaydi.
#
# Nega: smoke sinovi compose tarmog'i ICHIDA ishlaydi, ya'ni host portlari
# kerak emas. Ularni e'lon qilmaslik runner'da (va ishlab chiquvchi
# mashinasida) band port sababli tushib qolishning oldini oladi.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  minio:
    ports: !reset []
  api:
    ports: !reset []
    environment:
      # Yuklama sinovi bitta IP dan keladi: anon throttle sig'imdan oldin
      # ishga tushib, o'lchovni ma'nosiz qilardi (94% 429).
      THROTTLE_ANON: 100000/min
      THROTTLE_USER: 100000/min
  web:
    ports: !reset []

  # Smoke tarmoq ICHIDA ishlaydi: host portlari kerak emas.
  #
  # ⚠️ `HOST_REPO_ROOT` — bind mount manbai DAEMON tomonida yechiladi.
  # Runner konteyner ichida bo'lsa compose fayli turgan nisbiy yo'l daemon
  # uchun mavjud emas va mount BO'SH chiqadi. O'zgaruvchi faqat konteyner
  # runner'da o'rnatiladi; bo'sh bo'lsa standart qiymat (`.`) hozirgi
  # xatti-harakatni beradi — compose `.` ni fayl katalogiga nisbatan yechadi.
  # (Bu izohda ataylab dollar-qavs yozilmagan: tools/check_env_example.py
  # butun faylni skanerlaydi, izohdagi naqsh ham o'zgaruvchi bo'lib ko'rinadi.)
  smoke:
    logging: *default-logging
    image: python:3.13-slim
    profiles: ['smoke']
    volumes: ["${HOST_REPO_ROOT:-.}/tests/smoke:/smoke:ro"]
    command: ['python', '/smoke/check.py']
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
      judge: { condition: service_started }

  # Judge latency — launch gate sharti: p50 < 5 s, p95 < 15 s
  # (`docs/09-development-plan/README.md` § Launch gate; mezon ADR-0004 da).
  #
  # Haqiqiy nsjail ostida, haqiqiy navbat bilan o'lchaydi:
  # submit → Redis → judge → verdict. `smoke` bilan bir xil naqsh — tarmoq
  # ICHIDA ishlaydi, ya'ni host portlari kerak emas, va `profiles` tufayli
  # `up -d` uni ko'tarmaydi (bir martalik).
  #
  # ⚠️ `worker` TIRIK bo'lishi SHART — navbatni u bo'shatadi. Nightly bu
  # job'da `worker beat` ni to'xtatmaydi (e2e dagi bake-off qadamidan farqli:
  # u yerda harness natijalarni o'zi o'qiydi).
  #
  # Byudjet — o'lchov emas, DARVOZA: oshsa skript 1 qaytaradi va job qizil
  # bo'ladi. Muhit (`API`, namuna soni, byudjet) atrof-muhit orqali
  # boshqariladi — `tests/latency/check_judge_latency.py` docstring'iga qarang.
  latency:
    logging: *default-logging
    image: python:3.13-slim
    profiles: ['latency']
    volumes: ["${HOST_REPO_ROOT:-.}/tests/latency:/latency:ro"]
    command: ['python', '/latency/check_judge_latency.py']
    depends_on:
      api: { condition: service_healthy }
      worker: { condition: service_started }
      judge: { condition: service_started }

  # Bake-off — sandbox xatti-harakatini HAQIQIY nsjail ostida tekshiradi:
  # validator (19–21), fork bomb, tarmoq, `/proc`, symlink, fayl yozish,
  # OLE/TLE/MLE. Birlik testlari `sandboxed` ni soxta ijrochi bilan
  # almashtiradi, ya'ni bu sinfning hech biri ularga ko'rinmaydi.
  #
  # ⚠️ Harness KONTEYNER ichida ishlaydi, ya'ni `10-file-write` dagi
  # "host'da fayl paydo bo'lmadi" tekshiruvi judge host'ini emas, shu
  # konteynerni ko'radi. Asosiy da'vo — verdikt — baribir o'z kuchida.
  #
  # `api` obrazi ATAYLAB: unda `redis` kutubxonasi allaqachon bor, ya'ni
  # harness uchun na `pip install`, na tarmoq kerak — obraz esa shu job'da
  # allaqachon qurilgan. Django sozlamalari ishlatilmaydi: harness mustaqil
  # skript, u faqat Redis bilan gaplashadi.
  #
  # `smoke` kabi bir martalik: `profiles` tufayli `up -d` uni ko'tarmaydi.
  bakeoff:
    logging: *default-logging
    # Same image the stack script tagged as project-api.
    # Without this, `compose run bakeoff` rebuilds apps/api from scratch.
    image: ${COMPOSE_PROJECT_NAME:-rankwant-ci}-api
    build: ./apps/api
    profiles: ['bakeoff']
    volumes: ["${HOST_REPO_ROOT:-.}/services/bakeoff:/bakeoff:ro"]
    environment:
      REDIS_URL: redis://redis:6379/0
    command: ['python', '/bakeoff/harness/runner.py', '--worker', 'judge-go']
    depends_on:
      redis: { condition: service_healthy }
      judge: { condition: service_started }
