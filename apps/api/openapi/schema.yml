  /api/v1/articles/:
    get:
      operationId: articles_list
      description: |-
        O'z o'qish kontenti — ADR-0005 differensiatori.

        Yozish Django admin orqali; API faqat o'qish uchun (masala arxivi bilan
        bir xil naqsh).
      parameters:
      - in: query
        name: locale
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: topics__slug
        schema:
          type: string
      tags:
      - articles
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
  /api/v1/articles/{slug}/:
    get:
      operationId: articles_retrieve
      description: |-
        O'z o'qish kontenti — ADR-0005 differensiatori.

        Yozish Django admin orqali; API faqat o'qish uchun (masala arxivi bilan
