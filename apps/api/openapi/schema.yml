          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
