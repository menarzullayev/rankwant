openapi: 3.0.3
info:
  title: RankWant API
  version: 1.0.0
  description: Sport dasturlash va olimpiada platformasi — ochiq REST API
paths:
  /api/v1/analytics/events/:
    post:
      operationId: analytics_events_create
      description: |-
        Funnel hodisalarini qabul qiladi (qaror 17).

        `AllowAny` — ATAYIN: eng qimmatli ma'lumot ro'yxatdan O'TMAGAN
        odamdan keladi (qaysi maydonda ketdi), ya'ni kirish talab qilinsa
        funnel umuman ko'rinmasdi. Throttle esa bazani to'ldirishga yo'l
        qo'ymaydi.

        IP saqlanmaydi: u shaxsiy ma'lumot, funnel uchun esa kerak emas.
        Sessiya kaliti bog'lanish uchun yetarli.
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsBatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalyticsBatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalyticsBatch'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/appearance/:
    get:
      operationId: appearance_retrieve
      description: |-
        Saytning standart ko'rinishi — ommaviy o'qish (D37).

        Mehmon ham, yangi hisob ham shuni boshlang'ich qiymat sifatida oladi.
        Keshlanadi: u kamdan-kam o'zgaradi, lekin har bir yangi qurilma
        so'raydi.

        Foydalanuvchi O'ZI tanlagach, bu qiymat ustun bo'lmaydi — u faqat
        boshlanish nuqtasi.
      tags:
      - appearance
      security:
      - {}
      responses:
        '200':
          description: Standart ko'rinish
  /api/v1/arena/:
    get:
      operationId: arena_list
      description: Jonli savol-javob raundi.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - arena
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArenaList'
          description: ''
  /api/v1/arena/{slug}/:
    get:
      operationId: arena_retrieve
      description: Jonli savol-javob raundi.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaDetail'
          description: ''
  /api/v1/arena/{slug}/answer/:
    post:
      operationId: arena_answer_create
      description: Jonli savol-javob raundi.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Answer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Answer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Answer'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResult'
          description: ''
  /api/v1/arena/{slug}/current/:
    get:
      operationId: arena_current_retrieve
      description: Hozir ochiq savol. Kelgusi savol BERILMAYDI — u hali ochilmagan.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentQuestion'
          description: ''
  /api/v1/arena/{slug}/join/:
    post:
      operationId: arena_join_create
      description: Jonli savol-javob raundi.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaDetail'
          description: ''
  /api/v1/arena/{slug}/standings/:
    get:
      operationId: arena_standings_list
      description: Jonli savol-javob raundi.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArenaStandingList'
          description: ''
  /api/v1/arena/{slug}/standings/me/:
    get:
      operationId: arena_standings_me_retrieve
      description: O'z qatori — ommaviy jadval `TOP_LIMIT` bilan cheklangani uchun.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaStanding'
          description: ''
        '404':
          description: No response body
  /api/v1/articles/:
    get:
      operationId: articles_list
      description: |-
        O'z o'qish kontenti — ADR-0005 differensiatori.

        Yozish Django admin orqali; API faqat o'qish uchun (masala arxivi bilan
        bir xil naqsh).
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - algorithm
          - article
        description: |-
          * `article` - Maqola
          * `algorithm` - Algoritm
      - in: query
        name: locale
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: topics__slug
        schema:
          type: string
      tags:
      - articles
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
  /api/v1/articles/{slug}/:
    get:
      operationId: articles_retrieve
      description: |-
        O'z o'qish kontenti — ADR-0005 differensiatori.

        Yozish Django admin orqali; API faqat o'qish uchun (masala arxivi bilan
        bir xil naqsh).
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - articles
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
  /api/v1/attempts/:
    get:
      operationId: attempts_list
      description: Submit va urinishlar tarixi — PRD P0-3.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - attempts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttemptList'
          description: ''
    post:
      operationId: attempts_create
      description: Submit va urinishlar tarixi — PRD P0-3.
      tags:
      - attempts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
  /api/v1/attempts/{id}/:
    get:
      operationId: attempts_retrieve
      description: Submit va urinishlar tarixi — PRD P0-3.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attempt.
        required: true
      tags:
      - attempts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptDetail'
          description: ''
  /api/v1/auth/{provider}/callback/:
    get:
      operationId: auth_callback_retrieve
      description: Kodni almashtiradi va hisobni topadi yoki yaratadi.
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/auth/{provider}/start/:
    get:
      operationId: auth_start_retrieve
      description: Provayderning ruxsat sahifasiga yo'naltiradi.
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/auth/email/resend/:
    post:
      operationId: auth_email_resend_create
      description: Xatni qaytadan yuboradi. Faqat o'z hisobiga.
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify_create
      description: |-
        Havola yoki kod bilan pochtani tasdiqlaydi.

        Kirish talab qilinmaydi: havola pochtadan, ko'pincha boshqa
        qurilmadagi brauzerda ochiladi va u yerda sessiya bo'lmaydi.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerify'
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/link/:
    post:
      operationId: auth_link_create
      description: Parol bilan tasdiqlab, ijtimoiy hisobni mavjud hisobga bog'laydi.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLink'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialLink'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialLink'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Tiklash xatini so'raydi (ADR-0015).

        HAR DOIM 202 qaytaradi — hisob bor-yo'qligidan qat'i nazar. Aks holda
        bu endpoint hisob mavjudligini tekshirish quroli bo'lardi: kimdir
        manzillar ro'yxatini yuborib, qaysilari ro'yxatdan o'tganini bilib olardi.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Havola yoki kod bilan yangi parol o'rnatadi.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/providers/:
    get:
      operationId: auth_providers_retrieve
      description: |-
        Sozlangan ijtimoiy kirish provayderlari.

        Frontend shu ro'yxat bo'yicha tugma chizadi: kaliti yo'q provayder
        tugmasi umuman ko'rinmaydi va foydalanuvchi ishlamaydigan yo'lni
        bosmaydi (ADR-0016).
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/social/{provider}/:
    delete:
      operationId: auth_social_destroy
      description: |-
        Ulangan hisobni uzadi.

        Yagona kirish yo'lini uzib bo'lmaydi: paroli yo'q va boshqa
        provayderi ham qolmagan odam o'z hisobiga qaytib kira olmasdi.
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/username-check/:
    get:
      operationId: auth_username_check_retrieve
      description: |-
        Taxallus bo'shmi — yozayotganda chaqiriladi.

        Bu endpoint nomlarni sanab chiqishga yo'l ochadi. Uni yashirishning
        ma'nosi yo'q: ro'yxatdan o'tishga urinib ham xuddi shu javob olinadi,
        taxalluslar esa standings'da ochiq turadi. Shuning uchun himoya —
        yashirish emas, chegara (`username_check`).
      parameters:
      - in: query
        name: u
        schema:
          type: string
        description: Tekshiriladigan taxallus
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameCheck'
          description: ''
  /api/v1/calendar/:
    get:
      operationId: calendar_retrieve
      description: |-
        Barcha tadbirlar bir joyda — musobaqa, arena, chempionat, hakaton.

        Duellar shaxsiy: faqat kirgan foydalanuvchining o'zinikilari.
      tags:
      - calendar
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Tadbirlar ro'yxati
  /api/v1/certificates/{id}/:
    get:
      operationId: certificates_retrieve
      description: Sertifikatni tekshirish — QR shu ma'lumotga olib keladi.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - certificates
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
          description: ''
  /api/v1/certificates/{id}/pdf/:
    get:
      operationId: certificates_pdf_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - certificates
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/classrooms/:
    get:
      operationId: classrooms_list
      description: PRD P2-2 — o'qituvchi sinfi.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - classrooms
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Classroom'
          description: ''
    post:
      operationId: classrooms_create
      description: PRD P2-2 — o'qituvchi sinfi.
      tags:
      - classrooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassroomCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClassroomCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClassroomCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomCreate'
          description: ''
  /api/v1/classrooms/{slug}/:
    get:
      operationId: classrooms_retrieve
      description: PRD P2-2 — o'qituvchi sinfi.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - classrooms
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
          description: ''
    patch:
      operationId: classrooms_partial_update
      description: PRD P2-2 — o'qituvchi sinfi.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - classrooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClassroom'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClassroom'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClassroom'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Classroom'
          description: ''
    delete:
      operationId: classrooms_destroy
      description: PRD P2-2 — o'qituvchi sinfi.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - classrooms
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/classrooms/{slug}/assignments/:
    get:
      operationId: classrooms_assignments_list
      description: PRD P2-2 — o'qituvchi sinfi.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - classrooms
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
          description: ''
    post:
      operationId: classrooms_assignments_create
      description: PRD P2-2 — o'qituvchi sinfi.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - classrooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Classroom'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Classroom'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Classroom'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Assignment'
          description: ''
  /api/v1/classrooms/{slug}/assignments/{id}/progress/:
    get:
      operationId: classrooms_assignments_progress_retrieve
      description: PRD P2-2 — o'qituvchi sinfi.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - classrooms
      security:
      - cookieAuth: []
      responses:
