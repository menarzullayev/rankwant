openapi: 3.0.3
info:
  title: RankWant API
  version: 1.0.0
  description: Sport dasturlash va olimpiada platformasi — ochiq REST API
paths:
  /api/v1/analytics/events/:
    post:
      operationId: analytics_events_create
      description: |-
        Funnel hodisalarini qabul qiladi (qaror 17).

        `AllowAny` — ATAYIN: eng qimmatli ma'lumot ro'yxatdan O'TMAGAN
        odamdan keladi (qaysi maydonda ketdi), ya'ni kirish talab qilinsa
        funnel umuman ko'rinmasdi. Throttle esa bazani to'ldirishga yo'l
        qo'ymaydi.

        IP saqlanmaydi: u shaxsiy ma'lumot, funnel uchun esa kerak emas.
        Sessiya kaliti bog'lanish uchun yetarli.
      summary: Analitika hodisasini qabul qilish
      tags:
      - analytics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsBatch'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalyticsBatch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalyticsBatch'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/appearance/:
    get:
      operationId: appearance_retrieve
      description: |-
        Saytning standart ko'rinishi — ommaviy o'qish (D37).

        Mehmon ham, yangi hisob ham shuni boshlang'ich qiymat sifatida oladi.
        Keshlanadi: u kamdan-kam o'zgaradi, lekin har bir yangi qurilma
        so'raydi.

        Foydalanuvchi O'ZI tanlagach, bu qiymat ustun bo'lmaydi — u faqat
        boshlanish nuqtasi.
      summary: Sayt ko'rinishi (tema)
      tags:
      - appearance
      security:
      - {}
      responses:
        '200':
          description: Default appearance
  /api/v1/arena/:
    get:
      operationId: arena_list
      description: Jonli savol-javob raundi.
      summary: arena raundlari ro'yxati
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - arena
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArenaList'
          description: ''
  /api/v1/arena/{slug}/:
    get:
      operationId: arena_retrieve
      description: Jonli savol-javob raundi.
      summary: Bitta arena raundi
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaDetail'
          description: ''
  /api/v1/arena/{slug}/answer/:
    post:
      operationId: arena_answer_create
      description: Jonli savol-javob raundi.
      summary: Javob yuborish
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Answer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Answer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Answer'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerResult'
          description: ''
  /api/v1/arena/{slug}/current/:
    get:
      operationId: arena_current_retrieve
      description: Hozir ochiq savol. Kelgusi savol BERILMAYDI — u hali ochilmagan.
      summary: Joriy savol
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentQuestion'
          description: ''
  /api/v1/arena/{slug}/join/:
    post:
      operationId: arena_join_create
      description: Jonli savol-javob raundi.
      summary: Raundga qo'shilish
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaDetail'
          description: ''
  /api/v1/arena/{slug}/standings/:
    get:
      operationId: arena_standings_list
      description: Jonli savol-javob raundi.
      summary: Jonli jadval
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArenaStandingList'
          description: ''
  /api/v1/arena/{slug}/standings/me/:
    get:
      operationId: arena_standings_me_retrieve
      description: O'z qatori — ommaviy jadval `TOP_LIMIT` bilan cheklangani uchun.
      summary: O'z o'rnim
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - arena
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArenaStanding'
          description: ''
        '404':
          description: No response body
  /api/v1/articles/:
    get:
      operationId: articles_list
      description: |-
        O'z o'qish kontenti — ADR-0005 differensiatori.

        Yozish Django admin orqali; API faqat o'qish uchun (masala arxivi bilan
        bir xil naqsh).
      summary: maqolalar ro'yxati
      parameters:
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - algorithm
          - article
        description: |-
          * `article` - Maqola
          * `algorithm` - Algoritm
      - in: query
        name: locale
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: topics__slug
        schema:
          type: string
      tags:
      - articles
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
  /api/v1/articles/{slug}/:
    get:
      operationId: articles_retrieve
      description: |-
        O'z o'qish kontenti — ADR-0005 differensiatori.

        Yozish Django admin orqali; API faqat o'qish uchun (masala arxivi bilan
        bir xil naqsh).
      summary: Bitta maqola
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - articles
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
  /api/v1/attempts/:
    get:
      operationId: attempts_list
      description: Submit va urinishlar tarixi — PRD P0-3.
      summary: urinishlar ro'yxati
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -memory_kb
          - -source_size
          - -time_ms
          - created_at
          - memory_kb
          - source_size
          - time_ms
        description: Saralash maydoni (`-` teskari tartib). Notanish qiymat jim rad
          etiladi va standart tartib qaytadi.
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - attempts
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttemptList'
          description: ''
    post:
      operationId: attempts_create
      description: Submit va urinishlar tarixi — PRD P0-3.
      summary: Yangi urinish yaratish
      tags:
      - attempts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttemptCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
  /api/v1/attempts/{id}/:
    get:
      operationId: attempts_retrieve
      description: Submit va urinishlar tarixi — PRD P0-3.
      summary: Bitta urinish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attempt.
        required: true
      tags:
      - attempts
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptDetail'
          description: ''
  /api/v1/attempts/answers/:
    post:
      operationId: attempts_answers_create
      description: |-
        Submit to an `answer` problem: one text file per test, or a zip.

        A separate door from `create`: that one takes source code as JSON,
        this one takes files. A test left out keeps the solver's last
        answer for it (`judging/answers.py`).
      summary: Javob fayllarini yuborish
      tags:
      - attempts
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                problem:
                  type: string
                contest:
                  type: string
                archive:
                  type: string
                  format: binary
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - problem
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
          description: ''
  /api/v1/attempts/counts/:
    get:
      operationId: attempts_counts_retrieve
      description: |-
        How many times one user submitted to each of a few problems.

        The list is cursor-paginated and carries no total, so a feed that
        folds attempts into one line per problem cannot count them from a
        page: it would print the page size. The attempts themselves are
        public, so their count is too.
      summary: Foydalanuvchining masalalar bo'yicha urinishlar soni
      parameters:
      - in: query
        name: problems
        schema:
          type: string
        description: Comma-separated slugs.
        required: true
      - in: query
        name: username
        schema:
          type: string
        required: true
      tags:
      - attempts
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/auth/{provider}/callback/:
    get:
      operationId: auth_callback_retrieve
      description: Kodni almashtiradi va hisobni topadi yoki yaratadi.
      summary: OAuth callback
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/auth/{provider}/start/:
    get:
      operationId: auth_start_retrieve
      description: Provayderning ruxsat sahifasiga yo'naltiradi.
      summary: OAuth boshlash
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '302':
          description: No response body
  /api/v1/auth/email/resend/:
    post:
      operationId: auth_email_resend_create
      description: Xatni qaytadan yuboradi. Faqat o'z hisobiga.
      summary: Tasdiqlash kodini qayta yuborish
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify_create
      description: |-
        Havola yoki kod bilan pochtani tasdiqlaydi.

        Kirish talab qilinmaydi: havola pochtadan, ko'pincha boshqa
        qurilmadagi brauzerda ochiladi va u yerda sessiya bo'lmaydi.
      summary: Email'ni kod bilan tasdiqlash
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerify'
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/link/:
    post:
      operationId: auth_link_create
      description: Parol bilan tasdiqlab, ijtimoiy hisobni mavjud hisobga bog'laydi.
      summary: Ijtimoiy hisobni ulash
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLink'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialLink'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialLink'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: Tizimga kirish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Tizimdan chiqish
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Tiklash xatini so'raydi (ADR-0015).

        HAR DOIM 202 qaytaradi — hisob bor-yo'qligidan qat'i nazar. Aks holda
        bu endpoint hisob mavjudligini tekshirish quroli bo'lardi: kimdir
        manzillar ro'yxatini yuborib, qaysilari ro'yxatdan o'tganini bilib olardi.
      summary: Parolni tiklash havolasini so'rash
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '202':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Havola yoki kod bilan yangi parol o'rnatadi.
      summary: Parolni tiklashni tasdiqlash
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/providers/:
    get:
      operationId: auth_providers_retrieve
      description: |-
        Sozlangan ijtimoiy kirish provayderlari.

        Frontend shu ro'yxat bo'yicha tugma chizadi: kaliti yo'q provayder
        tugmasi umuman ko'rinmaydi va foydalanuvchi ishlamaydigan yo'lni
        bosmaydi (ADR-0016).
      summary: Mavjud OAuth provayderlar
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      summary: Ro'yxatdan o'tish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/auth/social/{provider}/:
    delete:
      operationId: auth_social_destroy
      description: |-
        Ulangan hisobni uzadi.

        Yagona kirish yo'lini uzib bo'lmaydi: paroli yo'q va boshqa
        provayderi ham qolmagan odam o'z hisobiga qaytib kira olmasdi.
      summary: Ijtimoiy hisobni uzish
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/username-check/:
    get:
      operationId: auth_username_check_retrieve
      description: |-
        Taxallus bo'shmi — yozayotganda chaqiriladi.

        Bu endpoint nomlarni sanab chiqishga yo'l ochadi. Uni yashirishning
        ma'nosi yo'q: ro'yxatdan o'tishga urinib ham xuddi shu javob olinadi,
        taxalluslar esa standings'da ochiq turadi. Shuning uchun himoya —
        yashirish emas, chegara (`username_check`).
      summary: Username band emasligini tekshirish
      parameters:
      - in: query
        name: u
        schema:
          type: string
        description: Tekshiriladigan taxallus
      tags:
      - auth
      security:
      - bearerAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameCheck'
          description: ''
  /api/v1/billing/orders/:
    get:
      operationId: billing_orders_list
      description: The reader's own orders; paying happens on the provider's page.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      tags:
      - billing
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
    post:
      operationId: billing_orders_create
      description: The reader's own orders; paying happens on the provider's page.
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/billing/orders/{id}/:
    get:
      operationId: billing_orders_retrieve
      description: The reader's own orders; paying happens on the provider's page.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - billing
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/billing/orders/{id}/cancel/:
    post:
      operationId: billing_orders_cancel_create
      description: The reader's own orders; paying happens on the provider's page.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      tags:
      - billing
      security:
      - bearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/billing/plans/:
