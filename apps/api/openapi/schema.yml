paths:
  /api/v1/attempts/:
    get:
      operationId: attempts_list
      description: Submit va urinishlar tarixi — PRD P0-3.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - attempts
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttemptList'
          description: ''
    post:
      operationId: attempts_create
      description: Submit va urinishlar tarixi — PRD P0-3.
      tags:
      - attempts
      requestBody:
        content:
          application/json:
            schema:
