components:
  schemas:
    ApiToken:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        prefix:
          type: string
          readOnly: true
        scopes: {}
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - created_at
      - expires_at
      - id
      - is_active
      - last_used_at
      - name
      - prefix
      - revoked_at
    ApiTokenCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - name
      - scopes
    Attempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        problem:
          type: string
          readOnly: true
        language:
          type: string
          readOnly: true
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
        score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        time_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        memory_kb:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        failed_test_index:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        judged_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - id
      - language
      - problem
      - username
    AttemptCreate:
      type: object
      properties:
        problem:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        language:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        source_code:
          type: string
        contest:
          type: string
          nullable: true
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - language
      - problem
      - source_code
    AttemptDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        problem:
          type: string
          readOnly: true
        language:
          type: string
          readOnly: true
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
        score:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        time_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        memory_kb:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        failed_test_index:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        judged_at:
          type: string
          format: date-time
          nullable: true
        source_code:
          type: string
        compile_output:
          type: string
        test_results:
          type: array
          items:
            $ref: '#/components/schemas/AttemptTestResult'
          readOnly: true
      required:
      - created_at
      - id
      - language
      - problem
      - source_code
      - test_results
      - username
    AttemptTestResult:
      type: object
      properties:
        index:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        verdict:
          $ref: '#/components/schemas/VerdictEnum'
        time_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        memory_kb:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - index
      - verdict
    CheckerTypeEnum:
      enum:
      - standard
      - special
      - interactive
      type: string
      description: |-
        * `standard` - Standart
        * `special` - Maxsus
        * `interactive` - Interactive
    Contest:
      type: object
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        scoring_type:
          $ref: '#/components/schemas/ScoringTypeEnum'
        is_rated:
          type: boolean
        is_virtual:
          type: boolean
        freeze_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Oxirgi N daqiqada standings muzlatiladi
        is_running:
          type: boolean
          readOnly: true
        is_finished:
          type: boolean
          readOnly: true
        is_frozen:
          type: boolean
          readOnly: true
      required:
      - end_at
      - is_finished
      - is_frozen
      - is_running
      - slug
      - start_at
      - title
    ContestDetail:
      type: object
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        scoring_type:
          $ref: '#/components/schemas/ScoringTypeEnum'
        is_rated:
          type: boolean
        is_virtual:
          type: boolean
        freeze_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Oxirgi N daqiqada standings muzlatiladi
        is_running:
          type: boolean
          readOnly: true
        is_finished:
          type: boolean
          readOnly: true
        is_frozen:
          type: boolean
          readOnly: true
        description:
          type: string
        problems:
