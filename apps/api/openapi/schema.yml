components:
  schemas:
    AccessEnum:
      enum:
      - free
      - qvant
      - paid
      type: string
      description: |-
        * `free` - Free
        * `qvant` - Qvant
        * `paid` - Paid
    ActivityEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/ActivityEventKindEnum'
        ref_type:
          type: string
          maxLength: 24
        ref_id:
          type: string
          maxLength: 120
        data: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
    ActivityEventKindEnum:
      enum:
      - solved
      - rating
      - qvant
      - contest
      - quest
      type: string
      description: |-
        * `solved` - Masala yechildi
        * `rating` - Reyting o'zgardi
        * `qvant` - Qvant
        * `contest` - Musobaqaga yozildi
        * `quest` - Vazifa bajarildi
    AlphabetEnum:
      enum:
      - new
      - old
      type: string
      description: |-
        * `new` - new
        * `old` - old
    AnalyticsBatch:
      type: object
      description: |-
        Hodisalar partiyasi.

        Bir sahifada bir nechta hodisa yig'iladi va BITTA so'rovda yuboriladi:
        har hodisa uchun alohida so'rov mobil tarmoqda yo'qolardi va sahifa
        yuklanishini sekinlashtirardi.
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsEventIn'
      required:
      - events
    AnalyticsEventIn:
      type: object
      description: Bitta funnel hodisasi (qaror 17).
      properties:
        name:
          type: string
          maxLength: 48
        path:
          type: string
