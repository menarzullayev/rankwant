    MineProblem:
      type: object
      description: |-
        Muallif yuzasi (ADR-0025): o'z DRAFT masalasini boshqaradi.

        `is_public` faqat O'QISH — nashr staff-ops qarori (masala sifati,
        testlar to'plami va reyting tozaligi nashrdan oldin ko'rib chiqiladi).

        The statement's separate sections (`input_format`, `output_format`,
        `note`) are writable too: the problem page draws them as their own
        blocks, so an author who could only write `statement` had nowhere to put
        them. Limits stay read-only — calibrating them is part of the staff
        review (ADR-0052), the author only sees what will apply.
      properties:
        slug:
          type: string
          maxLength: 100
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 200
        statement:
          type: string
          description: Markdown + LaTeX
        input_format:
          type: string
          description: Markdown + LaTeX
        output_format:
          type: string
          description: Markdown + LaTeX
        note:
          type: string
          description: Markdown + LaTeX
        editorial:
          type: string
          description: Markdown + LaTeX
        statement_locale:
          type: string
          readOnly: true
        difficulty:
          type: integer
          maximum: 3500
          minimum: 800
          description: 800–3500, qadam 100
        time_limit_ms:
          type: integer
          readOnly: true
        memory_limit_kb:
          type: integer
          readOnly: true
        is_public:
          type: boolean
          readOnly: true
        review_requested_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        sample_count:
          type: integer
          readOnly: true
        hidden_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - difficulty
      - hidden_count
      - is_public
      - memory_limit_kb
      - review_requested_at
      - sample_count
      - slug
      - statement
      - statement_locale
      - time_limit_ms
      - title
      - updated_at
