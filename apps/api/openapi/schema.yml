  /api/v1/problems/:
    get:
      operationId: problems_list
      description: |-
        Ommaviy masala arxivi.

        Yozish Django admin orqali (PRD P0-2) — API faqat o'qish uchun.
      parameters:
      - in: query
        name: checker_type
        schema:
          type: string
          enum:
          - interactive
          - special
          - standard
        description: |-
          * `standard` - Standart
          * `special` - Maxsus
          * `interactive` - Interactive
      - in: query
        name: difficulty
        schema:
          type: integer
      - in: query
        name: difficulty__gte
        schema:
          type: integer
      - in: query
        name: difficulty__lte
        schema:
          type: integer
      - in: query
        name: level
        schema:
          type: string
          enum:
          - beginner
          - expert
          - hard
          - intermediate
          - master
        description: |-
          * `beginner` - Boshlang'ich
          * `intermediate` - O'rta
          * `hard` - Qiyin
          * `expert` - Ekspert
          * `master` - Master
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: topics
        schema:
          type: string
      tags:
      - problems
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProblemListList'
          description: ''
