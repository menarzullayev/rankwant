openapi: 3.0.3
info:
  title: RankWant API
  version: 1.0.0
  description: Sport dasturlash va olimpiada platformasi — ochiq REST API
paths:
  /api/v1/arena/:
    get:
      operationId: arena_list
      description: Jonli savol-javob raundi.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - arena
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArenaList'
          description: ''
  /api/v1/arena/{slug}/:
    get:
      operationId: arena_retrieve
      description: Jonli savol-javob raundi.
      parameters:
      - in: path
        name: slug
