      properties:
        available:
          type: boolean
        reason:
          type: string
      required:
      - available
      - reason
    ValueEnum:
      enum:
      - -1
      - 0
      - 1
      type: integer
      description: |-
        * `-1` - -1
        * `0` - 0
        * `1` - 1
    VerdictEnum:
      enum:
      - PENDING
      - RUNNING
      - AC
      - WA
      - TLE
      - MLE
      - OLE
      - RE
      - RE_SIGNAL
      - RE_EXIT
      - CE
      - PE
      - HACKED
      - PARTIAL
      - IE
      - WRONG_TEST
      - SKIPPED
      - COMPILE_TIMEOUT
      - IDLENESS
      - SECURITY_VIOLATION
      - CHECKER_ERROR
      - TESTING_ABORTED
      - RATE_LIMITED
      - DENIAL_OF_JUDGEMENT
      type: string
      description: |-
        * `PENDING` - Navbatda
        * `RUNNING` - Tekshirilmoqda
        * `AC` - Accepted
        * `WA` - Wrong Answer
        * `TLE` - Time Limit Exceeded
        * `MLE` - Memory Limit Exceeded
        * `OLE` - Output Limit Exceeded
        * `RE` - Runtime Error
        * `RE_SIGNAL` - Runtime Error (signal)
        * `RE_EXIT` - Runtime Error (chiqish kodi)
        * `CE` - Compilation Error
        * `PE` - Presentation Error
        * `HACKED` - Hack qilindi
        * `PARTIAL` - Qisman ball
        * `IE` - Internal Error
        * `WRONG_TEST` - Masala testi yaroqsiz
        * `SKIPPED` - O'tkazib yuborildi
        * `COMPILE_TIMEOUT` - Kompilyatsiya cho'zildi
        * `IDLENESS` - Idleness Limit Exceeded
        * `SECURITY_VIOLATION` - Xavfsizlik qoidasi buzildi
        * `CHECKER_ERROR` - Checker xatosi
        * `TESTING_ABORTED` - Tekshiruv bekor qilindi
        * `RATE_LIMITED` - Submit limiti
        * `DENIAL_OF_JUDGEMENT` - Infra nosozligi
