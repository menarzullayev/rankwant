components:
  schemas:
    AnalyticsBatch:
      type: object
      description: |-
        Hodisalar partiyasi.

        Bir sahifada bir nechta hodisa yig'iladi va BITTA so'rovda yuboriladi:
        har hodisa uchun alohida so'rov mobil tarmoqda yo'qolardi va sahifa
        yuklanishini sekinlashtirardi.
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsEventIn'
      required:
      - events
    AnalyticsEventIn:
      type: object
      description: Bitta funnel hodisasi (qaror 17).
      properties:
        name:
          type: string
          maxLength: 48
        path:
          type: string
          maxLength: 200
        props: {}
      required:
      - name
    Answer:
      type: object
      properties:
        question_id:
          type: integer
        choice_id:
          type: integer
      required:
      - choice_id
      - question_id
    AnswerResult:
      type: object
      properties:
        is_correct:
          type: boolean
        points:
          type: integer
        elapsed_ms:
          type: integer
      required:
      - elapsed_ms
      - is_correct
      - points
    ApiToken:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        prefix:
          type: string
          readOnly: true
        scopes: {}
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
      required:
      - created_at
      - expires_at
      - id
      - is_active
      - last_used_at
      - name
      - prefix
      - revoked_at
    ApiTokenCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopesEnum'
        expires_at:
          type: string
          format: date-time
      required:
      - expires_at
      - name
      - scopes
