  .count { font-size: 12px; color: var(--muted); margin: 0 0 12px; }

  /* cards: current */

  .old { padding: 20px; }

  .facts { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }

  .mini { display: flex; gap: 12px; align-items: center; padding: 12px 14px; margin-bottom: 16px; }
  .mini .txt { flex: 1; min-width: 0; }
  .mini b { display: block; }
  .mini span { font-size: 12.5px; color: var(--muted); }
  .vac { border: 1px dashed color-mix(in srgb, var(--divider) 70%, transparent); border-radius: 20px; padding: 16px; margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .vac p { margin: 4px 0 0; color: var(--text-2); max-width: 52ch; }
  .vac h2 { margin: 0; font-size: 16px; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; }
  [hidden] { display: none !important; }
</style>
</head>

const DEPT = Object.fromEntries(DATA.departments.map((d) => [d.id, d.name_uz]));
const ROLES = DATA.roles;
const HEIGHT = { 390: 844, 768: 1024, 1080: 768 };
const state = { variant: "a", screen: 390, mode: "light", dept: 0, q: "", serious: false, open: new Set([DATA.departments[0].id]), all: false };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const ava = (r, sm) => `<span class="ava${sm ? " sm" : ""}" style="--hue:${r.hue}"><img src="${PHOTO}" alt="" loading="lazy" width="64" height="64">${sm ? "" : `<i>${esc(r.badge)}</i>`}</span>`;
const status = (r) => `<span class="status${r.tone === "ok" ? "" : " warn"}">${esc(r.status_uz)}</span>`;

function visible() {
  const q = state.q.trim().toLowerCase();
  return ROLES.filter((r) => (!state.dept || r.department === state.dept) &&
    (!q || (r.title_uz + " " + r.about_uz + " " + DEPT[r.department]).toLowerCase().includes(q)));
}
const hero = () => `<p class="eyebrow">Biz haqimizda · Jamoa</p><h1 class="title">RankWant ortidagi katta, ahil jamoa</h1>
  <p class="lead">Bir nechta bo'lim, ko'plab lavozim va bitta umumiy maqsad. Jamoamiz shu qadar ahilki, majlislar bir daqiqada tugaydi va hech kim hech qachon bir-birining gapini bo'lmaydi.</p>`;
const chips = () => `<div class="chips" role="group" aria-label="Bo'limlar">` +
  [[0, "Hammasi", ROLES.length], ...DATA.departments.map((d) => [d.id, d.name_uz, ROLES.filter((r) => r.department === d.id).length])]
    .map(([id, name, n]) => `<button class="chip" data-dept="${id}" aria-pressed="${state.dept === id}">${esc(name)} <small>${n}</small></button>`).join("") + "</div>";
const vacancy = () => `<section class="vac"><div><h2>Bo'sh o'rinlar</h2><p>Hozircha barcha lavozimlar band — bitta nomzod hammasiga mos keldi. Lekin haqiqiy hissa qo'shmoqchi bo'lsangiz, eshik ochiq.</p></div><a class="btn primary" href="#">Telegram'da yozish</a></section>`;

function oldPage() {
  const list = visible();
  return hero() + `<div class="stats4">${[[24, "lavozim"], [12, "bo'lim"], [1, "inson"], [0, "kelishmovchilik"]].map(([n, l]) => `<div class="card"><b>${n}</b><span>${l}</span></div>`).join("")}</div>
  <div class="tools-old">${chips()}<div class="rowx"><input class="field" type="search" placeholder="Lavozim qidirish" value="${esc(state.q)}"><label style="white-space:nowrap;display:inline-flex;gap:6px;align-items:center;min-height:44px"><input type="checkbox" id="oldserious" ${state.serious ? "checked" : ""}> Jiddiy rejim</label></div></div>
  ${state.serious ? `<p class="count">1 kishi, hazilsiz.</p>` + founder(true) : `<p class="count">${list.length} ta lavozim ko'rsatilmoqda · ularni egallagan odamlar soni: 1</p>
  <div class="grid">${list.map((r) => `<article class="card old"><p class="dept">${esc(DEPT[r.department])}</p><div class="who">${ava(r)}<div><h2>${esc(NAME)}</h2><p class="role">${esc(r.title_uz)}</p></div></div>
    <p class="about">${esc(r.about_uz)}</p>${status(r)}<div class="acts"><button class="btn">Batafsil</button><a class="btn icon" href="#" aria-label="Telegram: ${esc(NAME)}">T</a><a class="btn icon" href="#" aria-label="GitHub: ${esc(NAME)}">G</a></div></article>`).join("")}</div>`}` + vacancy();
}

function founder(old) {
  return `<section class="card founder"><div class="ph" role="img" aria-label="${esc(NAME)} rasmi"></div><div>
    <p class="eyebrow" style="margin:0 0 4px">${old ? "Jiddiy rejim" : "Asoschi"}</p><h2>${esc(NAME)}</h2><p class="role">Asoschi va yagona ishlab chiquvchi</p>
    <p class="about">RankWant — bir kishi tomonidan qurilayotgan platforma: backend, frontend, judge, dizayn va kontent bitta qo'lda. ${old ? "Yuqoridagi" : "Hazil rejimidagi"} lavozimlar hazil, ish esa haqiqiy.</p>
    ${old ? "" : `<div class="facts"><span>Django · Next.js · Go</span><span>35 dasturlash tili</span><span>10 til interfeysi</span><span>Toshkent</span></div>`}
    <div class="acts" style="margin-top:8px"><a class="btn" href="#">Telegram</a><a class="btn" href="#">GitHub</a></div></div></section>`;
}

function row(r) {
  return `<details class="card rowc"><summary>${ava(r, true)}<div class="txt"><h2>${esc(r.title_uz)}</h2><p class="by">${esc(NAME)} · ${esc(DEPT[r.department])}</p>
    <p class="teaser">${esc(r.about_uz)}</p></div>${status(r)}</summary>
    <div class="body"><p>${esc(r.about_uz)}</p><dl class="more"><dt>Hisobot beradi</dt><dd>${esc(r.reports_to_uz)}</dd><dt>Hamkasblari</dt><dd>o'zi</dd></dl></div></details>`;
}

function newPage() {
  const list = visible();
  const tools = `<div class="tools">
    <span class="switch" role="group" aria-label="Ko'rinish"><button data-serious="0" aria-pressed="${!state.serious}">Hazil</button><button data-serious="1" aria-pressed="${state.serious}">Jiddiy</button></span>
    ${state.serious ? "" : `<select class="field" aria-label="Bo'lim">${[[0, "Barcha bo'limlar"], ...DATA.departments.map((d) => [d.id, d.name_uz])].map(([id, n]) => `<option value="${id}" ${state.dept === id ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
    <input class="field" type="search" placeholder="Lavozim qidirish" aria-label="Lavozim qidirish" value="${esc(state.q)}">${chips()}`}</div>`;
  if (state.serious) {
    return `<p class="eyebrow">Biz haqimizda · Jamoa</p><h1 class="title">RankWant'ni kim quryapti</h1><p class="lead">Bitta odam. Quyida — hazilsiz.</p>` + tools + founder(false) +
      `<section class="vac"><div><h2>Hissa qo'shmoqchimisiz?</h2><p>Masala mualliflari, tarjimonlar va sinovchilar kerak. Yozing — javob beraman.</p></div><a class="btn primary" href="#">Telegram'da yozish</a></section>`;
  }
  let body;
  if (!list.length) body = `<p class="count" role="status">Bunday lavozim hali ochilmagan. Ochilsa, kim egallashi ma'lum.</p>`;
  else if (state.variant === "a") {
    const filtered = state.dept || state.q;
    body = DATA.departments.filter((d) => list.some((r) => r.department === d.id)).map((d) => {
      const rs = list.filter((r) => r.department === d.id);
      const open = filtered || state.open.has(d.id) || state.screen >= 768;
      const head = state.screen >= 768 ? `<h3 class="section-h">${esc(d.name_uz)} <small>${rs.length}</small></h3>`
        : `<h3 class="section-h"><button class="fold" data-fold="${d.id}" aria-expanded="${!!open}">${esc(d.name_uz)} <small>${rs.length}</small>${CHEV}</button></h3>`;
      return head + (open ? `<div class="rows">${rs.map(row).join("")}</div>` : "");
    }).join("");
  } else {
    const limit = state.all || state.dept || state.q ? list.length : (state.screen >= 768 ? 12 : 8);
    body = `<div class="rows">${list.slice(0, limit).map(row).join("")}</div>` +
      (limit < list.length ? `<button class="btn moreb" data-all="1">Yana ${list.length - limit} ta lavozimni ko'rsatish</button>` : "");
  }
  return hero() + `<p class="statline"><span><b>24</b> lavozim</span><span><b>12</b> bo'lim</span><span><b>1</b> inson</span><span><b>0</b> kelishmovchilik</span></p>` + tools +
    `<p class="count" role="status">${list.length} ta lavozim · ularni egallagan odamlar soni: 1</p>` + body +
    `<a class="card mini" href="#" data-serious-link="1" style="text-decoration:none;color:inherit;margin-top:20px">${ava({ hue: 262, badge: "" }, true)}<span class="txt"><b>Bularning hammasi — ${esc(NAME)}</b><span>Hazilsiz ko'rinish, havolalar va aloqa</span></span>${CHEV.replace("<svg", '<svg width="18" height="18"')}</a>` + vacancy();
}

const EXPLAIN = {
  old: `<h3>Hozirgi holat</h3><ul><li>Telefonda juda uzun — o'lchovga qarang.</li><li>Chiplar 6–7 qator.</li><li>Har kartada bir xil ism sarlavha, va ikki bir xil havola.</li><li>«Jiddiy rejim»da chiplar va hazil sonlar qoladi, yopishqoq panel kartani yopadi.</li><li>Holat havolada saqlanmaydi.</li></ul>`,
  a: `<h3>A. Bo'limlar bo'yicha</h3><ul><li>Lavozimlar 12 bo'lim sarlavhasi ostida; telefonda bo'lim bosilganda ochiladi (birinchisi ochiq).</li><li>Karta sarlavhasi — <b>lavozim</b>; ism kichik qatorda.</li><li>Kartani bosganda tavsif ochiladi.</li><li>Telegram/GitHub bitta joyda — pastdagi kartada va jiddiy ko'rinishda.</li><li>Telefonda chiplar o'rniga bitta tanlash ro'yxati.</li></ul><p style="margin:8px 0 0"><b>Narxi:</b> telefonda 24 lavozimning ko'pi yopiq bo'limlarda.</p>`,
  b: `<h3>B. Ixcham ro'yxat</h3><ul><li>Bitta tekis ro'yxat; telefonda birinchi 8 ta, keyin «Yana ko'rsatish».</li><li>Qolgani A bilan bir xil: sarlavha — lavozim, kartani bosganda tavsif, havolalar bitta joyda.</li></ul><p style="margin:8px 0 0"><b>Narxi:</b> bo'lim tuzilmasi faqat filtr orqali ko'rinadi.</p>`,
};
const BOTH = `<p style="margin:8px 0 0"><b>Ikkala variantda:</b> «Hazil / Jiddiy» almashtirgich alohida ko'rinish beradi (chiplar va hazil sonlar yo'qoladi); holat havolada (yuqoridagi manzil qatoriga qarang); sonlar bitta qatorda.</p>`;

function render() {
  document.documentElement.classList.toggle("dark", state.mode === "dark");
  const device = document.getElementById("device");
  device.style.width = state.screen + "px";
  const page = document.getElementById("page");
  page.innerHTML = state.variant === "old" ? oldPage() : newPage();
  const params = [];
  if (state.variant !== "old") {
    if (state.serious) params.push("jiddiy=1");
    if (state.dept && !state.serious) params.push("bolim=" + DEPT[state.dept].toLowerCase().replace(/[^a-z]+/g, "-"));
    if (state.q && !state.serious) params.push("q=" + encodeURIComponent(state.q));
  }
  document.getElementById("addr").textContent = "/team" + (params.length ? "?" + params.join("&") : "");
  document.getElementById("explain").innerHTML = EXPLAIN[state.variant] + (state.variant === "old" ? "" : BOTH);
  const h = device.offsetHeight - 33, vh = HEIGHT[state.screen];
  const first = page.querySelector(".old, .rowc, .founder");
  const top = first ? Math.round(first.getBoundingClientRect().top - page.getBoundingClientRect().top) : 0;
  const stops = page.querySelectorAll("a, button, input, select, summary").length;
  const heads = [...page.querySelectorAll("h2")].map((x) => x.textContent);
  document.getElementById("metric").innerHTML =
    `<span>Sahifa balandligi</span><span>${h} px</span><span>Ekranlar soni</span><span>${(h / vh).toFixed(1)}</span>` +
    `<span>Birinchi kartagacha</span><span>${top} px</span><span>Klaviatura to'xtash joylari</span><span>${stops}</span>` +
    `<span>Turli xil sarlavhalar (h2)</span><span>${new Set(heads).size} / ${heads.length}</span>`;
  document.getElementById("share").innerHTML = state.variant === "old"
    ? `<div class="share"><div class="img">RankWant</div><div class="t"><b>RankWant — reyting xohlaganlar uchun</b>Sport dasturlash va informatika olimpiadasi platformasi… · rankwant.uz</div></div>`
    : `<div class="share"><div class="img photo"></div><div class="t"><b>Jamoa — 24 lavozim, 1 inson · RankWant</b>RankWant'ni kim quryapti: 12 bo'lim, 24 lavozim va ularning hammasini egallagan bitta odam. · rankwant.uz/team</div></div>`;
  for (const id of ["variant", "screen", "mode"]) document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute("aria-pressed", String(String(state[id]) === b.dataset.v)));
}

document.querySelector("header.bar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const key = b.parentElement.id; state[key] = key === "screen" ? Number(b.dataset.v) : b.dataset.v;
  render();
});
const page = document.getElementById("page");
page.addEventListener("click", (e) => {
  const t = e.target;
  const chip = t.closest("[data-dept]"); if (chip) { state.dept = Number(chip.dataset.dept); state.all = false; return render(); }
  const s = t.closest("[data-serious]"); if (s) { state.serious = s.dataset.serious === "1"; return render(); }
  if (t.closest("[data-serious-link]")) { e.preventDefault(); state.serious = true; render(); document.getElementById("device").scrollIntoView({ block: "start" }); return; }
  const f = t.closest("[data-fold]"); if (f) { const id = Number(f.dataset.fold); state.open.has(id) ? state.open.delete(id) : state.open.add(id); return render(); }
  if (t.closest("[data-all]")) { state.all = true; return render(); }
  if (t.closest("a")) e.preventDefault();
});
page.addEventListener("change", (e) => {
  if (e.target.matches("select")) { state.dept = Number(e.target.value); render(); }
  if (e.target.id === "oldserious") { state.serious = e.target.checked; render(); }
});
page.addEventListener("input", (e) => {
  if (!e.target.matches("input[type=search]")) return;
  state.q = e.target.value; const at = e.target.selectionStart; render();
  const again = page.querySelector("input[type=search]"); if (again) { again.focus(); again.setSelectionRange(at, at); }
});
render();
</script>
</body>
</html>
