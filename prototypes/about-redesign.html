 kodi bilan tugadi.", "about.verdicts.cause.re_exit": "`System.exit(1)` yoki `abort()` ishlatmang; `return 0` bilan chiqing.", "about.verdicts.example.re_exit": "C++ da `exit(1)` o'rniga `return 0` — RE_EXIT.", "about.verdicts.event.re": "Eski umumiy RE kodi (tarixiy yozuvlar).", "about.verdicts.cause.re": "Yangi urinishlarda odatda RE_SIGNAL yoki RE_EXIT ko'rasiz.", "about.verdicts.example.re": "Arxivdagi eski urinishda `RE` qolgan bo'lishi mumkin.", "about.verdicts.event.partial": "Qisman ball — ba'zi testlar o'tdi (IOI uslubi).", "about.verdicts.cause.partial": "Qaysi testlar o'tganini ko'ring; qolganlar uchun yechimni yaxshilang.", "about.verdicts.example.partial": "10 testdan 7 tasi to'g'ri — PARTIAL (musobaqa rejimiga bog'liq).", "about.verdicts.event.skipped": "Test o'tkazib yuborildi (maxsus rejim yoki sozlama).", "about.verdicts.cause.skipped": "Odatiy masala yuborishida kam uchraydi; staff izohiga qarang.", "about.verdicts.example.skipped": "Ba'zi musobaqalarda validator yiqilganda keyingi test SKIPPED bo'lishi mumkin.", "about.verdicts.event.hacked": "Qabul qilingan yechim hack testida yiqildi.", "about.verdicts.cause.hacked": "Bu hack/jury jarayoni; oddiy WA emas — shart va cheklovlarni qayta o'qing.", "about.verdicts.example.hacked": "Boshqasining AC kodi maxsus testda WA bo'lsa, asl yechim HACKED bo'lishi mumkin.", "about.verdicts.event.wrong_test": "Test yaroqsiz — muammo masala/hakam tomonda.", "about.verdicts.cause.wrong_test": "Sizning kodingiz emas; muallifga xabar bering yoki kuting.", "about.verdicts.example.wrong_test": "Noto'g'ri checker yoki imkonsiz cheklov — WRONG_TEST.", "about.verdicts.event.checker_error": "Checker (solish) dasturida ichki xato.", "about.verdicts.cause.checker_error": "Foydalanuvchi aybi emas; qayta urinib ko'ring, muammo davom etsa xabar bering.", "about.verdicts.example.checker_error": "Checker crash qilsa — CHECKER_ERROR, WA emas.", "about.verdicts.event.ie": "Ichki xato (Internal Error) — tizim yoki masala sozlashida muammo.", "about.verdicts.cause.ie": "Kodni o'zgartirish shart emas; biroz kutib qayta yuboring.", "about.verdicts.example.ie": "Vaqtincha judge nosozligi — IE; keyin o'sha kod AC bo'lishi mumkin.", "about.verdicts.event.security_violation": "Sandbox xavfsizlik qoidasi buzildi.", "about.verdicts.cause.security_violation": "Fayl/tarmoq chaqiruvi, chetlab o'tish urinishi — ruxsat etilmagan.", "about.verdicts.example.security_violation": "Tashqi fayl ochish yoki `system()` chaqiruvi — SECURITY_VIOLATION.", "about.verdicts.event.testing_aborted": "Oldingi natija bekor qilindi — qayta tekshiruv boshlandi.", "about.verdicts.cause.testing_aborted": "Rejudge yoki hack jarayoni; yangi verdict kelguncha kuting.", "about.verdicts.example.testing_aborted": "Staff rejudge qilganda bir lahza TESTING_ABORTED ko'rinadi.", "about.verdicts.event.rate_limited": "Submit tezligi chegarasi — yuborish rad etildi (429).", "about.verdicts.cause.rate_limited": "Retry-After yoki xabardagi kutish vaqtini kuting; spam qilmang.", "about.verdicts.example.rate_limited": "1 daqiqada juda ko'p yuborish — RATE_LIMITED (tarixda qolishi mumkin).", "about.verdicts.event.denial_of_judgement": "Judge ishini yo'qotdi — infra muammosi (navbat qayta urinmadi).", "about.verdicts.cause.denial_of_judgement": "Sizning aybingiz emas; qayta yuboring; muammo takrorlansa support.", "about.verdicts.example.denial_of_judgement": "Deploy vaqtida navbatdagi urinish DENIAL_OF_JUDGEMENT bo'lishi mumkin."}, "langs": [{"code": "ada14", "name": "Ada", "version": "(GNAT 14)"}, {"code": "nasm216", "name": "Assembly", "version": "(NASM 2.16, x86-64)"}, {"code": "c17", "name": "C", "version": "17"}, {"code": "csharp14", "name": "C#", "version": "14 (.NET 10)"}, {"code": "cpp23", "name": "C++", "version": "23"}, {"code": "caml53", "name": "Caml", "version": "(OCaml 5.3 toplevel)"}, {"code": "cobol32", "name": "COBOL", "version": "(GnuCOBOL 3.2)"}, {"code": "lisp25", "name": "Common Lisp", "version": "(SBCL 2.5)"}, {"code": "d140", "name": "D", "version": "(LDC 1.40)"}, {"code": "dart313", "name": "Dart", "version": "3.13"}, {"code": "fsharp10", "name": "F#", "version": "10 (.NET 10)"}, {"code": "fortran14", "name": "Fortran", "version": "(GFortran 14)"}, {"code": "go124", "name": "Go", "version": "1.24"}, {"code": "haskell96", "name": "Haskell", "version": "(GHC 9.6)"}, {"code": "java21", "name": "Java", "version": "21"}, {"code": "js24", "name": "JavaScript", "version": "(Node.js 24)"}, {"code": "julia113", "name": "Julia", "version": "1.13"}, {"code": "kotlin24", "name": "Kotlin", "version": "2.4"}, {"code": "lua54", "name": "Lua", "version": "5.4"}, {"code": "objc14", "name": "Objective-C", "version": "(GCC 14, GNUstep)"}, {"code": "ocaml53", "name": "OCaml", "version": "5.3"}, {"code": "pascal322", "name": "Pascal", "version": "(Free Pascal 3.2)"}, {"code": "perl540", "name": "Perl", "version": "5.40"}, {"code": "php84", "name": "PHP", "version": "8.4"}, {"code": "powershell76", "name": "PowerShell", "version": "7.6"}, {"code": "prolog92", "name": "Prolog", "version": "(SWI-Prolog 9.2)"}, {"code": "pypy73", "name": "PyPy", "version": "7.3"}, {"code": "py313", "name": "Python", "version": "3.13"}, {"code": "r45", "name": "R", "version": "4.5"}, {"code": "ruby33", "name": "Ruby", "version": "3.3"}, {"code": "rust185", "name": "Rust", "version": "1.85"}, {"code": "scala39", "name": "Scala", "version": "3.9"}, {"code": "swift60", "name": "Swift", "version": "6.0"}, {"code": "ts24", "name": "TypeScript", "version": "(Node.js 24)"}, {"code": "vbnet17", "name": "Visual Basic .NET", "version": "17.13 (.NET 10)"}], "std": {"ada14": "with Ada.Long_Long_Integer_Text_IO;\n\nprocedure Main is\n   A, B : Long_Long_Integer;\nbegin\n   Ada.Long_Long_Integer_Text_IO.Get (A);\n   Ada.Long_Long_Integer_Text_IO.Get (B);\n   Ada.Long_Long_Integer_Text_IO.Put (A + B, Width => 0);\nend Main;\n", "c17": "#include <stdio.h>\n\nint main(void) {\n    long long a, b;\n    if (scanf(\"%lld %lld\", &a, &b) != 2) return 0;\n    printf(\"%lld\", a + b);\n    return 0;\n}\n", "caml53": "let () =\n  Scanf.scanf \"%Ld %Ld\" (fun a b -> Printf.printf \"%Ld\" (Int64.add a b))\n", "cobol32": "       IDENTIFICATION DIVISION.\n       PROGRAM-ID. MAIN.\n       DATA DIVISION.\n       WORKING-STORAGE SECTION.\n       01 WS-LINE PIC X(128).\n       01 A PIC S9(18) COMP-5.\n       01 B PIC S9(18) COMP-5.\n       01 WS-TOTAL PIC S9(18) COMP-5.\n       01 WS-OUT PIC -Z(18)9.\n       01 WS-RAW PIC X(21).\n       01 WS-DIS PIC X(24).\n       01 WS-IDX PIC 9(2) VALUE 1.\n       01 WS-LEN PIC 9(2) VALUE 0.\n       PROCEDURE DIVISION.\n           ACCEPT WS-LINE\n           UNSTRING WS-LINE DELIMITED BY ALL SPACE\n               INTO A B\n           COMPUTE WS-TOTAL = A + B\n           MOVE WS-TOTAL TO WS-OUT\n           MOVE WS-OUT TO WS-RAW\n           MOVE SPACES TO WS-DIS\n           PERFORM VARYING WS-IDX FROM 1 BY 1 UNTIL WS-IDX > 21\n               IF WS-RAW(WS-IDX:1) NOT = SPACE\n                   ADD 1 TO WS-LEN\n                   MOVE WS-RAW(WS-IDX:1) TO WS-DIS(WS-LEN:1)\n               END-IF\n           END-PERFORM\n           DISPLAY WS-DIS(1:WS-LEN) WITH NO ADVANCING\n           STOP RUN.\n", "cpp23": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n    long long a, b;\n    if (!(cin >> a >> b)) return 0;\n    cout << a + b;\n    return 0;\n}\n", "csharp14": "using System;\n\nclass Program {\n    static void Main() {\n        var parts = Console.ReadLine()!.Split(' ', StringSplitOptions.RemoveEmptyEntries);\n        Console.Write(long.Parse(parts[0]) + long.Parse(parts[1]));\n    }\n}\n", "d140": "import std.stdio;\n\nvoid main() {\n    long a, b;\n    if (readf(\"%d %d\", &a, &b) != 2) return;\n    write(a + b);\n}\n", "dart313": "import 'dart:io';\n\nvoid main() {\n  final parts = stdin.readLineSync()!.split(RegExp(r'\\s+'));\n  stdout.write(int.parse(parts[0]) + int.parse(parts[1]));\n}\n", "fortran14": "program main\n  implicit none\n  integer(8) :: a, b\n  read *, a, b\n  write(*, '(I0)', advance='no') a + b\nend program main\n", "fsharp10": "[<EntryPoint>]\nlet main _ =\n    let parts = System.Console.ReadLine().Split(' ')\n    System.Console.Write(int64 parts.[0] + int64 parts.[1])\n    0\n", "go124": "package main\n\nimport \"fmt\"\n\nfunc main() {\n    var a, b int64\n    if _, err := fmt.Scan(&a, &b); err != nil {\n        return\n    }\n    fmt.Print(a + b)\n}\n", "haskell96": "main = do\n  line <- getLine\n  let [sa, sb] = words line\n  putStr (show (read sa + read sb :: Integer))\n", "java21": "import java.io.*;\nimport java.util.*;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        var br = new BufferedReader(new InputStreamReader(System.in));\n        var st = new StringTokenizer(br.readLine());\n        long a = Long.parseLong(st.nextToken());\n        long b = Long.parseLong(st.nextToken());\n        System.out.print(a + b);\n    }\n}\n", "js24": "const fs = require(\"fs\");\nconst input = fs.readFileSync(0, \"utf8\").trim().split(/\\s+/);\nif (input.length >= 2) {\n  process.stdout.write(String(Number(input[0]) + Number(input[1])));\n}\n", "julia113": "function solve()\n    s = readline()\n    sp = findfirst(' ', s)\n    a = parse(Int64, s[1:sp - 1])\n    b = parse(Int64, s[sp + 1:end])\n    print(a + b)\nend\nsolve()\n", "kotlin24": "fun main() {\n    val (a, b) = readln().split(\" \").map { it.toLong() }\n    print(a + b)\n}\n", "lisp25": "(princ (+ (read) (read)))\n", "lua54": "local line = io.read(\"*l\")\nlocal a, b = line:match(\"(%S+)%s+(%S+)\")\nio.write(tonumber(a) + tonumber(b))\n", "nasm216": "default rel\nsection .bss\ninbuf: resb 64\noutbuf: resb 32\n\nsection .text\nglobal _start\n\n_start:\n    mov rax, 0\n    mov rdi, 0\n    mov rsi, inbuf\n    mov rdx, 64\n    syscall\n    mov rdi, inbuf\n    call parse_int\n    mov r12, rax\n    call skip_sep\n    call parse_int\n    add rax, r12\n    call print_int\n    mov rax, 60\n    xor rdi, rdi\n    syscall\n\nskip_sep:\n.s:\n    mov al, [rdi]\n    cmp al, '-'\n    je .ret\n    cmp al, '0'\n    jb .n\n    cmp al, '9'\n    jbe .ret\n.n:\n    cmp byte [rdi], 0\n    je .ret\n    cmp byte [rdi], 10\n    je .ret\n    inc rdi\n    jmp .s\n.ret:\n    ret\n\nparse_int:\n    xor rax, rax\n    xor r11, r11\n    cmp byte [rdi], '-'\n    jne .pos\n    mov r11, 1\n    inc rdi\n.pos:\n.loop:\n    movzx rcx, byte [rdi]\n    cmp cl, '0'\n    jb .done\n    cmp cl, '9'\n    ja .done\n    imul rax, rax, 10\n    sub cl, '0'\n    add rax, rcx\n    inc rdi\n    jmp .loop\n.done:\n    test r11, r11\n    jz .ret\n    neg rax\n.ret:\n    ret\n\nprint_int:\n    cmp rax, 0\n    jne .nz\n    mov byte [outbuf], '0'\n    mov rsi, outbuf\n    mov rdx, 1\n    jmp .write\n.nz:\n    test rax, rax\n    jns .pos\n    mov byte [outbuf], '-'\n    mov rsi, outbuf\n    mov rdx, 1\n    push rax\n    mov rax, 1\n    mov rdi, 1\n    syscall\n    pop rax\n    neg rax\n.pos:\n    mov rbx, outbuf\n    add rbx, 31\n    xor r13, r13\n.loop:\n    xor rdx, rdx\n    mov rcx, 10\n    div rcx\n    dec rbx\n    add dl, '0'\n    mov [rbx], dl\n    inc r13\n    test rax, rax\n    jnz .loop\n    mov rsi, rbx\n    mov rdx, r13\n.write:\n    mov rax, 1\n    mov rdi, 1\n    syscall\n    ret\n", "objc14": "#import <stdio.h>\n\nint main(void) {\n    long long a, b;\n    if (scanf(\"%lld %lld\", &a, &b) != 2) return 0;\n    printf(\"%lld\", a + b);\n    return 0;\n}\n", "ocaml53": "let () =\n  Scanf.scanf \"%Ld %Ld\" (fun a b -> Printf.printf \"%Ld\" (Int64.add a b))\n", "pascal322": "program Main;\nvar a, b: int64;\nbegin\n  readln(a, b);\n  write(a + b);\nend.\n", "perl540": "my $line = <STDIN>;\nchomp $line;\nmy ($a, $b) = split ' ', $line;\nprint $a + $b;\n", "php84": "<?php\n$in = trim(fgets(STDIN));\nif ($in === '') { exit(0); }\n$parts = preg_split('/\\s+/', $in);\necho (int)$parts[0] + (int)$parts[1];\n", "powershell76": "$line = [Console]::In.ReadLine()\n$parts = $line.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)\n[Console]::Write([int64]$parts[0] + [int64]$parts[1])\n", "prolog92": ":- initialization(main, main).\n\nmain :-\n    read_line_to_string(user_input, Line),\n    split_string(Line, \" \", \" \\t\", Parts),\n    maplist(number_string, [A, B], Parts),\n    Sum is A + B,\n    format('~w', [Sum]).\n", "py313": "import sys\n\ndata = sys.stdin.read().split()\nif len(data) >= 2:\n    print(int(data[0]) + int(data[1]), end=\"\")\n", "pypy73": "import sys\n\ndata = sys.stdin.read().split()\nif len(data) >= 2:\n    print(int(data[0]) + int(data[1]), end=\"\")\n", "r45": "x <- read.table(file(\"stdin\"), nrows=1)\ncat(x[1, 1] + x[1, 2], sep=\"\")\n", "ruby33": "a, b = gets.to_s.split.map(&:to_i)\nprint(a + b)\n", "rust185": "use std::io::{self, Read};\n\nfn main() {\n    let mut s = String::new();\n    io::stdin().read_to_string(&mut s).unwrap();\n    let mut it = s.split_whitespace();\n    let a: i64 = it.next().unwrap().parse().unwrap();\n    let b: i64 = it.next().unwrap().parse().unwrap();\n    print!(\"{}\", a + b);\n}\n", "scala39": "object Main {\n  def main(args: Array[String]): Unit = {\n    val p = scala.io.StdIn.readLine().split(\" \")\n    print(p(0).toLong + p(1).toLong)\n  }\n}\n", "swift60": "import Foundation\nlet parts = readLine()!.split(separator: \" \")\nlet a = Int(parts[0])!\nlet b = Int(parts[1])!\nprint(a + b, terminator: \"\")\n", "ts24": "const fs = require(\"fs\");\nconst input = fs.readFileSync(0, \"utf8\").trim().split(/\\s+/);\nif (input.length >= 2) {\n  process.stdout.write(String(Number(input[0]) + Number(input[1])));\n}\n", "vbnet17": "Imports System\n\nModule Program\n    Sub Main()\n        Dim parts = Console.ReadLine().Split(\" \"c, StringSplitOptions.RemoveEmptyEntries)\n        Console.Write(Long.Parse(parts(0)) + Long.Parse(parts(1)))\n    End Sub\nEnd Module\n"}, "file": {"ada14": "with Ada.Text_IO;\nwith Ada.Long_Long_Integer_Text_IO;\n\nprocedure Main is\n   InF, OutF : Ada.Text_IO.File_Type;\n   A, B : Long_Long_Integer;\nbegin\n   Ada.Text_IO.Open (InF, Ada.Text_IO.In_File, \"input.txt\");\n   Ada.Long_Long_Integer_Text_IO.Get (InF, A);\n   Ada.Long_Long_Integer_Text_IO.Get (InF, B);\n   Ada.Text_IO.Close (InF);\n   Ada.Text_IO.Create (OutF, Ada.Text_IO.Out_File, \"output.txt\");\n   Ada.Long_Long_Integer_Text_IO.Put (OutF, A + B, Width => 0);\n   Ada.Text_IO.Close (OutF);\nend Main;\n", "c17": "#include <stdio.h>\n\nint main(void) {\n    FILE *in = fopen(\"input.txt\", \"r\");\n    FILE *out = fopen(\"output.txt\", \"w\");\n    if (!in || !out) return 1;\n    long long a, b;\n    if (fscanf(in, \"%lld %lld\", &a, &b) != 2) return 0;\n    fprintf(out, \"%lld\", a + b);\n    fclose(in);\n    fclose(out);\n    return 0;\n}\n", "caml53": "let () =\n  let ic = open_in \"input.txt\" in\n  let line = input_line ic in\n  close_in ic;\n  Scanf.sscanf line \"%Ld %Ld\" (fun a b ->\n    let oc = open_out \"output.txt\" in\n    Printf.fprintf oc \"%Ld\" (Int64.add a b);\n    close_out oc)\n", "cobol32": "       IDENTIFICATION DIVISION.\n       PROGRAM-ID. MAIN.\n       ENVIRONMENT DIVISION.\n       INPUT-OUTPUT SECTION.\n       FILE-CONTROL.\n           SELECT IN-FILE ASSIGN TO \"input.txt\"\n               ORGANIZATION IS LINE SEQUENTIAL.\n           SELECT OUT-FILE ASSIGN TO \"output.txt\"\n               ORGANIZATION IS LINE SEQUENTIAL.\n       DATA DIVISION.\n       FILE SECTION.\n       FD IN-FILE.\n       01 IN-REC PIC X(128).\n       FD OUT-FILE.\n       01 OUT-REC PIC X(128).\n       WORKING-STORAGE SECTION.\n       01 A PIC S9(18) COMP-5.\n       01 B PIC S9(18) COMP-5.\n       01 WS-TOTAL PIC S9(18) COMP-5.\n       01 WS-OUT PIC -Z(18)9.\n       01 WS-RAW PIC X(21).\n       01 WS-DIS PIC X(24).\n       01 WS-IDX PIC 9(2) VALUE 1.\n       01 WS-LEN PIC 9(2) VALUE 0.\n       PROCEDURE DIVISION.\n           OPEN INPUT IN-FILE\n           READ IN-FILE INTO IN-REC\n           CLOSE IN-FILE\n           UNSTRING IN-REC DELIMITED BY ALL SPACE\n               INTO A B\n           COMPUTE WS-TOTAL = A + B\n           MOVE WS-TOTAL TO WS-OUT\n           MOVE WS-OUT TO WS-RAW\n           MOVE SPACES TO WS-DIS\n           PERFORM VARYING WS-IDX FROM 1 BY 1 UNTIL WS-IDX > 21\n               IF WS-RAW(WS-IDX:1) NOT = SPACE\n                   ADD 1 TO WS-LEN\n                   MOVE WS-RAW(WS-IDX:1) TO WS-DIS(WS-LEN:1)\n               END-IF\n           END-PERFORM\n           OPEN OUTPUT OUT-FILE\n           WRITE OUT-REC FROM WS-DIS(1:WS-LEN)\n           CLOSE OUT-FILE\n           STOP RUN.\n", "cpp23": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ifstream in(\"input.txt\");\n    ofstream out(\"output.txt\");\n    long long a, b;\n    if (!(in >> a >> b)) return 0;\n    out << a + b;\n    return 0;\n}\n", "csharp14": "using System.IO;\n\nclass Program {\n    static void Main() {\n        var line = File.ReadAllText(\"input.txt\").Trim();\n        var sp = line.IndexOf(' ');\n        var a = long.Parse(line.Substring(0, sp));\n        var b = long.Parse(line.Substring(sp + 1).Trim());\n        File.WriteAllText(\"output.txt\", (a + b).ToString());\n    }\n}\n", "d140": "import std.array;\nimport std.conv;\nimport std.format;\nimport std.file;\n\nvoid main() {\n    auto parts = readText(\"input.txt\").split();\n    long a = to!long(parts[0]);\n    long b = to!long(parts[1]);\n    write(\"output.txt\", format(\"%s\", a + b));\n}\n", "dart313": "import 'dart:io';\n\nvoid main() {\n  final parts = File('input.txt').readAsStringSync().trim().split(RegExp(r'\\s+'));\n  File('output.txt').writeAsStringSync('${int.parse(parts[0]) + int.parse(parts[1])}');\n}\n", "fortran14": "program main\n  implicit none\n  integer(8) :: a, b\n  open(10, file='input.txt', status='old')\n  read(10, *) a, b\n  close(10)\n  open(11, file='output.txt', status='replace')\n  write(11, '(I0)', advance='no') a + b\n  close(11)\nend program main\n", "fsharp10": "[<EntryPoint>]\nlet main _ =\n    let parts = System.IO.File.ReadAllText(\"input.txt\").Trim().Split(' ')\n    System.IO.File.WriteAllText(\"output.txt\", string (int64 parts.[0] + int64 parts.[1]))\n    0\n", "go124": "package main\n\nimport (\n    \"fmt\"\n    \"os\"\n)\n\nfunc main() {\n    data, err := os.ReadFile(\"input.txt\")\n    if err != nil {\n        return\n    }\n    var a, b int64\n    if _, err := fmt.Sscan(string(data), &a, &b); err != nil {\n        return\n    }\n    _ = os.WriteFile(\"output.txt\", []byte(fmt.Sprintf(\"%d\", a+b)), 0o644)\n}\n", "haskell96": "main = do\n  line <- readFile \"input.txt\"\n  let [sa, sb] = words line\n  writeFile \"output.txt\" (show (read sa + read sb :: Integer))\n", "java21": "import java.io.*;\nimport java.nio.file.*;\n\npublic class Main {\n    public static void main(String[] args) throws Exception {\n        var line = Files.readString(Path.of(\"input.txt\")).trim();\n        var st = new java.util.StringTokenizer(line);\n        long a = Long.parseLong(st.nextToken());\n        long b = Long.parseLong(st.nextToken());\n        Files.writeString(Path.of(\"output.txt\"), Long.toString(a + b));\n    }\n}\n", "js24": "const fs = require(\"fs\");\nconst input = fs.readFileSync(\"input.txt\", \"utf8\").trim().split(/\\s+/);\nif (input.length >= 2) {\n  fs.writeFileSync(\"output.txt\", String(Number(input[0]) + Number(input[1])));\n}\n", "julia113": "function solve()\n    s = read(\"input.txt\", String)\n    sp = findfirst(' ', s)\n    a = parse(Int64, s[1:sp - 1])\n    b = parse(Int64, s[sp + 1:end])\n    open(\"output.txt\", \"w\") do io\n        print(io, a + b)\n    end\nend\nsolve()\n", "kotlin24": "fun main() {\n    val parts = java.io.File(\"input.txt\").readText().trim().split(\" \")\n    val sum = parts[0].toLong() + parts[1].toLong()\n    java.io.File(\"output.txt\").writeText(sum.toString())\n}\n", "lisp25": "(with-open-file (in \"input.txt\" :direction :input)\n  (let* ((a (read in))\n         (b (read in)))\n    (with-open-file (out \"output.txt\" :direction :output :if-exists :supersede)\n      (princ (+ a b) out))))\n", "lua54": "local f = io.open(\"input.txt\", \"r\")\nlocal line = f:read(\"*l\")\nf:close()\nlocal a, b = line:match(\"(%S+)%s+(%S+)\")\nlocal out = io.open(\"output.txt\", \"w\")\nout:write(tonumber(a) + tonumber(b))\nout:close()\n", "nasm216": "default rel\nsection .bss\ninbuf: resb 64\noutbuf: resb 32\n\nsection .data\ninpath: db \"input.txt\",0\noutpath: db \"output.txt\",0\n\nsection .text\nglobal _start\n\n_start:\n    mov rdi, inpath\n    xor rsi, rsi\n    mov rax, 2\n    syscall\n    mov r8, rax\n    mov rax, 0\n    mov rdi, r8\n    mov rsi, inbuf\n    mov rdx, 64\n    syscall\n    mov rbx, rax\n    cmp rbx, 63\n    ja .nulskip\n    mov byte [inbuf + rbx], 0\n.nulskip:\n    mov rax, 3\n    mov rdi, r8\n    syscall\n    mov rdi, inbuf\n    call parse_int\n    mov r12, rax\n    call skip_sep\n    call parse_int\n    add rax, r12\n    mov r13, rax\n    mov rdi, outpath\n    mov rsi, 577\n    mov rdx, 420\n    mov rax, 2\n    syscall\n    mov r8, rax\n    mov rax, r13\n    call print_int\n    mov rax, 3\n    mov rdi, r8\n    syscall\n    mov r8, 1\n    mov rax, r13\n    call print_int\n    mov rax, 60\n    xor rdi, rdi\n    syscall\n\nskip_sep:\n.s:\n    mov al, [rdi]\n    cmp al, '0'\n    jb .n\n    cmp al, '9'\n    jbe .ret\n.n:\n    cmp byte [rdi], 0\n    je .ret\n    cmp byte [rdi], 10\n    je .ret\n    inc rdi\n    jmp .s\n.ret:\n    ret\n\nparse_int:\n    xor rax, rax\n    xor r11, r11\n    cmp byte [rdi], '-'\n    jne .pos\n    mov r11, 1\n    inc rdi\n.pos:\n.loop:\n    movzx rcx, byte [rdi]\n    cmp cl, '0'\n    jb .done\n    cmp cl, '9'\n    ja .done\n    imul rax, rax, 10\n    sub cl, '0'\n    add rax, rcx\n    inc rdi\n    jmp .loop\n.done:\n    test r11, r11\n    jz .ret\n    neg rax\n.ret:\n    ret\n\nprint_int:\n    cmp rax, 0\n    jne .nz\n    mov byte [outbuf], '0'\n    mov rsi, outbuf\n    mov rdx, 1\n    jmp .write\n.nz:\n    test rax, rax\n    jns .pos\n    mov byte [outbuf], '-'\n    mov rsi, outbuf\n    mov rdx, 1\n    mov rax, 1\n    mov rdi, r8\n    syscall\n    neg rax\n.pos:\n    mov rbx, outbuf\n    add rbx, 31\n    xor r13, r13\n.loop:\n    xor rdx, rdx\n    mov rcx, 10\n    div rcx\n    dec rbx\n    add dl, '0'\n    mov [rbx], dl\n    inc r13\n    test rax, rax\n    jnz .loop\n    mov rsi, rbx\n    mov rdx, r13\n.write:\n    mov rax, 1\n    mov rdi, r8\n    syscall\n    ret\n", "objc14": "#import <stdio.h>\n\nint main(void) {\n    FILE *in = fopen(\"input.txt\", \"r\");\n    FILE *out = fopen(\"output.txt\", \"w\");\n    if (!in || !out) return 1;\n    long long a, b;\n    if (fscanf(in, \"%lld %lld\", &a, &b) != 2) return 0;\n    fprintf(out, \"%lld\", a + b);\n    fclose(in);\n    fclose(out);\n    return 0;\n}\n", "ocaml53": "let () =\n  let ic = open_in \"input.txt\" in\n  let line = input_line ic in\n  close_in ic;\n  Scanf.sscanf line \"%Ld %Ld\" (fun a b ->\n    let oc = open_out \"output.txt\" in\n    Printf.fprintf oc \"%Ld\" (Int64.add a b);\n    close_out oc)\n", "pascal322": "program Main;\nvar a, b: int64;\n    fin: text;\n    fout: text;\nbegin\n  assign(fin, 'input.txt');\n  reset(fin);\n  readln(fin, a, b);\n  close(fin);\n  assign(fout, 'output.txt');\n  rewrite(fout);\n  write(fout, a + b);\n  close(fout);\nend.\n", "perl540": "open my $in, '<', 'input.txt' or exit 1;\nmy $line = <$in>;\nclose $in;\nchomp $line;\nmy ($a, $b) = split ' ', $line;\nopen my $out, '>', 'output.txt' or exit 1;\nprint $out $a + $b;\nclose $out;\n", "php84": "<?php\n$in = trim(file_get_contents(\"input.txt\"));\nif ($in === '') { exit(0); }\n$parts = preg_split('/\\s+/', $in);\nfile_put_contents(\"output.txt\", (string)((int)$parts[0] + (int)$parts[1]));\n", "powershell76": "$line = Get-Content -Path \"input.txt\" -TotalCount 1\n$parts = $line.Split(' ', [StringSplitOptions]::RemoveEmptyEntries)\nSet-Content -Path \"output.txt\" -Value ([int64]$parts[0] + [int64]$parts[1]) -NoNewline\n", "prolog92": ":- initialization(main, main).\n\nmain :-\n    setup_call_cleanup(\n        open('input.txt', read, In, []),\n        ( read_line_to_string(In, Line),\n          split_string(Line, \" \", \" \\t\", Parts),\n          maplist(number_string, [A, B], Parts),\n          Sum is A + B,\n          setup_call_cleanup(\n              open('output.txt', write, Out, []),\n              format(Out, '~w', [Sum]),\n              close(Out))\n        ),\n        close(In)).\n", "py313": "from pathlib import Path\n\ndata = Path(\"input.txt\").read_text().split()\nif len(data) >= 2:\n    Path(\"output.txt\").write_text(str(int(data[0]) + int(data[1])))\n", "pypy73": "from pathlib import Path\n\ndata = Path(\"input.txt\").read_text().split()\nif len(data) >= 2:\n    Path(\"output.txt\").write_text(str(int(data[0]) + int(data[1])))\n", "r45": "x <- read.table(\"input.txt\", nrows = 1)\ncat(as.integer(x[1, 1] + x[1, 2]), file = \"output.txt\")\n", "ruby33": "line = File.read(\"input.txt\")\na, b = line.split.map(&:to_i)\nFile.write(\"output.txt\", (a + b).to_s)\n", "rust185": "use std::fs;\n\nfn main() {\n    let s = fs::read_to_string(\"input.txt\").unwrap();\n    let mut it = s.split_whitespace();\n    let a: i64 = it.next().unwrap().parse().unwrap();\n    let b: i64 = it.next().unwrap().parse().unwrap();\n    fs::write(\"output.txt\", format!(\"{}\", a + b)).unwrap();\n}\n", "scala39": "object Main {\n  def main(args: Array[String]): Unit = {\n    val p = scala.io.Source.fromFile(\"input.txt\").getLines().next().split(\" \")\n    val out = new java.io.PrintWriter(\"output.txt\")\n    out.print(p(0).toLong + p(1).toLong)\n    out.close()\n  }\n}\n", "swift60": "import Glibc\nlet inp = fopen(\"input.txt\", \"r\")\nvar a: Int64 = 0\nvar b: Int64 = 0\n_ = fscanf(inp, \"%lld %lld\", &a, &b)\nfclose(inp)\nlet out = fopen(\"output.txt\", \"w\")\nfprintf(out, \"%lld\", a + b)\nfclose(out)\n", "ts24": "const fs = require(\"fs\");\nconst input = fs.readFileSync(\"input.txt\", \"utf8\").trim().split(/\\s+/);\nif (input.length >= 2) {\n  fs.writeFileSync(\"output.txt\", String(Number(input[0]) + Number(input[1])));\n}\n", "vbnet17": "Imports System.IO\n\nModule Program\n    Sub Main()\n        Dim line = File.ReadAllText(\"input.txt\").Trim()\n        Dim sp = line.IndexOf(\" \"c)\n        Dim a = Long.Parse(line.Substring(0, sp))\n        Dim b = Long.Parse(line.Substring(sp + 1).Trim())\n        File.WriteAllText(\"output.txt\", (a + b).ToString())\n    End Sub\nEnd Module\n"}, "verdicts": ["PENDING", "RUNNING", "AC", "WA", "PE", "TLE", "MLE", "OLE", "IDLENESS", "CE", "COMPILE_TIMEOUT", "RE_SIGNAL", "RE_EXIT", "RE", "PARTIAL", "SKIPPED", "HACKED", "WRONG_TEST", "CHECKER_ERROR", "IE", "SECURITY_VIOLATION", "TESTING_ABORTED", "RATE_LIMITED", "DENIAL_OF_JUDGEMENT"]};

}
function verdictsNew(id) {
  const q = state.vq.trim().toLowerCase();
  const hit = (v) => !q || (v + " " + vt("event", v) + " " + vt("cause", v)).toLowerCase().includes(q);
  const groups = GROUPS.filter(([g]) => state.vg === "all" || state.vg === g).map(([g, name, list]) => [g, name, list.filter(hit)]).filter(([, , list]) => list.length);
  const total = groups.reduce((n, g) => n + g[2].length, 0);
  return `<section class="card" id="${id}"><h2>Hukm kodlari <small style="font-weight:500;font-size:13px;color:var(--muted)">${D.verdicts.length} ta</small>${anchor(id)}</h2>
    <div class="vtools"><input class="field" type="search" data-vq="1" placeholder="Kod yoki so'z: TLE, xotira…" aria-label="Hukm qidirish" value="${esc(state.vq)}">
      <span class="chips">${[["all", "Hammasi"], ...GROUPS.map(([g, n]) => [g, n])].map(([g, n]) => `<button class="lchip" style="min-height:36px" data-vg="${g}" aria-pressed="${state.vg === g}">${n}</button>`).join("")}</span></div>
    <p class="hint" role="status" style="margin:0 0 4px">${total ? `${total} ta kod` : "Bunday kod topilmadi."}</p>
    ${groups.map(([g, name, list]) => `<p class="vgroup">${name} · ${list.length}</p>` + list.map((v) =>
      `<details class="v" ${q || (g === "common" && state.screen >= 768) ? "open" : ""}><summary>${vd(v)}<span class="e">${esc(vt("event", v))}</span></summary><div class="more"><div><i>${T("verdicts.col.cause")}:</i> ${esc(vt("cause", v))}</div><div><i>${T("verdicts.col.example")}:</i> ${esc(vt("example", v))}</div></div></details>`).join("")).join("")}</section>`;
}

const stepper = () => `<div class="steps">${JOURNEY.map((k, i) => `<div class="step"><span class="num">${i + 1}</span><div><b>${T(`journey.${k}Title`)}</b><span>${T(`journey.${k}Body`)}</span></div></div>`).join("")}</div>`;
const submitCard = (id) => `<section class="card" id="${id}"><h2>${T("submit.title")}${anchor(id)}</h2><ol class="plain">${SUBMIT.map((k) => `<li>${T("submit." + k)}</li>`).join("")}</ol></section>`;
const practCard = (id) => `<section class="card" id="${id}"><h2>${T("practices.title")}${anchor(id)}</h2><ul class="plain">${PRACT.map((k) => `<li>${T("practices." + k)}</li>`).join("")}</ul></section>`;
const judgeCard = (id) => `<section class="card" id="${id}"><h2>${T("judge.title")}${anchor(id)}</h2><p class="body">${esc(T("judge.body"))}</p><p class="hint">${T("ratingTeaser")} — <a href="#" style="color:var(--accent-ink);font-weight:600">${D.t["nav.formulas"]}</a>.</p></section>`;
const rulesCard = (id) => `<section class="card" id="${id}"><h2>Qoidalar va savol-javob <span class="sample-tag">namuna</span>${anchor(id)}</h2><ul class="plain"><li>Halol o'yin: ko'chirish, bir nechta hisob.</li><li>Cheklovlar: yuborish tezligi, kod hajmi.</li><li>Musobaqa formatlari: ICPC va IOI.</li><li>Yordam: qayerga yozish kerak.</li></ul></section>`;
const hero = () => `<h1 class="title">${T("title")}</h1><p class="lead">${T("lead")}</p>`;
const cta = () => `<div class="cta"><a class="btn primary" href="#">Birinchi masalani yechish</a><a class="btn" href="#" data-goto="verdicts">Hukm kodlari</a></div>`;

function oldPage() {
  return hero() + JOURNEY.map((k, i) => `<div class="card jcard"><span class="num">${i + 1}</span><div><b>${T(`journey.${k}Title`)}</b><span>${T(`journey.${k}Body`)}</span></div></div>`).join("") + languagesOld() +
    `<div class="card"><h2>${T("judge.title")}</h2><p class="body">${esc(T("judge.body"))}</p></div>
     <div class="card"><h2>${T("notes.title")}</h2><ul class="plain">${["io", "cpp", "java"].map((k) => `<li>${T("notes." + k)}</li>`).join("")}</ul></div>
     <div class="card"><h2>${T("submit.title")}</h2><ol class="plain">${SUBMIT.map((k) => `<li>${T("submit." + k)}</li>`).join("")}</ol></div>
     <div class="card"><h2>${T("practices.title")}</h2><ul class="plain">${PRACT.map((k) => `<li>${T("practices." + k)}</li>`).join("")}</ul></div>` + verdictsOld() +
    `<div class="card"><h2>${D.t["home.openRating"]}</h2><p class="body">${T("ratingTeaser")} <a href="#" style="color:var(--accent-ink)">${D.t["nav.formulas"]}</a>.</p></div>`;
}
const TABS = [["start", "Tez boshlash"], ["languages", "Tillar"], ["verdicts", "Hukmlar"], ["system", "Tizim va qoidalar"]];
function pageA() {
  const body = { start: stepper() + cta() + submitCard("yuborish") + practCard("amaliyot"), languages: languagesNew("tillar"), verdicts: verdictsNew("hukmlar"), system: judgeCard("tizim") + rulesCard("qoidalar") }[state.tab];
  return hero() + `<div class="tabs" role="tablist" aria-label="Bo'limlar">${TABS.map(([k, n]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${n}${k === "languages" ? ` <small>${D.langs.length}</small>` : k === "verdicts" ? ` <small>${D.verdicts.length}</small>` : ""}</button>`).join("")}</div>` + body;
}
const TOC = [["yol", "Platforma yo'li"], ["yuborish", "Yuborish"], ["tillar", "Tillar"], ["hukmlar", "Hukm kodlari"], ["amaliyot", "Amaliyotlar"], ["tizim", "Tizim"], ["qoidalar", "Qoidalar"]];
function pageB() {
  return hero() + `<div class="withtoc"><nav class="toc" aria-label="Mundarija">${TOC.map(([id, n]) => `<a href="#${id}" data-toc="${id}" class="${(state.hash || "yol") === id ? "on" : ""}">${n}</a>`).join("")}</nav><div>
    <section id="yol">${stepper()}${cta()}</section>${submitCard("yuborish")}${languagesNew("tillar")}${verdictsNew("hukmlar")}${practCard("amaliyot")}${judgeCard("tizim")}${rulesCard("qoidalar")}</div></div>`;
}

const EXPLAIN = {
  old: `<h3>Hozirgi holat</h3><ul><li>Standart til — alifbo bo'yicha birinchisi (Ada).</li><li>35 chip; klaviatura bilan boshqa tilga o'tib bo'lmaydi.</li><li>Kod bo'yalmagan, nusxalash tugmasi yo'q.</li><li>24 hukm bitta tekis jadvalda.</li><li>Bo'limlarga havola berib bo'lmaydi.</li></ul>`,
  a: `<h3>A. To'rt tab</h3><ul><li>Har bo'lim alohida tab: sahifa qisqa, bir vaqtda bitta mavzu.</li><li>Tab manzilda (<b>?tab=</b>) — havola o'sha tabni ochadi.</li></ul><p style="margin:8px 0 0"><b>Narxi:</b> «sahifadan topish» (Ctrl+F) faqat ochiq tabni ko'radi; qidiruv tizimi ham asosan birinchi tabni o'qiydi.</p>`,
  b: `<h3>B. Bitta sahifa + mundarija</h3><ul><li>Hammasi bitta sahifada; yopishqoq mundarija bo'limga sakratadi (noutbukda chapda, telefonda tepada).</li><li>Har bo'limning o'z langari (<b>#hukmlar</b>).</li></ul><p style="margin:8px 0 0"><b>Narxi:</b> sahifa A dan uzunroq.</p>`,
};
const BOTH = `<p style="margin:8px 0 0"><b>Ikkala variantda:</b> standart til C++; uchta mashhur til tugma, qolgani ro'yxatda; kod bo'yalgan va nusxalanadi; hukmlar guruhlangan, qidiriladi, bosilganda sabab va misol ochiladi; platforma yo'li ixcham.</p>`;

function render(keepFocus) {
  document.documentElement.classList.toggle("dark", state.mode === "dark");
  if (!state.lang || (state.variant === "old") !== state._old) { state.lang = state.variant === "old" ? SORTED[0].code : POPULAR[0].code; state._old = state.variant === "old"; }
  const device = document.getElementById("device");
  device.style.width = state.screen + "px";
  const page = document.getElementById("page");
  page.innerHTML = state.variant === "old" ? oldPage() : state.variant === "a" ? pageA() : pageB();
  let addr = "/about";
  if (state.variant === "a" && state.tab !== "start") addr += "?tab=" + state.tab;
  if (state.variant !== "old" && state.hash) addr += "#" + state.hash;
  document.getElementById("addr").textContent = addr;
  document.getElementById("explain").innerHTML = EXPLAIN[state.variant] + (state.variant === "old" ? "" : BOTH);
  const h = page.offsetHeight, vh = HEIGHT[state.screen];
  const stops = [...page.querySelectorAll("a, button, input, select, summary, pre[tabindex]")].filter((e) => e.tabIndex >= 0 && e.offsetParent).length;
  const reach = state.variant === "old" ? "1 / " + D.langs.length : D.langs.length + " / " + D.langs.length;
  document.getElementById("metric").innerHTML = `<span>Sahifa balandligi</span><span>${h} px</span><span>Ekranlar soni</span><span>${(h / vh).toFixed(1)}</span>` +
    `<span>Klaviatura to'xtash joylari</span><span>${stops}</span><span>Klaviaturada yetadigan tillar</span><span>${reach}</span><span>Standart til</span><span>${esc((D.langs.find((l) => l.code === (state.variant === "old" ? SORTED[0].code : POPULAR[0].code)) || {}).name || "")}</span>`;
  for (const id of ["variant", "screen", "mode"]) document.querySelectorAll(`#${id} button`).forEach((b) => b.setAttribute("aria-pressed", String(String(state[id]) === b.dataset.v)));
  if (keepFocus) { const i = page.querySelector("[data-vq]"); if (i) { i.focus(); i.setSelectionRange(keepFocus, keepFocus); } }
}
document.querySelector("header.bar").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const key = b.parentElement.id; state[key] = key === "screen" ? Number(b.dataset.v) : b.dataset.v; state.hash = ""; render();
});
const page = document.getElementById("page");
page.addEventListener("click", (e) => {
  const t = e.target, g = (sel) => t.closest(sel);
  if (g("[data-lang]")) { state.lang = g("[data-lang]").dataset.lang; return render(); }
  if (g("[data-io]")) { state.io = g("[data-io]").dataset.io; return render(); }
  if (g("[data-tab]")) { state.tab = g("[data-tab]").dataset.tab; state.hash = ""; return render(); }
  if (g("[data-vg]")) { state.vg = g("[data-vg]").dataset.vg; return render(); }
  if (g("[data-anchor]")) { state.hash = g("[data-anchor]").dataset.anchor; g("[data-anchor]").textContent = "✓"; document.getElementById("addr").textContent = "/about" + (state.variant === "a" && state.tab !== "start" ? "?tab=" + state.tab : "") + "#" + state.hash; return; }
  if (g("[data-copy]")) { g("[data-copy]").textContent = "Nusxalandi ✓"; return; }
  if (g("[data-goto]")) { e.preventDefault(); if (state.variant === "a") { state.tab = "verdicts"; render(); } else { state.hash = "hukmlar"; render(); document.getElementById("hukmlar").scrollIntoView({ block: "start" }); } return; }
  if (g("[data-toc]")) { e.preventDefault(); state.hash = g("[data-toc]").dataset.toc; render(); document.getElementById(state.hash)?.scrollIntoView({ block: "start" }); return; }
  if (g("a")) e.preventDefault();
});
page.addEventListener("change", (e) => { if (e.target.matches("[data-langsel]") && e.target.value) { state.lang = e.target.value; render(); } });
page.addEventListener("input", (e) => { if (e.target.matches("[data-vq]")) { state.vq = e.target.value; render(e.target.selectionStart); } });
render();
</script>
</body>
</html>
