* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--rw-ground);
  color: var(--rw-text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;

}

/* Silliq almashish — prototipni ko'rsatishda rang sakrashi yoqimsiz. */
body, .rw-panel, .rw-chip, .rw-seg {
  transition: background-color .18s ease, border-color .18s ease, color .18s ease;
}

.rw-shell { max-width: 1180px; margin: 0 auto; padding: 28px 20px 56px; }

/* ── Sarlavha ─────────────────────────────────────────────────────── */
.rw-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
}
.rw-title { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
.rw-sub { margin: 6px 0 0; font-size: 13px; color: var(--rw-muted); max-width: 62ch; line-height: 1.55; }

  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  background: var(--rw-accent-soft); color: var(--rw-accent-ink);
}

/* ── Tugmalar ─────────────────────────────────────────────────────── */
.rw-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px; border-radius: var(--rw-radius-sm);
  border: 1px solid var(--rw-line); background: var(--rw-surface);
  color: var(--rw-text-2); font-size: 13px; font-weight: 500;
  font-family: inherit; cursor: pointer;
}
.rw-btn:hover { background: var(--rw-hover); }
.rw-btn:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(91, 140, 255, .18); }

.rw-seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--rw-line); border-radius: var(--rw-radius-sm);
  background: var(--rw-surface);
}
.rw-seg button {
  padding: 7px 13px; border: 0; background: transparent; cursor: pointer;
  color: var(--rw-muted); font-size: 12.5px; font-weight: 500; font-family: inherit;

}
.rw-seg button[aria-pressed="true"] { background: var(--rw-accent-soft); color: var(--rw-accent-ink); }

.rw-grid { display: grid; gap: 16px; }
.rw-grid--stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.rw-grid--split { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); margin-top: 16px; }
.rw-grid--trio { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 16px; }

.rw-panel {

.rw-up { color: var(--rw-ok-ink); font-weight: 600; }

/* ── Legenda ──────────────────────────────────────────────────────── */

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const {

  AreaChart, Area, PieChart, Pie, RadialBarChart, RadialBar,

/* ═══════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════

   Bularning hammasi QO'LDA yozilgan namuna. Maqsad — komponentlarni
   haqiqiy hajmda ko'rsatish, API'ni sinash emas. Haqiqiy prototipda
   bu yerda `/rating/history/`, `/problems/skills/`, `/qvant/` javoblari
   turardi.                                                          */

/* Elo kamari: unvon chegaralari va shu chegaraga tushgan nuqtalar.
   Recharts'da chegarani `ReferenceLine` `segment` bilan chizamiz — bu
   aynan `RatingChart.tsx` dagi `data.bands` ning ekvivalenti. */
const TITLE_BANDS = [

  { code: "atom",       min: 1200, max: 1400, color: "rgba(74, 222, 128, .11)" },

};

/* Musobaqa seriyasi — `rank`, `delta`, `before`/`after` maydonlari

const CONTEST_RATING = [

  { at: "2026-07-11", label: "Iyul 11", before: 1704, after: 1683, delta: -21, rank:  86, title: "Round 51", forced: false },
  { at: "2026-08-01", label: "Avg 1",  before: 1683, after: 1761, delta:  78, rank:  64, title: "Round 52", forced: false },

/* Qiyinlik bo'yicha taqsimot — `task.status` ning ustunli ko'rinishi.
   Ikkala seriya bitta toifada, ya'ni guruhlangan (`grouped`) ustunlar. */
const DIFFICULTY_VS_ATTEMPTS = [

/* Mavzu kuchi — `TopicStrength` ning yonma-yon ko'rinishi. Gorizontal
   ustun, chunki mavzu nomlari uzun. */

  { topic: "Grafiklar",    rating: 1840, solved: 42, total: 48 },

/* Qvant oqimi — kunlik topilgan va sarflangan. Ikkita maydon
   (`earned`/`spent`) — bu stacked emas, ya'ni ikkalasi ham noldan
   o'sadi va kesishadi. */
const QVANT_FLOW = [

  { day: "Se", earned:  80, spent:  90 },
  { day: "Ch", earned: 160, spent:  30 },

/* Verdikt taqsimoti — `Pie` uchun. Nomlar tarjima QILINMAYDI: Accepted,
   Time Limit Exceeded va h.k. — xalqaro atamalar, `verdict.ts` dagi bilan
   bir xil qoida. Nisbatlar o'ylab topilgan, lekin o'zaro izchil. */
const VERDICTS = [

  { name: "Compilation Error",    value:  31, key: "ce" },
  { name: "Memory Limit Exceeded",value:  17, key: "mle" },
];

/* Faollik xaritasi uchun 12 hafta × 7 kun — bu yerda ustunli issiqlik
   emas, oddiy ustun: Recharts'da heatmap yo'q, va uni `Bar` bilan
   chizish 84 ta diagramma demak (sekin va ma'nosiz). */
const ACTIVITY = Array.from({ length: 26 }, (_, i) => ({
  week: `H${i + 1}`,
  solved: [7, 12, 5, 19, 14, 9, 22, 17, 11, 6, 15, 24, 13, 8,
           18, 21, 10, 16, 4, 20, 23, 12, 9, 17, 25, 14][i],

/* ── Rang yordamchilari ───────────────────────────────────────────── */

/* Verdikt ranglari `lib/theme/verdict.ts` mantig'iga yaqin: qabul —
   yashil, chegaraviy — sariq, xato — qizil, tizim — kulrang. */
const VERDICT_COLOR = {
  ac:  "var(--rw-ok-ink)",
  wa:  "var(--rw-bad-ink)",
  tle: "var(--rw-warn-ink)",
  re:  "var(--rw-bad-ink)",
  ce:  "var(--rw-muted)",
  mle: "var(--rw-warn-ink)",
};

const AXIS = { fill: "var(--rw-faint)", fontSize: 11 };
const GRID = "var(--rw-line)";

/* Recharts'da `stroke`/`fill` — SVG atributi, `var()` ishlaydi, lekin
   ba'zi ichki hisob-kitoblar (masalan `Pie` yoylari) qiymatni to'g'ridan
   to'g'ri o'qiydi. Shuning uchun yorug'/qorong'i rejim uchun ANIQ rang
   olib, mavzu almashganda qayta render qilamiz. Aks holda `var(--x)`
   SVG gradientlarida ba'zi brauzerlarda bo'sh chiqadi. */
function useThemeTokens() {
  const [theme, setTheme] = useState(() => {
    const saved = window.localStorage.getItem("rw-proto-theme");
    return saved === "light" || saved === "dark" ? saved : "dark";
  });

  React.useEffect(() => {
    document.documentElement.setAttribute("data-rw-theme", theme);
    window.localStorage.setItem("rw-proto-theme", theme);
  }, [theme]);

  const tokens = useMemo(() => {
    const dark = theme === "dark";
    return {
      dark,
      accent:   dark ? "#7ea4ff" : "#476dc7",
      accentInk:dark ? "#7ea4ff" : "#3c66dc",
      accentSoft: dark ? "rgba(91, 140, 255, .12)" : "#eef3ff",
      ok:  dark ? "#4ade80" : "#038249",
      warn:dark ? "#fdb022" : "#b54708",
      bad: dark ? "#f87171" : "#d42c1f",
      muted: dark ? "#9aa1b2" : "#5b6376",
      faint: dark ? "#8c94a1" : "#636f85",
      line: dark ? "#232936" : "#e4e7ec",
      surface: dark ? "#141821" : "#ffffff",
      text: dark ? "#e6e9ef" : "#1d2939",
      rank: dark
        ? ["#8b94a4", "#28a95e", "#16a2b1", "#6093eb", "#a681e7", "#e9710f", "#ea6d69"]
        : ["#656e81", "#1e7e46", "#107884", "#1e67e3", "#834fde", "#af550b", "#d5231d"],
    };
  }, [theme]);

  return [theme, setTheme, tokens];
}

/* ── Umumiy bo'laklar ─────────────────────────────────────────────── */

function Card({ title, hint, action, children, bodyClass = "" }) {
  return (
    <section className="rw-panel">
      {(title || action) && (
        <div className="rw-panel__head">
          <div>
            {title && <h2 className="rw-panel__title">{title}</h2>}
            {hint && <p className="rw-panel__hint">{hint}</p>}
          </div>
          {action}
        </div>
      )}
      <div className={"rw-panel__body " + bodyClass}>{children}</div>
    </section>
  );
}

/* Tooltip — Recharts'ning standart qutisi emas, mahsulot uslubidagi
   `content` funksiyasi. `payload` bo'sh bo'lsa chizmaydi: sichqoncha
   to'r chizig'ida turganda bo'sh quti chiqmasin. */
function RwTip({ active, payload, label, unit = "" }) {
  if (!active || !payload || !payload.length) return null;
  const head = payload[0] && payload[0].payload && payload[0].payload.tooltipTitle;
  return (
    <div className="rw-tip">
      <div className="rw-tip__title">{head || label}</div>
      {payload.map((p) => (
        <div className="rw-tip__row" key={p.dataKey ?? p.name}>
          <span className="rw-swatch" style={{ background: p.color || p.stroke || p.fill }} />
          <span>{p.name}</span>
          <span className="rw-tip__val">{p.value}{unit}</span>
        </div>
      ))}
    </div>
  );
}

/* ⚠️ Recharts `<Legend>` BU SAHIFADA ISHLATILMAYDI — va buning sababi
   o'lchov bilan topilgan.

   Recharts 3.10.1'da `ResponsiveContainer` ichidagi `<Legend>` o'lcham
   hisoblashni buzadi: SVG 14×14 px (Recharts ikonkasi) bo'lib qoladi,
   ya'ni diagramma butunlay bo'sh chiqadi. O'lchandi — `DifficultySplit`
   dan `<Legend>` olib tashlanganda SVG 14×14 → 327×260 bo'ldi, boshqa
   hech narsa o'zgarmagan holda. Legend'i yo'q diagrammalar
   (`VerdictDonut`, `TopicBars`, `WeeklyActivity`, `TitleBands`,
   `RatingTrend`) boshidan to'g'ri chizilgan — ya'ni aybdor aynan
   Legend.

   Yechim: legendani diagrammadan TASHQARIDA, oddiy HTML bo'lib
   chizamiz. Bu mahsulot kodidagi `.rw-legend` naqshiga ham mos —
   `TopicStrength.tsx` va umuman RankWant panel(lar)i shunday qiladi.
   Bonus: matn `t()` kalitlariga tayyor, SVG ichidagi `foreignObject`
   kerak emas. */
function ChartLegend({ items }) {
  return (
    <div className="rw-legend">
      {items.map((it) => (
        <span className="rw-legend__item" key={it.label}>
          <span className="rw-swatch" style={{ background: it.color }} />
          {it.label}
        </span>
      ))}
    </div>
  );
}

/* Diagramma ramkasi: balandlik beriladi, `ResponsiveContainer` esa
   ota-elementdan kenglikni oladi. */
function ChartFrame({ height = 260, children }) {
  return <div style={{ width: "100%", height }}>{children}</div>;
}

function StatCard({ icon, label, value, foot, tone }) {
  return (
    <div className="rw-panel rw-stat">
      <div className="rw-stat__icon">{icon}</div>
      <p className="rw-stat__label">{label}</p>
      <p className="rw-stat__value">{value}</p>
      {foot && (
        <p className="rw-stat__foot">
          <span className={tone === "up" ? "rw-up" : tone === "down" ? "rw-down" : ""}>{foot[0]}</span>
          <span>{foot[1]}</span>
        </p>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   2. DIAGRAMMALAR
   ═══════════════════════════════════════════════════════════════════ */

/* ── 1. Reyting tarixi: ComposedChart ───────────────────────────────
   Nima uchun ComposedChart, Line emas: unvon chegaralari ham kerak.

   ⚠️ Unvon kamarlari `ReferenceLine` bilan chizilmaydi — bu o'lchandi.
   `ReferenceLine` faqat CHIZIQ tortadi (`stroke`), ya'ni ichini
   bo'yay olmaydi; `strokeOpacity={0}`, `fill` va `segment` bilan
   urinilganda faqat yorliq qoladi, bantoning o'zi ko'rinmaydi.
   To'g'ri yo'l — orqada yashirin `Bar` qatlami: `Bar` ichini
   bo'yaydi va `background` bilan Y o'qining butun kengligini oladi.

   Shu sababli diagramma `ComposedChart` VA `Bar` bilan qurilgan:
   Bar = fon bantosi, Line = haqiqiy ma'lumot.                       */
function RatingTrend({ tk }) {
  const [showBands, setShowBands] = useState(true);

  /* Har bir nuqta uchun o'sha nuqtada qaysi unvon kamari turganini
     hisoblaymiz. `Bar` shu maydonni bo'yaydi — ya'ni bantoning
     chegarasi haqiqiy reyting qiymatidan kelib chiqadi, qo'lda
     qo'yilgan to'rtburchak emas. */
  const rows = useMemo(
    () =>
      CONTEST_RATING.map((p) => {
        const band = TITLE_BANDS.find((b) => p.after >= b.min && p.after < b.max);
        return {
          ...p,
          bandCode: band ? band.code : "above",
          bandLabel: band ? TITLE_LABEL[band.code] : "Kometa+",
          bandColor: band ? tk.rank[TITLE_BANDS.indexOf(band) % tk.rank.length] : tk.rank[6],
        };
      }),
    [tk],
  );

  const dot = (props) => {
    const { cx, cy, payload } = props;
    if (cx == null || cy == null) return <g key={props.key} />;
    const rejected = payload.delta < 0;
    return (
      <circle
        key={props.key}
        cx={cx}
        cy={cy}
        r={payload.forced ? 5 : 3.5}
        fill={tk.surface}
        stroke={payload.forced ? tk.warn : rejected ? tk.bad : tk.ok}
        strokeWidth={2}
      />
    );
  };

  /* Bantoni ko'rsatish uchun `Bar` ning `background` i emas, haqiqiy
     `Bar` kerak: `background` butun diagrammani bir xil rangga
     bo'yardi. Shuning uchun har bir ustunga o'z rangi beriladi va
     `yAxisId` bilan asosiy chizig'ga bog'lanadi. */
  const BAND_BASE = 1300;
  const banded = rows.map((r) => ({
    ...r,
    bandBottom: showBands ? Math.max(BAND_BASE, r.after - 55) : BAND_BASE,
    bandHeight: showBands ? 110 : 0,
  }));

  return (
    <Card
      title="Elo reyting tarixi"
      hint="Kontests kamari · boshlang'ich 1400 · birinchi 6 musobaqada o'zgarish 1.5×"
      action={
        <div className="rw-seg">
          <button aria-pressed={showBands} onClick={() => setShowBands(true)}>Chegaralar</button>
          <button aria-pressed={!showBands} onClick={() => setShowBands(false)}>Faqat chiziq</button>
        </div>
      }
    >
      <ChartFrame height={280}>
        <ResponsiveContainer width="100%" height={280}>
          <ComposedChart data={banded} margin={{ top: 14, right: 16, bottom: 4, left: -8 }}>
            <CartesianGrid stroke={tk.line} strokeDasharray="2 4" vertical={false} />
            <XAxis
              dataKey="label"
              tick={{ fill: tk.faint, fontSize: 11 }}
              axisLine={{ stroke: tk.line }}
              tickLine={false}
            />
            <YAxis
              domain={[BAND_BASE, 2100]}
              ticks={[1400, 1600, 1800, 2000]}
              tick={{ fill: tk.faint, fontSize: 11 }}
              axisLine={false}
              tickLine={false}
            />
            <Tooltip
              content={<RwTip />}
              cursor={{ stroke: tk.accent, strokeDasharray: "3 3" }}
            />

            {/* Fon bantosi: har bir nuqta ostidagi unvon rangi. `stackId`
                ATAYLAB berilmagan — ustunlar ustma-ust emas, yonma-yon
                sohalar (guruhlangan). Sezilarli bo'lishi uchun
                shaffoflik past. */}
            <Bar
              dataKey="bandHeight"
              name="Unvon"
              fillOpacity={0.16}
              isAnimationActive={false}
              legendType="none"
            >
              {banded.map((r) => (
                <Cell key={r.at} fill={r.bandColor} />
              ))}
            </Bar>

            <Line
              type="monotone"
              dataKey="after"
              name="Reyting"
              stroke={tk.accent}
              strokeWidth={2.4}
              dot={dot}
              activeDot={{ r: 6, fill: tk.accent, stroke: tk.surface, strokeWidth: 2 }}
              isAnimationActive={true}
              animationDuration={900}
            />
            <ReferenceLine y={1400} stroke={tk.muted} strokeDasharray="4 4"
              label={{ value: "start 1400", position: "insideBottomRight",
                       fill: tk.faint, fontSize: 10 }} />
          </ComposedChart>
        </ResponsiveContainer>
      </ChartFrame>
      <div className="rw-legend">
        <span className="rw-legend__item"><span className="rw-swatch" style={{ background: tk.ok }} />Reyting o'sdi</span>
        <span className="rw-legend__item"><span className="rw-swatch" style={{ background: tk.bad }} />Reyting tushdi</span>
        <span className="rw-legend__item"><span className="rw-swatch" style={{ background: tk.warn }} />Majburiy qayta baholash</span>
      </div>
    </Card>
  );
}

/* ── 2. Unvon chegaralari: gorizontal BarChart ──────────────────────
   ⚠️ Bu diagramma ikki marta qayta yozildi va sababi muhim.

   Birinchi urinish `Bar` + `stackId` bilan edi: ko'rinmas `base`
   qatlami, ustiga `top`. Natijada FAQAT bitta ustun ko'rindi —
   sabab `stackId` da har bir ustunning O'ZI ayricha stack bo'ladi,
   ya'ni Y o'qida bitta kategoriya qoladi. Buni skrinshot ko'rsatdi.

   To'g'ri yo'l: `base` prop'i. Recharts'da HAR BIR `Bar` elementi
   `base` ni qabul qiladi — ustun `base` dan `base + value` gacha
   chiziladi. Ya'ni kenglik `[min, max]` oralig'i bo'lib chiqadi.   */
function TitleBands({ tk }) {
  const rows = TITLE_BANDS.map((b) => ({
    name: TITLE_LABEL[b.code],
    min: b.min,
    width: b.max - b.min,
    range: b.min + "–" + b.max,
  }));

  return (
    <Card
      title="Unvon chegaralari"
      hint="Har bir unvon qaysi reyting oralig'ini egallaydi · kenglik = oraliq uzunligi"
    >
      <ChartFrame height={230}>
        <ResponsiveContainer width="100%" height={230}>
          <BarChart data={rows} layout="vertical" margin={{ top: 4, right: 20, bottom: 4, left: 8 }}>
            <CartesianGrid stroke={tk.line} strokeDasharray="2 4" horizontal={false} />
            <XAxis
              type="number" domain={[0, 2200]} ticks={[0, 600, 1200, 1600, 2000]}
              tick={{ fill: tk.faint, fontSize: 11 }} axisLine={false} tickLine={false}
            />
            <YAxis
              type="category" dataKey="name" width={76} tick={{ fill: tk.muted, fontSize: 12 }}
              axisLine={false} tickLine={false}
            />
            <Tooltip content={<RwTip />} cursor={{ fill: tk.accentSoft }} />
            {/* `base` — ustunning boshlanish nuqtasi. Recharts uni har
                bir element uchun qabul qiladi, shuning uchun
                guruhlash/stack kerak emas. */}
            <Bar
              dataKey="width" name="Oraliq kengligi" radius={[0, 5, 5, 0]}
              barSize={20} base={rows.map((r) => r.min)}
            >
              {rows.map((r, i) => (
                <Cell key={r.name} fill={tk.rank[i % tk.rank.length]} fillOpacity={0.8} />
              ))}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </ChartFrame>
      <div className="rw-legend">
        {rows.map((r, i) => (
          <span className="rw-legend__item" key={r.name}>
            <span className="rw-swatch" style={{ background: tk.rank[i % tk.rank.length] }} />
            {r.name} · {r.range}
          </span>
        ))}
      </div>
    </Card>
  );
}

/* ── 4. Mavzu kuchi: gorizontal BarChart ────────────────────────────

/* ── 5. Verdikt taqsimoti: donut PieChart ───────────────────────────
   `Pie` da `innerRadius` berilsa donut bo'ladi. Markazdagi matn —
   Recharts'da `label` bilan emas, ustiga qo'yilgan oddiy HTML (SVG
   ichida absolyut joylashuv ishonchsiz).                             */
function VerdictDonut({ tk }) {
  const total = VERDICTS.reduce((sum, v) => sum + v.value, 0);
  const accepted = VERDICTS.find((v) => v.key === "ac").value;

  return (
    <Card title="Verdikt taqsimoti" hint={"Jami urinish: " + total.toLocaleString("uz")}>
      <div style={{ position: "relative" }}>
        <ChartFrame height={250}>
          <ResponsiveContainer width="100%" height={250}>
            <PieChart>
              <Pie
                data={VERDICTS} dataKey="value" nameKey="name"
                innerRadius={62} outerRadius={96} paddingAngle={2}
                stroke={tk.surface} strokeWidth={2}
                isAnimationActive={true} animationDuration={800}
              >
                {VERDICTS.map((v) => (
                  <Cell key={v.key} fill={VERDICT_COLOR[v.key]} />
                ))}
              </Pie>
              <Tooltip content={<RwTip />} />
            </PieChart>
          </ResponsiveContainer>
        </ChartFrame>
        {/* Markazdagi ko'rsatkich — diagramma ustidagi oddiy HTML. */}
        <div style={{
          position: "absolute", inset: 0, display: "flex",
          flexDirection: "column", alignItems: "center", justifyContent: "center",
          pointerEvents: "none",
        }}>
          <span style={{ fontSize: 26, fontWeight: 680, letterSpacing: "-.02em", color: tk.text }}>
            {Math.round((accepted / total) * 100)}%
          </span>
          <span style={{ fontSize: 11, color: tk.faint }}>Accepted</span>
        </div>
      </div>
      <div className="rw-legend">
        {VERDICTS.map((v) => (
          <span className="rw-legend__item" key={v.key}>
            <span className="rw-swatch" style={{ background: VERDICT_COLOR[v.key] }} />
            {v.name} · {v.value}
          </span>
        ))}
      </div>
    </Card>
  );
}

}
