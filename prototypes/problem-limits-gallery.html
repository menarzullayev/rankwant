<!DOCTYPE html>
<html lang="uz" data-rw-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vaqt / xotira cheklovi — 10 dizayn prototipi</title>
<!--
  Mustaqil prototip. Kontekst: statement-builder.html head-1 (chip-limit).
  Platforma: ProblemDescription — «Cheklovlar: {ms} ms, {mb} MB».
  Prototip qisqaroq: 2000 ms · 256 MB.
-->
<style>
  :root, [data-rw-theme="light"] {
    --dash-ground: #f9fafb; --dash-surface: #fff; --dash-line: #e4e7ec;
    --dash-text: #1d2939; --dash-muted: #667085;
    --dash-accent-ink: #3c66dc; --dash-accent-soft: #eef3ff; --dash-radius: 14px;
  }
  [data-rw-theme="dark"] {
    --dash-ground: #0b0d12; --dash-surface: #141821; --dash-line: #232936;
    --dash-text: #e6e9ef; --dash-muted: #9aa1b2;
    --dash-accent-ink: #7ea4ff; --dash-accent-soft: rgba(91, 140, 255, .12);
  }
  .stmt {
    --ground: #ede4ff; --panel: #fff; --panel-2: #f7f3ff; --panel-3: #faf8ff;
    --text: #4a2d75; --muted: #624f82; --faint: #6f5897;
    --accent: #7c3aed; --accent-ink: #7936ea; --accent-soft: #f1e9ff;
    --line: #e3daf5; --warn: #854f0b; --warn-soft: #faeeda;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.5; background: var(--dash-ground); color: var(--dash-text); }
  .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 64px; }
  .head { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; align-items: flex-start; }
  .head h1 { margin: 0; font-size: 24px; font-weight: 650; }
  .head p { margin: 6px 0 0; font-size: 13px; color: var(--dash-muted); max-width: 64ch; }
  .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--dash-surface);
    border: 1px solid var(--dash-line); border-radius: 10px; }
  .seg button { font: inherit; font-size: 12px; font-weight: 600; border: 0; cursor: pointer;
    padding: 6px 12px; border-radius: 7px; background: transparent; color: var(--dash-muted); }
  .seg button.on { background: var(--dash-accent-ink); color: #fff; }
  .pick-bar { position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--dash-ground) 92%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--dash-line); border-radius: var(--dash-radius); padding: 12px 16px;
    margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pick-bar output { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    color: var(--dash-accent-ink); background: var(--dash-accent-soft); padding: 4px 10px; border-radius: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .card { background: var(--dash-surface); border: 1px solid var(--dash-line);
    border-radius: var(--dash-radius); display: flex; flex-direction: column; overflow: hidden; }
  .card.is-picked { outline: 2px solid var(--dash-accent-ink); outline-offset: 2px; }
  .card-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--dash-line); }
  .card-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .card-head .tag { font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--dash-muted); display: inline-block; margin-top: 6px; }
  .card-head p { margin: 8px 0 0; font-size: 12.5px; color: var(--dash-muted); line-height: 1.45; }
  .preview-wrap { padding: 14px 16px 16px; flex: 1; }
  .preview { background: var(--ground); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; color: var(--text); }
  .preview .head-1 { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .preview .faint { color: var(--faint); font-size: 12px; }
  .preview .mono { font-family: var(--mono); }
  .preview .h-title { font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .preview .tsize-dummy { font-size: 11px; color: var(--faint); border: 1px dashed var(--line);
    border-radius: 6px; padding: 4px 8px; }
  .card-foot { padding: 10px 16px 14px; border-top: 1px solid var(--dash-line);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card-foot button { font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    border-radius: 8px; padding: 7px 12px; border: 1px solid var(--dash-line); background: var(--dash-surface); }
  .card-foot button.primary { background: var(--dash-accent-ink); color: #fff; border-color: transparent; }

  .lim-ui { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 1 P0 */
  .l1.lim-ui {
    font-size: 12.5px; font-weight: 600; color: var(--warn); background: var(--warn-soft);
    border-radius: 999px; padding: 4px 11px;
  }

  /* 2 Ikki pill */
  .l2.lim-ui { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .l2.lim-ui span {
    font-size: 11px; font-weight: 650; color: var(--warn); background: var(--warn-soft);
    border-radius: 999px; padding: 4px 10px;
  }
  .l2.lim-ui .mem { color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); }

  /* 3 Ikonka */
  .l3.lim-ui { display: inline-flex; flex-wrap: wrap; gap: 10px; align-items: center;
    font-size: 12px; font-weight: 600; color: var(--muted); }
  .l3.lim-ui .item { display: inline-flex; align-items: center; gap: 5px; }
  .l3.lim-ui svg { width: 15px; height: 15px; stroke: var(--faint); fill: none; stroke-width: 1.7; flex: none; }

  /* 4 Mono */
  .l4.lim-ui {
    font-family: var(--mono); font-size: 11.5px; color: var(--faint);
    background: var(--panel-3); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
  }
  .l4.lim-ui b { color: var(--text); font-weight: 650; }

  /* 5 Outline */
  .l5.lim-ui {
    font-size: 12px; font-weight: 650; color: var(--warn); background: transparent;
    border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line));
    border-radius: 999px; padding: 4px 12px;
  }

  /* 6 Binafsha accent */
  .l6.lim-ui {
    font-size: 12px; font-weight: 650; color: var(--accent-ink); background: var(--accent-soft);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px;
  }

  /* 7 Yorliqli */
  .l7.lim-ui { display: inline-flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: var(--faint); }
  .l7.lim-ui span { display: inline-flex; align-items: baseline; gap: 4px; }
  .l7.lim-ui b { font-size: 12px; color: var(--text); font-weight: 700; }

  /* 8 Qisqa 2s */
  .l8.lim-ui {
    font-size: 12px; font-weight: 700; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px;
  }
  .l8.lim-ui .sub { font-weight: 500; color: var(--faint); font-size: 11px; }

  /* 9 Segment */
  .l9.lim-ui { display: inline-flex; border: 1px solid var(--line); border-radius: 9px;
    overflow: hidden; background: var(--panel); font-size: 11.5px; font-weight: 650; color: var(--muted); }
  .l9.lim-ui span { padding: 6px 11px; }
  .l9.lim-ui span + span { border-left: 1px solid var(--line); }
  .l9.lim-ui .t { color: var(--warn); background: var(--warn-soft); }

  /* 10 KPI 2 ustun */
  .l10.lim-ui { display: inline-flex; border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; background: var(--panel); }
  .l10.lim-ui div { padding: 5px 12px; text-align: center; min-width: 64px; }
  .l10.lim-ui div + div { border-left: 1px solid var(--line); }
  .l10.lim-ui .num { display: block; font-size: 13px; font-weight: 750; color: var(--text); line-height: 1.2; }
  .l10.lim-ui .cap { font-size: 9px; font-weight: 650; text-transform: uppercase;
    letter-spacing: .05em; color: var(--faint); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120%);
    background: #2b2340; color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 10px; z-index: 100; transition: transform .22s ease; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div>
      <h1>Vaqt / xotira cheklovi — 10 dizayn</h1>
      <p>
        <code>head-1</code> o‘ng tomoni: sarlavha yonida vaqt (ms) va xotira (MB).
        Hozirgi prototip — <strong>variant 1</strong> (amber pill). Statistika qatoringiz (#3 ikonka) pastda namuna sifatida qisqa ko‘rsatilgan.
      </p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Cheklovlar">
        <button type="button" data-set="std" class="on">2000 / 256</button>
        <button type="button" data-set="tight">500 / 64</button>
        <button type="button" data-set="loose">10000 / 1024</button>
      </div>
      <div class="seg" role="group" aria-label="Mavzu">
        <button type="button" data-theme="light" class="on">Yorug‘</button>
        <button type="button" data-theme="dark">Qorong‘i</button>
      </div>
    </div>
  </header>

  <div class="pick-bar">
    <strong>Tanlangan limit varianti:</strong>
    <output id="picked">— hali tanlanmadi</output>
  </div>

  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var SETS = {
    std: { ms: 2000, mb: 256, sec: 2 },
    tight: { ms: 500, mb: 64, sec: 0.5 },
    loose: { ms: 10000, mb: 1024, sec: 10 }
  };
  var current = "std";

  var CARDS = [
    { id: "1", name: "P0 — amber pill", tag: "statement-builder",
      desc: "Bitta rozetka: 2000 ms · 256 MB, warn ranglari." },
    { id: "2", name: "Ikki alohida pill", tag: "Ajratilgan",
      desc: "Vaqt amber, xotira neytral chip." },
    { id: "3", name: "Ikonka + matn", tag: "Stat #3 jufti",
      desc: "Soat va xotira ikonkalari — statistika qatori uslubi." },
    { id: "4", name: "Mono telemetry", tag: "Texnik",
      desc: "TL / ML qisqartmalari monospace blokda." },
    { id: "5", name: "Outline pill", tag: "Yengil",
      desc: "Fon yo‘q, faqat amber chegarа." },
    { id: "6", name: "Binafsha accent", tag: "Platforma rangi",
      desc: "Accent-soft pill — badge’lar bilan uyg‘un." },
    { id: "7", name: "Yorliq + qiymat", tag: "Aniq",
      desc: "«Vaqt» / «Xotira» yorliqlari bilan." },
    { id: "8", name: "Qisqa 2s · 256M", tag: "Tor ekran",
      desc: "Sonlar qisqartirilgan, ms/MB ixtiyoriy pastki qator." },
    { id: "9", name: "Segment blok", tag: "Ixcham",
      desc: "Vaqt va xotira bitta ramkada, vaqt amber fon." },
    { id: "10", name: "KPI 2 ustun", tag: "Dashboard",
      desc: "MS va MB alohida ustun sarlavhasi bilan." }
  ];

  function headShell(limHtml) {
    return '<div class="preview stmt"><div class="head-1">' +
      '<span class="faint mono">#0432</span>' +
      '<span class="h-title">Tarmoq modernizatsiyasi</span>' +
      '<span style="flex:1"></span>' + limHtml +
      '<span class="tsize-dummy">Matn A−/+</span></div>' +
      '<p class="faint" style="font-size:11px;margin:10px 0 0">Pastda: statistika #3 (tanlangan)</p></div>';
  }

  function limHtml(id) {
    switch (id) {
      case "1":
        return '<span class="lim-ui l1" data-role="lim"><span class="d-ms">2000</span> ms · <span class="d-mb">256</span> MB</span>';
      case "2":
        return '<span class="lim-ui l2" data-role="lim">' +
          '<span><span class="d-ms">2000</span> ms</span>' +
          '<span class="mem"><span class="d-mb">256</span> MB</span></span>';
      case "3":
        return '<span class="lim-ui l3" data-role="lim">' +
          '<span class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>' +
          '<span><span class="d-ms">2000</span> ms</span></span>' +
          '<span class="item"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 10h8M8 14h5"/></svg>' +
          '<span><span class="d-mb">256</span> MB</span></span></span>';
      case "4":
        return '<span class="lim-ui l4" data-role="lim">TL <b class="d-ms">2000</b> · ML <b class="d-mb">256</b></span>';
      case "5":
        return '<span class="lim-ui l5" data-role="lim"><span class="d-ms">2000</span> ms · <span class="d-mb">256</span> MB</span>';
      case "6":
        return '<span class="lim-ui l6" data-role="lim"><span class="d-ms">2000</span> ms · <span class="d-mb">256</span> MB</span>';
      case "7":
        return '<span class="lim-ui l7" data-role="lim">' +
          '<span>Vaqt <b class="d-ms">2000</b> ms</span>' +
          '<span>Xotira <b class="d-mb">256</b> MB</span></span>';
      case "8":
        return '<span class="lim-ui l8" data-role="lim">' +
          '<span class="d-sec">2</span>s · <span class="d-mb">256</span> MB' +
          '<span class="sub"> (<span class="d-ms">2000</span> ms)</span></span>';
      case "9":
        return '<span class="lim-ui l9" data-role="lim">' +
          '<span class="t"><span class="d-ms">2000</span> ms</span>' +
          '<span><span class="d-mb">256</span> MB</span></span>';
      case "10":
        return '<span class="lim-ui l10" data-role="lim">' +
          '<div><span class="num d-ms">2000</span><span class="cap">ms</span></div>' +
          '<div><span class="num d-mb">256</span><span class="cap">MB</span></div></span>';
      default:
        return "";
    }
  }

  function applyData(root, d) {
    if (!root) return;
    root.querySelectorAll(".d-ms").forEach(function (el) { el.textContent = String(d.ms); });
    root.querySelectorAll(".d-mb").forEach(function (el) { el.textContent = String(d.mb); });
    root.querySelectorAll(".d-sec").forEach(function (el) {
      el.textContent = d.sec % 1 === 0 ? String(d.sec) : String(d.sec);
    });
  }

  var grid = document.getElementById("grid");
  CARDS.forEach(function (c) {
    var art = document.createElement("article");
    art.className = "card";
    art.dataset.id = c.id;
    art.dataset.name = c.name;
    art.innerHTML =
      '<div class="card-head"><h2>' + c.id + ". " + c.name.split(" — ")[0] + '</h2>' +
      '<span class="tag">' + c.tag + '</span><p>' + c.desc + '</p></div>' +
      '<div class="preview-wrap">' + headShell(limHtml(c.id)) + '</div>' +
      '<div class="card-foot"><button type="button" class="primary pick">Tanlash</button></div>';
    grid.appendChild(art);
    applyData(art.querySelector(".preview"), SETS.std);
  });

  document.querySelectorAll("[data-set]").forEach(function (b) {
    b.addEventListener("click", function () {
      current = b.dataset.set;
      b.parentElement.querySelectorAll("button").forEach(function (x) {
        x.classList.toggle("on", x === b);
      });
      var d = SETS[current];
      document.querySelectorAll(".card .preview").forEach(function (p) { applyData(p, d); });
    });
  });

  document.querySelectorAll("[data-theme]").forEach(function (b) {
    b.addEventListener("click", function () {
      b.parentElement.querySelectorAll("button").forEach(function (x) {
        x.classList.toggle("on", x === b);
      });
      document.documentElement.setAttribute("data-rw-theme", b.dataset.theme);
    });
  });

  var pickedOut = document.getElementById("picked");
  var toast = document.getElementById("toast");

  document.querySelectorAll(".card").forEach(function (card) {
    var id = card.dataset.id;
    card.querySelector(".pick").addEventListener("click", function () {
      document.querySelectorAll(".card").forEach(function (c) { c.classList.remove("is-picked"); });
      card.classList.add("is-picked");
      pickedOut.textContent = "#" + id + " — " + card.dataset.name;
      try { localStorage.setItem("rw:limits-pick", id); } catch (e) {}
      toast.textContent = "Limit varianti " + id + " tanlandi";
      toast.classList.add("show");
      setTimeout(function () { toast.classList.remove("show"); }, 1600);
    });
    try {
      var saved = localStorage.getItem("rw:limits-pick");
      if (saved === id) {
        card.classList.add("is-picked");
        pickedOut.textContent = "#" + saved + " — " + card.dataset.name;
      }
    } catch (e) {}
  });
})();
</script>
</body>
</html>
