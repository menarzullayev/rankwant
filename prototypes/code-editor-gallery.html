<!DOCTYPE html>
<html lang="uz" data-rw-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kod muharriri — 10 dizayn prototipi</title>
<!--
  Mustaqil prototip. Kontekst: statement-builder pane-b (Yechim + .code + tugmalar).
  Production: SubmitPanel + CodeEditor (Monaco, 14px, minimap off).
-->
<style>
  :root, [data-rw-theme="light"] {
    --dash-ground: #f9fafb; --dash-surface: #fff; --dash-line: #e4e7ec;
    --dash-text: #1d2939; --dash-muted: #667085;
    --dash-accent-ink: #3c66dc; --dash-accent-soft: #eef3ff; --dash-radius: 14px;
  }
  [data-rw-theme="dark"] {
    --dash-ground: #0b0d12; --dash-surface: #141821; --dash-line: #232936;
    --dash-text: #e6e9ef; --dash-muted: #9aa1b2;
    --dash-accent-ink: #7ea4ff; --dash-accent-soft: rgba(91, 140, 255, .12);
  }
  .stmt {
    --panel: #fff; --panel-2: #f7f3ff; --panel-3: #faf8ff;
    --text: #4a2d75; --muted: #624f82; --faint: #6f5897;
    --accent: #7c3aed; --accent-ink: #7936ea; --accent-fg: #fff; --accent-soft: #f1e9ff;
    --line: #e3daf5; --r: 16px; --r-sm: 10px;
    --ed-bg: #221a33; --ed-fg: #e8e3f5; --ed-gutter: #2d2442;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
    --ok: #0f6e56; --ok-soft: #e1f5ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.5; background: var(--dash-ground); color: var(--dash-text); }
  .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 64px; }
  .head { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; align-items: flex-start; }
  .head h1 { margin: 0; font-size: 24px; font-weight: 650; }
  .head p { margin: 6px 0 0; font-size: 13px; color: var(--dash-muted); max-width: 66ch; }
  .tools { margin-left: auto; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--dash-surface);
    border: 1px solid var(--dash-line); border-radius: 10px; }
  .seg button { font: inherit; font-size: 12px; font-weight: 600; border: 0; cursor: pointer;
    padding: 6px 12px; border-radius: 7px; background: transparent; color: var(--dash-muted); }
  .seg button.on { background: var(--dash-accent-ink); color: #fff; }
  .pick-bar { position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--dash-ground) 92%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--dash-line); border-radius: var(--dash-radius); padding: 12px 16px;
    margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pick-bar output { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    color: var(--dash-accent-ink); background: var(--dash-accent-soft); padding: 4px 10px; border-radius: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 18px; }
  .card { background: var(--dash-surface); border: 1px solid var(--dash-line);
    border-radius: var(--dash-radius); display: flex; flex-direction: column; overflow: hidden; }
  .card.is-picked { outline: 2px solid var(--dash-accent-ink); outline-offset: 2px; }
  .card-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--dash-line); }
  .card-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .card-head .tag { font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--dash-muted); display: inline-block; margin-top: 6px; }
  .card-head p { margin: 8px 0 0; font-size: 12.5px; color: var(--dash-muted); line-height: 1.45; }
  .preview-wrap { padding: 14px 16px 16px; flex: 1; }
  .pane { background: var(--panel-3); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .card-foot { padding: 10px 16px 14px; border-top: 1px solid var(--dash-line);
    display: flex; gap: 8px; align-items: center; }
  .card-foot button { font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    border-radius: 8px; padding: 7px 12px; border: 1px solid var(--dash-line); background: var(--dash-surface); }
  .card-foot button.primary { background: var(--dash-accent-ink); color: #fff; border-color: transparent; }

  /* umumiy kod matni */
  .src { font-family: var(--mono); font-size: 14px; line-height: 1.6; margin: 0; white-space: pre; }
  .btn-p { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 10px;
    font: inherit; font-size: 13px; font-weight: 600; padding: 0 14px; min-height: 38px; cursor: default;
    background: var(--accent); color: var(--accent-fg); }
  .btn-q { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line);
    border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; padding: 0 14px; min-height: 38px;
    background: transparent; color: var(--muted); cursor: default; }
  .lang { font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent-ink);
    border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
  .ed-title { font-size: 15px; font-weight: 650; color: var(--text); }

  /* 1 P0 */
  .e1 .shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    padding: 14px; display: flex; flex-direction: column; gap: 11px;
    box-shadow: 0 1px 2px rgba(48,30,90,.05), 0 6px 16px rgba(48,30,90,.07); }
  .e1 .top { display: flex; align-items: center; gap: 9px; }
  .e1 .codebox { background: var(--ed-bg); color: var(--ed-fg); border-radius: var(--r-sm);
    padding: 12px 14px; min-height: 160px; overflow: auto; }
  .e1 .foot { display: flex; gap: 8px; }
  .e1 .foot .btn-p { flex: 1; }

  /* 2 Gutter raqamlari */
  .e2 .shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .e2 .top { display: flex; align-items: center; gap: 9px; padding: 12px 14px 8px; }
  .e2 .codebox { display: flex; min-height: 160px; background: var(--ed-bg); }
  .e2 .gutter { background: var(--ed-gutter); color: #8a7aa8; font-family: var(--mono); font-size: 13px;
    line-height: 1.6; padding: 12px 8px 12px 10px; text-align: right; user-select: none; border-right: 1px solid #3a3055; }
  .e2 .gutter span { display: block; }
  .e2 pre { flex: 1; padding: 12px 14px; margin: 0; overflow: auto; color: var(--ed-fg); }
  .e2 .foot { display: flex; gap: 8px; padding: 0 14px 14px; }
  .e2 .foot .btn-p { flex: 1; }

  /* 3 Full bleed */
  .e3 .shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 0; overflow: hidden; }
  .e3 .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
  .e3 .codebox { background: var(--ed-bg); min-height: 170px; padding: 12px 14px; }
  .e3 .foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .e3 .foot .btn-p { flex: 1; }

  /* 4 Tablar (SubmitPanel) */
  .e4 .shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
  .e4 .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .e4 .tabs button { font: inherit; font-size: 12px; font-weight: 650; border: 0; background: transparent;
    color: var(--faint); padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .e4 .tabs button.on { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .e4 .codebox { background: var(--ed-bg); color: var(--ed-fg); border-radius: var(--r-sm); padding: 12px 14px; min-height: 130px; }
  .e4 .tab-extra { font-size: 12px; color: var(--muted); padding: 12px; background: var(--panel-2); border-radius: var(--r-sm); display: none; }
  .e4 .tab-extra.on { display: block; }
  .e4 .foot { display: flex; gap: 8px; margin-top: 10px; }
  .e4 .foot .btn-p { flex: 1; }

  /* 5 Toolbar */
  .e5 .shell-card { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--panel); }
  .e5 .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px;
    background: var(--panel-2); border-bottom: 1px solid var(--line); font-size: 12px; }
  .e5 .toolbar .sp { flex: 1; }
  .e5 .toolbar .ico { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--faint); font-size: 14px; display: inline-flex; align-items: center; justify-content: center; }
  .e5 .codebox { background: var(--ed-bg); color: var(--ed-fg); min-height: 150px; padding: 12px 14px; }
  .e5 .foot { padding: 10px; display: flex; gap: 8px; }
  .e5 .foot .btn-p { flex: 1; }

  /* 6 Yorug‘ editor (Monaco light) */
  .e6 .shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
  .e6 .top { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .e6 .codebox { background: #fff; color: #1e1e1e; border: 1px solid #d4d4d4; border-radius: var(--r-sm);
    min-height: 160px; padding: 12px 14px; }
  .e6 .foot { display: flex; gap: 8px; margin-top: 10px; }
  .e6 .foot .btn-p { flex: 1; }

  /* 7 Accent ust chiziq (sheet uslubi) */
  .e7 .shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    border-top: 3px solid var(--accent); padding: 14px; box-shadow: 0 -4px 20px rgba(48,30,90,.08); }
  .e7 .top { display: flex; align-items: center; gap: 9px; }
  .e7 .codebox { background: var(--ed-bg); color: var(--ed-fg); border-radius: var(--r-sm);
    min-height: 150px; padding: 12px 14px; margin-top: 10px; }
  .e7 .foot { display: flex; gap: 8px; margin-top: 10px; }
  .e7 .foot .btn-p { flex: 1; }

  /* 8 Ixcham 13px */
  .e8 .shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px; }
  .e8 .top { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .e8 .ed-title { font-size: 13px; }
  .e8 .lang { font-size: 11px; padding: 4px 9px; }
  .e8 .codebox { background: var(--ed-bg); color: var(--ed-fg); border-radius: 8px; min-height: 120px; padding: 8px 10px; }
  .e8 .src { font-size: 13px; line-height: 1.55; }
  .e8 .foot { display: flex; gap: 6px; margin-top: 8px; }
  .e8 .btn-p, .e8 .btn-q { min-height: 34px; font-size: 12px; }
  .e8 .foot .btn-p { flex: 1; }

  /* 9 Sticky footer */
  .e9 .shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    display: flex; flex-direction: column; max-height: 280px; }
  .e9 .top { padding: 12px 14px 8px; display: flex; align-items: center; gap: 9px; }
  .e9 .codebox { flex: 1; overflow: auto; background: var(--ed-bg); color: var(--ed-fg); padding: 12px 14px; min-height: 100px; }
  .e9 .foot { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 14px;
    background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -4px 12px rgba(48,30,90,.06); }
  .e9 .foot .btn-p { flex: 1; }

  /* 10 Vertikal tugmalar */
  .e10 .shell-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
  .e10 .top { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
  .e10 .codebox { background: var(--ed-bg); color: var(--ed-fg); border-radius: var(--r-sm);
    min-height: 140px; padding: 12px 14px; }
  .e10 .foot { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .e10 .foot .btn-p { width: 100%; }
  .e10 .foot .btn-q { width: 100%; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120%);
    background: #2b2340; color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 10px; z-index: 100; transition: transform .22s ease; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div>
      <h1>Kod muharriri — 10 dizayn</h1>
      <p>
        Kontekst: <code>statement-builder.html</code> o‘ng ustun (pane-b) va production
        <code>SubmitPanel</code> + Monaco (<code>CodeEditor.tsx</code>, 14px, minimap yo‘q).
        Namuna kod bir xil; variant 4 da tablar bosiladi.
      </p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Mavzu">
        <button type="button" data-theme="light" class="on">Yorug‘</button>
        <button type="button" data-theme="dark">Qorong‘i</button>
      </div>
    </div>
  </header>

  <div class="pick-bar">
    <strong>Tanlangan muharrir varianti:</strong>
    <output id="picked">— hali tanlanmadi</output>
  </div>

  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var CODE = '#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n  ios::sync_with_stdio(false);\n  cin.tie(nullptr);\n  // TODO: DSU + LCA\n  return 0;\n}';
  var LINES = CODE.split("\n");

  var CARDS = [
    { id: "1", name: "P0 — karta + qorong‘i blok", tag: "statement-builder",
      desc: "Yechim sarlavhasi, C++ badge, .code bloki, Yuborish + Namunada sinash." },
    { id: "2", name: "Gutter (qator raqami)", tag: "IDE",
      desc: "Chap ustunda 1…n — Monaco ga yaqin ko‘rinish." },
    { id: "3", name: "Full bleed", tag: "Maksimal maydon",
      desc: "Kod chetidan chetgacha; toolbar alohida fon." },
    { id: "4", name: "Tablar — Kod / Verdikt / Namuna", tag: "SubmitPanel",
      desc: "Productiondagi verdict · samples · custom mantiqining vizuali." },
    { id: "5", name: "Keng toolbar", tag: "Amallar",
      desc: "Til, nusxalash, to‘liq ekran ikonkalari; kod pastda." },
    { id: "6", name: "Yorug‘ muharrir", tag: "Monaco vs",
      desc: "Oq fon — yorug‘ mavzuda CodeEditor theme=vs." },
    { id: "7", name: "Accent ust chiziq", tag: "Mobil varaq",
      desc: "Sheet uslubi: binafsha 3px chiziq + soya (tablet/mobile sheet)." },
    { id: "8", name: "Ixcham 13px", tag: "Tor split",
      desc: "Kichik shrift va balandlik — 58% split da ko‘proq kod sig‘adi." },
    { id: "9", name: "Sticky footer", tag: "Uzun kod",
      desc: "Kod aylanadi, Yuborish pastda doim ko‘rinadi." },
    { id: "10", name: "Vertikal tugmalar", tag: "Mobil",
      desc: "Avval Namunada sinash, keyin to‘liq kenglikda Yuborish." }
  ];

  function gutterHtml() {
    return LINES.map(function (_, i) {
      return "<span>" + (i + 1) + "</span>";
    }).join("");
  }

  function codePre() {
    return "<pre class=\"src\">" + CODE.replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</pre>";
  }

  function standardTop() {
    return '<div class="top"><span class="ed-title">Yechim</span><span style="flex:1"></span><span class="lang">C++ 23 ▾</span></div>';
  }

  function standardFoot() {
    return '<div class="foot"><span class="btn-p">Yuborish</span><span class="btn-q">Namunada sinash</span></div>';
  }

  function build(id) {
    var e = "e" + id;
    var inner = "";
    switch (id) {
      case "1":
        inner = '<div class="shell-card ' + e + '">' + standardTop() +
          '<div class="codebox">' + codePre() + '</div>' + standardFoot() + '</div>';
        break;
      case "2":
        inner = '<div class="shell-card ' + e + '">' +
          '<div class="top"><span class="ed-title">Yechim</span><span style="flex:1"></span><span class="lang">C++ 23</span></div>' +
          '<div class="codebox"><div class="gutter">' + gutterHtml() + '</div>' + codePre() + '</div>' +
          standardFoot() + '</div>';
        break;
      case "3":
        inner = '<div class="shell-card ' + e + '">' +
          '<div class="top"><span class="ed-title">Yechim</span><span class="lang">C++ 23 ▾</span><span style="flex:1"></span></div>' +
          '<div class="codebox">' + codePre() + '</div>' + standardFoot() + '</div>';
        break;
      case "4":
        inner = '<div class="shell-card ' + e + '" data-ed="' + id + '">' +
          '<div class="tabs" role="tablist">' +
          '<button type="button" class="on" data-tab="code">Kod</button>' +
          '<button type="button" data-tab="verdict">Verdikt</button>' +
          '<button type="button" data-tab="samples">Namuna</button></div>' +
          '<div class="codebox tab-pane" data-pane="code">' + codePre() + '</div>' +
          '<div class="tab-extra" data-pane="verdict">Hali yuborilmadi — kod yozing va Yuborishni bosing.</div>' +
          '<div class="tab-extra" data-pane="samples">1-namunada sinash natijasi shu yerda.</div>' +
          standardFoot() + '</div>';
        break;
      case "5":
        inner = '<div class="shell-card ' + e + '">' +
          '<div class="toolbar"><span class="lang">C++ 23 ▾</span>' +
          '<span class="ico" title="Nusxalash">⧉</span><span class="ico" title="To‘liq ekran">⤢</span>' +
          '<span class="sp"></span><span class="btn-q" style="min-height:32px;padding:0 10px">Sinash</span></div>' +
          '<div class="codebox">' + codePre() + '</div>' +
          '<div class="foot"><span class="btn-p" style="flex:1">Yuborish</span></div></div>';
        break;
      case "6":
        inner = '<div class="shell-card ' + e + '">' + standardTop() +
          '<div class="codebox">' + codePre() + '</div>' + standardFoot() + '</div>';
        break;
      case "7":
        inner = '<div class="shell-card ' + e + '">' + standardTop() +
          '<div class="codebox">' + codePre() + '</div>' + standardFoot() + '</div>';
        break;
      case "8":
        inner = '<div class="shell-card ' + e + '">' +
          '<div class="top"><span class="ed-title">Yechim</span><span style="flex:1"></span><span class="lang">C++ 23</span></div>' +
          '<div class="codebox">' + codePre() + '</div>' + standardFoot() + '</div>';
        break;
      case "9":
        inner = '<div class="shell-card ' + e + '">' + standardTop() +
          '<div class="codebox"><pre class="src">' +
          CODE.replace(/</g, "&lt;").replace(/>/g, "&gt;") +
          "\n\n// … uzun kod davom etadi …</pre></div>" +
          standardFoot() + '</div>';
        break;
      case "10":
        inner = '<div class="shell-card ' + e + '">' + standardTop() +
          '<div class="codebox">' + codePre() + '</div>' +
          '<div class="foot"><span class="btn-q">Namunada sinash</span><span class="btn-p">Yuborish</span></div></div>';
        break;
    }
    return '<div class="pane">' + inner + '</div>';
  }

  var grid = document.getElementById("grid");
  CARDS.forEach(function (c) {
    var art = document.createElement("article");
    art.className = "card";
    art.dataset.id = c.id;
    art.dataset.name = c.name;
    art.innerHTML =
      '<div class="card-head"><h2>' + c.id + ". " + c.name.split(" — ")[0] + '</h2>' +
      '<span class="tag">' + c.tag + '</span><p>' + c.desc + '</p></div>' +
      '<div class="preview-wrap">' + build(c.id) + '</div>' +
      '<div class="card-foot"><button type="button" class="primary pick">Tanlash</button></div>';
    grid.appendChild(art);

    if (c.id === "4") {
      var shell = art.querySelector(".e4");
      shell.querySelectorAll(".tabs button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          shell.querySelectorAll(".tabs button").forEach(function (b) { b.classList.remove("on"); });
          btn.classList.add("on");
          var tab = btn.dataset.tab;
          shell.querySelectorAll("[data-pane]").forEach(function (p) {
            var show = p.dataset.pane === tab;
            if (p.classList.contains("codebox")) p.style.display = show ? "block" : "none";
            else { p.classList.toggle("on", show); }
          });
        });
      });
    }

    art.querySelector(".pick").addEventListener("click", function () {
      document.querySelectorAll(".card").forEach(function (x) { x.classList.remove("is-picked"); });
      art.classList.add("is-picked");
      document.getElementById("picked").textContent = "#" + c.id + " — " + c.name;
      try { localStorage.setItem("rw:editor-pick", c.id); } catch (e) {}
      var toast = document.getElementById("toast");
      toast.textContent = "Muharrir varianti " + c.id + " tanlandi";
      toast.classList.add("show");
      setTimeout(function () { toast.classList.remove("show"); }, 1600);
    });

    try {
      if (localStorage.getItem("rw:editor-pick") === c.id) {
        art.classList.add("is-picked");
        document.getElementById("picked").textContent = "#" + c.id + " — " + c.name;
      }
    } catch (e) {}
  });

  document.querySelectorAll("[data-theme]").forEach(function (b) {
    b.addEventListener("click", function () {
      b.parentElement.querySelectorAll("button").forEach(function (x) {
        x.classList.toggle("on", x === b);
      });
      document.documentElement.setAttribute("data-rw-theme", b.dataset.theme);
    });
  });
})();
</script>
</body>
</html>
