<!DOCTYPE html>
<html lang="uz" data-rw-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matn o‘lchami (A− / A+) — 10 dizayn prototipi</title>
<!--
  Mustaqil prototip. Kontekst: statement-builder.html head-1 .tsize (CHOICE 9).
  Prototip: 13–22 px, 1 px qadam (localStorage rw:textsize).
  Production StatementSize.tsx: 14, 16, 18, 20 px — variant 6 shu rejimni ko‘rsatadi.
-->
<style>
  :root, [data-rw-theme="light"] {
    --dash-ground: #f9fafb; --dash-surface: #fff; --dash-line: #e4e7ec;
    --dash-text: #1d2939; --dash-muted: #667085;
    --dash-accent-ink: #3c66dc; --dash-accent-soft: #eef3ff; --dash-radius: 14px;
  }
  [data-rw-theme="dark"] {
    --dash-ground: #0b0d12; --dash-surface: #141821; --dash-line: #232936;
    --dash-text: #e6e9ef; --dash-muted: #9aa1b2;
    --dash-accent-ink: #7ea4ff; --dash-accent-soft: rgba(91, 140, 255, .12);
  }
  .stmt {
    --ground: #ede4ff; --panel: #fff; --panel-2: #f7f3ff;
    --text: #4a2d75; --muted: #624f82; --faint: #6f5897;
    --accent: #7c3aed; --accent-ink: #7936ea; --accent-soft: #f1e9ff;
    --line: #e3daf5; --mono: ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.5; background: var(--dash-ground); color: var(--dash-text); }
  .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 64px; }
  .head { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; align-items: flex-start; }
  .head h1 { margin: 0; font-size: 24px; font-weight: 650; }
  .head p { margin: 6px 0 0; font-size: 13px; color: var(--dash-muted); max-width: 64ch; }
  .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--dash-surface);
    border: 1px solid var(--dash-line); border-radius: 10px; }
  .seg button { font: inherit; font-size: 12px; font-weight: 600; border: 0; cursor: pointer;
    padding: 6px 12px; border-radius: 7px; background: transparent; color: var(--dash-muted); }
  .seg button.on { background: var(--dash-accent-ink); color: #fff; }
  .pick-bar { position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--dash-ground) 92%, transparent); backdrop-filter: blur(8px);
    border: 1px solid var(--dash-line); border-radius: var(--dash-radius); padding: 12px 16px;
    margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pick-bar output { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    color: var(--dash-accent-ink); background: var(--dash-accent-soft); padding: 4px 10px; border-radius: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .card { background: var(--dash-surface); border: 1px solid var(--dash-line);
    border-radius: var(--dash-radius); display: flex; flex-direction: column; overflow: hidden; }
  .card.is-picked { outline: 2px solid var(--dash-accent-ink); outline-offset: 2px; }
  .card-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--dash-line); }
  .card-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
  .card-head .tag { font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; color: var(--dash-muted); display: inline-block; margin-top: 6px; }
  .card-head p { margin: 8px 0 0; font-size: 12.5px; color: var(--dash-muted); line-height: 1.45; }
  .preview-wrap { padding: 14px 16px 16px; flex: 1; }
  .preview { background: var(--ground); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; color: var(--text); }
  .preview .head-1 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .preview .h-title { font-size: 18px; font-weight: 700; flex: 1; min-width: 120px; }
  .preview .sample { margin: 0; line-height: 1.7; color: var(--text); transition: font-size .12s ease; }
  .card-foot { padding: 10px 16px 14px; border-top: 1px solid var(--dash-line);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card-foot button { font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
    border-radius: 8px; padding: 7px 12px; border: 1px solid var(--dash-line); background: var(--dash-surface); }
  .card-foot button.primary { background: var(--dash-accent-ink); color: #fff; border-color: transparent; }
  .card-foot .hint { font-size: 11.5px; color: var(--dash-muted); margin-left: auto; }

  /* umumiy tugma */
  .sz-ui button { font: inherit; cursor: pointer; }
  .sz-ui button:disabled { opacity: .45; cursor: not-allowed; }
  .sz-ui .sz-val { font-variant-numeric: tabular-nums; }

  /* 1 P0 */
  .z1.sz-ui { display: inline-flex; align-items: center; gap: 5px; }
  .z1 .sz-label { font-size: 11.5px; color: var(--faint); letter-spacing: .03em; }
  .z1 button { min-width: 32px; min-height: 32px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); border-radius: 5px; }
  .z1 button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-ink); }
  .z1 .sz-val { font-size: 12px; color: var(--muted); min-width: 34px; text-align: center; }

  /* 2 Yorliqsiz */
  .z2.sz-ui { display: inline-flex; align-items: center; gap: 4px; }
  .z2 button { min-width: 32px; min-height: 32px; font-size: 12px; font-weight: 650;
    border: 0; background: transparent; color: var(--muted); border-radius: 8px; }
  .z2 button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-ink); }
  .z2 .sz-val { font-size: 12px; color: var(--faint); min-width: 40px; text-align: center; }

  /* 3 Kapsula */
  .z3.sz-ui { display: inline-flex; align-items: stretch; border: 1px solid var(--line);
    border-radius: 999px; overflow: hidden; background: var(--panel); }
  .z3 .sz-label { font-size: 11px; font-weight: 650; color: var(--faint); padding: 0 10px;
    display: inline-flex; align-items: center; border-right: 1px solid var(--line); }
  .z3 button { border: 0; background: transparent; min-width: 34px; font-size: 12px; font-weight: 650; color: var(--muted); }
  .z3 button + .sz-val { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .z3 .sz-val { font-size: 11px; padding: 0 8px; display: inline-flex; align-items: center; }

  /* 4 Ikonka −/+ */
  .z4.sz-ui { display: inline-flex; align-items: center; gap: 6px; }
  .z4 button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); color: var(--faint); font-size: 18px; line-height: 1; padding: 0; }
  .z4 button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
  .z4 .sz-val { font-size: 13px; font-weight: 700; color: var(--text); min-width: 44px; text-align: center; }

  /* 5 Slider */
  .z5.sz-ui { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; max-width: 220px; }
  .z5 .sz-label { font-size: 11px; color: var(--faint); width: 100%; }
  .z5 input[type=range] { flex: 1; min-width: 100px; accent-color: var(--accent); height: 24px; }
  .z5 .sz-val { font-size: 12px; font-weight: 650; color: var(--accent-ink); min-width: 38px; }

  /* 6 Production 4 pog‘ona */
  .z6.sz-ui { display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .z6 .sz-label { font-size: 11px; color: var(--faint); width: 100%; }
  .z6 .steps { display: inline-flex; gap: 3px; }
  .z6 .step { font-size: 11px; font-weight: 650; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel-2); color: var(--muted); padding: 4px 8px; min-height: 28px; }
  .z6 .step.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); }

  /* 7 Katta o‘lcham markazda */
  .z7.sz-ui { display: inline-flex; align-items: center; gap: 6px; }
  .z7 .sz-val { font-size: 18px; font-weight: 800; color: var(--text); letter-spacing: -.02em; min-width: 52px; text-align: center; }
  .z7 button { width: 28px; height: 28px; border: 0; background: var(--panel-2); border-radius: 6px;
    font-size: 11px; font-weight: 700; color: var(--muted); }

  /* 8 Vertikal (tor joy) */
  .z8.sz-ui { display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
    border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--panel); }
  .z8 .row { display: inline-flex; gap: 4px; }
  .z8 button { min-width: 36px; min-height: 28px; font-size: 12px; border: 1px solid var(--line);
    border-radius: 6px; background: var(--panel-2); color: var(--muted); }
  .z8 .sz-val { font-size: 11px; color: var(--faint); }

  /* 9 Type ikonka */
  .z9.sz-ui { display: inline-flex; align-items: center; gap: 8px; }
  .z9 svg { width: 16px; height: 16px; stroke: var(--faint); fill: none; stroke-width: 1.6; flex: none; }
  .z9 button { min-width: 30px; min-height: 30px; font-size: 11px; font-weight: 700;
    border: 1px solid var(--line); border-radius: 7px; background: transparent; color: var(--muted); }
  .z9 .sz-val { font-size: 12px; font-weight: 650; color: var(--accent-ink); }

  /* 10 Mono */
  .z10.sz-ui { display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  .z10 button { font-family: inherit; border: 0; background: transparent; color: var(--muted);
    font-size: 11px; font-weight: 650; padding: 2px 6px; border-radius: 4px; }
  .z10 button:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-ink); }
  .z10 .sz-val { color: var(--text); font-weight: 650; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120%);
    background: #2b2340; color: #fff; font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 10px; z-index: 100; transition: transform .22s ease; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <div>
      <h1>Matn o‘lchami — 10 dizayn</h1>
      <p>
        <code>head-1</code> o‘ngidagi «Matn A− 16px A+» (statement-builder CHOICE 9).
        Pastdagi namuna jumla shrifti har variantda o‘zgaradi. Klaviatura: <kbd>Ctrl</kbd>+/− (builder bilan bir xil).
      </p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Mavzu">
        <button type="button" data-theme="light" class="on">Yorug‘</button>
        <button type="button" data-theme="dark">Qorong‘i</button>
      </div>
    </div>
  </header>

  <div class="pick-bar">
    <strong>Tanlangan matn o‘lchami varianti:</strong>
    <output id="picked">— hali tanlanmadi</output>
  </div>

  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var MIN = 13, MAX = 22, DEFAULT = 16;
  var PROD = [14, 16, 18, 20];
  var SAMPLE = "«RankWant» tarmoqni modernizatsiya qilmoqda — matn o‘lchami shu yerda sinanadi.";

  var CARDS = [
    { id: "1", mode: "step", name: "P0 — Matn + A−/+", tag: "statement-builder",
      desc: "Yorliq «Matn», chegarali 32px tugmalar, o‘qiluvchan px." },
    { id: "2", mode: "step", name: "Yorliqsiz", tag: "Ixcham",
      desc: "Faqat A− · px · A+ — limit ikonkalari yonida kam joy." },
    { id: "3", mode: "step", name: "Bitta kapsula", tag: "Segment",
      desc: "Matn | A− | px | A+ bitta yumaloq blokda." },
    { id: "4", mode: "step", name: "− / + belgisi", tag: "Ikonka",
      desc: "A harfi emas, matematik minus/plus; px qalin." },
    { id: "5", mode: "range", name: "Slider", tag: "Doimiy qadam",
      desc: "13–22 oralig‘ida sudrab; builder bilan bir xil diapazon." },
    { id: "6", mode: "prod", name: "4 pog‘ona (production)", tag: "StatementSize.tsx",
      desc: "14 · 16 · 18 · 20 px tugmalar — jonli kod shu ro‘yxat." },
    { id: "7", mode: "step", name: "Katta px markazda", tag: "Diqqat markazi",
      desc: "17px katta ko‘rsatiladi; yonlarda kichik A−/+." },
    { id: "8", mode: "step", name: "Vertikal blok", tag: "Tor head-1",
      desc: "Ustun: A− A+ qator, pastda px — mobil o‘ralganda sig‘adi." },
    { id: "9", mode: "step", name: "Type ikonka", tag: "Affordance",
      desc: "«Tt» ikonkasi + tugmalar; limit stat uslubiga yaqin." },
    { id: "10", mode: "step", name: "Mono FS=", tag: "Texnik",
      desc: "FS=17px qisqa yozuv, [--] [++] tugmalar." }
  ];

  function ctrlHtml(c) {
    var z = "z" + c.id;
    switch (c.id) {
      case "1":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<span class="sz-label">Matn</span>' +
          '<button type="button" class="sz-min" aria-label="Matnni kichraytirish">A−</button>' +
          '<span class="sz-val">16px</span>' +
          '<button type="button" class="sz-max" aria-label="Matnni kattalashtirish">A+</button></div>';
      case "2":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<button type="button" class="sz-min" aria-label="Kichraytirish">A−</button>' +
          '<span class="sz-val">16px</span>' +
          '<button type="button" class="sz-max" aria-label="Kattalashtirish">A+</button></div>';
      case "3":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<span class="sz-label">Matn</span>' +
          '<button type="button" class="sz-min" aria-label="Kichraytirish">A−</button>' +
          '<span class="sz-val">16px</span>' +
          '<button type="button" class="sz-max" aria-label="Kattalashtirish">A+</button></div>';
      case "4":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<button type="button" class="sz-min" aria-label="Kichraytirish">−</button>' +
          '<span class="sz-val">16px</span>' +
          '<button type="button" class="sz-max" aria-label="Kattalashtirish">+</button></div>';
      case "5":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<span class="sz-label">Matn o‘lchami</span>' +
          '<input type="range" class="sz-range" min="13" max="22" step="1" value="16" aria-label="Matn o‘lchami">' +
          '<span class="sz-val">16px</span></div>';
      case "6":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<span class="sz-label">Matn (4 daraja)</span>' +
          '<span class="steps">' +
          PROD.map(function (n) {
            return '<button type="button" class="step" data-px="' + n + '">' + n + '</button>';
          }).join("") + '</span></div>';
      case "7":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<button type="button" class="sz-min" aria-label="Kichraytirish">A−</button>' +
          '<span class="sz-val">16px</span>' +
          '<button type="button" class="sz-max" aria-label="Kattalashtirish">A+</button></div>';
      case "8":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<span class="row"><button type="button" class="sz-min">A−</button><button type="button" class="sz-max">A+</button></span>' +
          '<span class="sz-val">16px</span></div>';
      case "9":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg>' +
          '<button type="button" class="sz-min">A−</button>' +
          '<span class="sz-val">16px</span>' +
          '<button type="button" class="sz-max">A+</button></div>';
      case "10":
        return '<div class="sz-ui ' + z + '" data-mode="' + c.mode + '">' +
          '<span>FS=</span><span class="sz-val">16</span><span>px</span>' +
          '<button type="button" class="sz-min">[−]</button>' +
          '<button type="button" class="sz-max">[+]</button></div>';
      default:
        return "";
    }
  }

  function previewHtml(c) {
    return '<div class="preview stmt">' +
      '<div class="head-1"><span class="h-title">Tarmoq modernizatsiyasi</span>' +
      ctrlHtml(c) + '</div>' +
      '<p class="sample">«RankWant» tarmoqni modernizatsiya qilmoqda — matn o‘lchami shu yerda sinanadi.</p></div>';
  }

  var grid = document.getElementById("grid");
  CARDS.forEach(function (c) {
    var art = document.createElement("article");
    art.className = "card";
    art.dataset.id = c.id;
    art.dataset.name = c.name;
    art.innerHTML =
      '<div class="card-head"><h2>' + c.id + ". " + c.name.split(" — ")[0] + '</h2>' +
      '<span class="tag">' + c.tag + '</span><p>' + c.desc + '</p></div>' +
      '<div class="preview-wrap">' + previewHtml(c) + '</div>' +
      '<div class="card-foot"><button type="button" class="primary pick">Tanlash</button>' +
      '<span class="hint">A− / A+ yoki slider</span></div>';
    grid.appendChild(art);
    wireCard(art, c);
  });

  function getSize(card) {
    return Number(card.dataset.size || DEFAULT);
  }

  function setSize(card, n, mode) {
    if (mode === "prod") {
      n = PROD.reduce(function (best, p) {
        return Math.abs(p - n) < Math.abs(best - n) ? p : best;
      }, PROD[0]);
    } else {
      n = Math.min(MAX, Math.max(MIN, n));
    }
    card.dataset.size = String(n);
    paintCard(card, mode);
  }

  function paintCard(card, mode) {
    var n = getSize(card);
    var sample = card.querySelector(".sample");
    if (sample) sample.style.fontSize = n + "px";
    var val = card.querySelector(".sz-val");
    if (val) {
      val.textContent = card.dataset.id === "10" ? String(n) : n + "px";
    }
    var range = card.querySelector(".sz-range");
    if (range) range.value = String(n);
    card.querySelectorAll(".step").forEach(function (b) {
      b.classList.toggle("on", Number(b.dataset.px) === n);
    });
    var minBtn = card.querySelector(".sz-min");
    var maxBtn = card.querySelector(".sz-max");
    if (mode === "prod") {
      var idx = PROD.indexOf(n);
      if (minBtn) minBtn.disabled = idx <= 0;
      if (maxBtn) maxBtn.disabled = idx >= PROD.length - 1;
    } else if (mode !== "range") {
      if (minBtn) minBtn.disabled = n <= MIN;
      if (maxBtn) maxBtn.disabled = n >= MAX;
    }
  }

  function wireCard(art, c) {
    art.dataset.size = String(DEFAULT);
    paintCard(art, c.mode);

    var minBtn = art.querySelector(".sz-min");
    var maxBtn = art.querySelector(".sz-max");
    if (minBtn) minBtn.addEventListener("click", function () {
      if (c.mode === "prod") {
        var i = PROD.indexOf(getSize(art));
        if (i > 0) setSize(art, PROD[i - 1], c.mode);
      } else setSize(art, getSize(art) - 1, c.mode);
    });
    if (maxBtn) maxBtn.addEventListener("click", function () {
      if (c.mode === "prod") {
        var j = PROD.indexOf(getSize(art));
        if (j >= 0 && j < PROD.length - 1) setSize(art, PROD[j + 1], c.mode);
      } else setSize(art, getSize(art) + 1, c.mode);
    });

    art.querySelectorAll(".step").forEach(function (b) {
      b.addEventListener("click", function () {
        setSize(art, Number(b.dataset.px), c.mode);
      });
    });

    var range = art.querySelector(".sz-range");
    if (range) {
      range.addEventListener("input", function () {
        setSize(art, Number(range.value), c.mode);
      });
    }

    art.querySelector(".pick").addEventListener("click", function () {
      document.querySelectorAll(".card").forEach(function (x) { x.classList.remove("is-picked"); });
      art.classList.add("is-picked");
      document.getElementById("picked").textContent = "#" + c.id + " — " + c.name;
      try { localStorage.setItem("rw:textsize-pick", c.id); } catch (e) {}
      var toast = document.getElementById("toast");
      toast.textContent = "Matn o‘lchami varianti " + c.id + " tanlandi";
      toast.classList.add("show");
      setTimeout(function () { toast.classList.remove("show"); }, 1600);
    });

    try {
      if (localStorage.getItem("rw:textsize-pick") === c.id) {
        art.classList.add("is-picked");
        document.getElementById("picked").textContent = "#" + c.id + " — " + c.name;
      }
    } catch (e) {}
  }

  document.querySelectorAll("[data-theme]").forEach(function (b) {
    b.addEventListener("click", function () {
      b.parentElement.querySelectorAll("button").forEach(function (x) {
        x.classList.toggle("on", x === b);
      });
      document.documentElement.setAttribute("data-rw-theme", b.dataset.theme);
    });
  });
})();
</script>
</body>
</html>
