# Local dev — production topologiyasini kichraytirilgan holda takrorlaydi.
# Muhim: judge ALOHIDA konteynerda, API bilan bir joyda emas ([06-architecture] xavfsizlik chegarasi).

# api/worker/beat/migrate — bitta manba, bitta obraz ta'rifi.
#
# ⚠️ Ilgari to'rtalasi ham `build: ./apps/api` (QISQA shakl) ishlatardi,
# ya'ni build argumentlari umuman uzatilmasdi. Natijada
# `org.rankwant.git-sha` label'i har doim `unknown` bo'lib qolardi —
# o'lchandi 2026-09-18: `web` va `judge` da commit bor edi, `api` da yo'q.
# Bu `tools/check_deploy.sh` ning eskilik tekshiruvini KO'R qiladi: u
# label'ni o'qiydi, label esa manbani bilmaydi — ya'ni eski `api` obrazi
# «joyida» bo'lib ko'rinadi.
#
# Uzun shakl SHART: qisqa shaklda `args` berishning iloji yo'q.
x-api-build: &api-build
  context: ./apps/api
  args:
    # Qiymat `tools/deploy.sh` dan keladi; qo'lda build'da `unknown`.
    GIT_SHA: ${GIT_SHA:-unknown}
    BUILT_AT: ${BUILT_AT:-unknown}

# json-file cheklanmagan bo'lsa konteyner loglari diskni to'ldiradi
# (2026-09-20: docker_data.vhdx 40→132 GB). Daemon default ham 10m/3,
# lekin compose aniq yozilmasa eski konteynerlar cheksiz qolaveradi.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_DB: rankwant
      POSTGRES_USER: rankwant
      POSTGRES_PASSWORD: dev
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rankwant']
      interval: 10s
      retries: 5

  redis:
    logging: *default-logging
    image: redis:7
    # Host portini almashtirish mumkin: REDIS_PORT=6380 docker compose up -d redis
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5

  minio:                      # S3/R2 o'rniga local
    logging: *default-logging
    # ⚠️ `minio/minio` DOCKER HUB'DA YO'Q — 2025-yilda olib tashlangan.
    # `latest` bilan yozilsa `docker pull` `pull access denied for
    # minio/minio` beradi va CI'ning `smoke` job'i shu yerda yiqiladi
    # (o'lchandi 2026-09-14). Rasmiy joy — quay.io. Qolgan obrazlar
    # (`postgres`, `redis`, `hello-world`) Docker Hub'dan anonim
    # yuklanadi, ya'ni bu faqat MinIO'ga tegishli.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rankwant
      MINIO_ROOT_PASSWORD: devdevdev
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  # Migratsiya alohida bir martalik servis: gunicorn 4 worker bilan
  # ishlaydi, ya'ni migratsiyani entrypoint'ga qo'yish ularni bir-biriga
  # poyga qildiradi.
  # ⚠️ `migrate` — ALOHIDA SERVIS, ya'ni o'z OBRAZI bor (o'lchandi
  # 2026-09-16). Faqat `api`/`worker`/`beat` qayta qurilsa, migrate ESKI
  # obrazda qoladi va yangi migration fayllarini KO'RMAYDI — natijada
  # `migrate` "No migrations to apply" deydi, baza esa eskirgan qoladi.
  # Har qanday qayta qurishda bu servisni ham qurish kerak:
  #   docker compose ... build migrate && docker compose ... run --rm migrate
  migrate:
    logging: *default-logging
    build: *api-build
    command: ['python', 'manage.py', 'migrate', '--no-input']
    environment:
      DATABASE_URL: postgres://rankwant:dev@postgres:5432/rankwant
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    logging: *default-logging
    build: *api-build
    environment:
      DATABASE_URL: postgres://rankwant:dev@postgres:5432/rankwant
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
      DJANGO_DEBUG: "1"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    ports: ['8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"
      interval: 10s
      timeout: 5s
      retries: 12

  # Verdict natijalarini navbatdan olib, urinishga yozadi
  # (CELERY_BEAT_SCHEDULE: judging.drain_results har 2s). Bularsiz
  # submit qabul qilinadi, judge ishlaydi, lekin natija navbatda qoladi.
  worker:
    logging: *default-logging
    build: *api-build
    command: ['celery', '-A', 'config', 'worker', '-l', 'info', '--concurrency', '2']
    environment:
      DATABASE_URL: postgres://rankwant:dev@postgres:5432/rankwant
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  beat:
    logging: *default-logging
    build: *api-build
    command: ['celery', '-A', 'config', 'beat', '-l', 'info']
    environment:
      DATABASE_URL: postgres://rankwant:dev@postgres:5432/rankwant
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    logging: *default-logging
    build:
      context: ./apps/web
      args:
        # Brauzer bundle'i uchun — deploy manzili bilan mos bo'lishi shart.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
        # Manba commit — `check_deploy.sh` eskilikni shu orqali aniqlaydi.
        # Qiymat `tools/deploy.sh` dan keladi; qo'lda build'da `unknown`.
        GIT_SHA: ${GIT_SHA:-unknown}
        # Qurilish vaqti — `check_deploy.sh` yorliqni o'qiydi va
        # `unknown` bo'lsa build argumentlari uzatilmagan deb biladi.
        BUILT_AT: ${BUILT_AT:-unknown}
    environment:
      # Brauzer host portiga, SSR compose tarmog'iga murojaat qiladi.
      API_BASE_INTERNAL: http://api:8000/api/v1
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    ports: ['3000:3000']
    depends_on: [api]
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  judge:
    logging: *default-logging
    build:
      context: ./services/judge-go
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        # `check_deploy.sh` shu yorliqni o'qiydi (web bilan bir xil naqsh).
        BUILT_AT: ${BUILT_AT:-unknown}
    privileged: true          # nsjail namespace va cgroup uchun
    cgroup: host
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
      # DIQQAT: DATABASE_URL ATAYLAB YO'Q. Judge host'da DB credential
      # bo'lmasligi kerak (06-architecture 🔒). Worker DATABASE_URL
      # berilgan bo'lsa ishga tushmaydi.
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
