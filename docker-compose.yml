# Local dev — production topologiyasini kichraytirilgan holda takrorlaydi.
# Muhim: judge ALOHIDA konteynerda, API bilan bir joyda emas ([06-architecture] xavfsizlik chegarasi).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rankwant
      POSTGRES_USER: rankwant
      POSTGRES_PASSWORD: dev
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rankwant']
      interval: 10s
      retries: 5

  redis:
    image: redis:7
    # Host portini almashtirish mumkin: REDIS_PORT=6380 docker compose up -d redis
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5

  minio:                      # S3/R2 o'rniga local
    # ⚠️ `minio/minio` DOCKER HUB'DA YO'Q — 2025-yilda olib tashlangan.
    # `latest` bilan yozilsa `docker pull` `pull access denied for
    # minio/minio` beradi va CI'ning `smoke` job'i shu yerda yiqiladi
    # (o'lchandi 2026-09-14). Rasmiy joy — quay.io. Qolgan obrazlar
    # (`postgres`, `redis`, `hello-world`) Docker Hub'dan anonim
    # yuklanadi, ya'ni bu faqat MinIO'ga tegishli.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rankwant
      MINIO_ROOT_PASSWORD: devdevdev
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  # Migratsiya alohida bir martalik servis: gunicorn 4 worker bilan
  # ishlaydi, ya'ni migratsiyani entrypoint'ga qo'yish ularni bir-biriga
  # poyga qildiradi.
  migrate:
    build: ./apps/api
    command: ['python', 'manage.py', 'migrate', '--no-input']
    environment:
      DATABASE_URL: postgres://rankwant:dev@postgres:5432/rankwant
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://rankwant:dev@postgres:5432/rankwant
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
      DJANGO_DEBUG: "1"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports: ['8000:8000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/')"
      interval: 10s
      timeout: 5s
      retries: 12

  # Verdict natijalarini navbatdan olib, urinishga yozadi
  # (CELERY_BEAT_SCHEDULE: judging.drain_results har 2s). Bularsiz
  # submit qabul qilinadi, judge ishlaydi, lekin natija navbatda qoladi.
  worker:
    build: ./apps/api
    command: ['celery', '-A', 'config', 'worker', '-l', 'info', '--concurrency', '2']
    environment:
      DATABASE_URL: postgres://rankwant:dev@postgres:5432/rankwant
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  beat:
    build: ./apps/api
    command: ['celery', '-A', 'config', 'beat', '-l', 'info']
    environment:
      DATABASE_URL: postgres://rankwant:dev@postgres:5432/rankwant
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    build:
      context: ./apps/web
      args:
        # Brauzer bundle'i uchun — deploy manzili bilan mos bo'lishi shart.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api/v1}
    environment:
      # Brauzer host portiga, SSR compose tarmog'iga murojaat qiladi.
      API_BASE_INTERNAL: http://api:8000/api/v1
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    ports: ['3000:3000']
    depends_on: [api]

  judge:
    build: ./services/judge-go
    privileged: true          # nsjail namespace va cgroup uchun
    cgroup: host
    environment:
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: rankwant
      S3_KEY: rankwant
      S3_SECRET: devdevdev
      # DIQQAT: DATABASE_URL ATAYLAB YO'Q. Judge host'da DB credential
      # bo'lmasligi kerak (06-architecture 🔒). Worker DATABASE_URL
      # berilgan bo'lsa ishga tushmaydi.
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
