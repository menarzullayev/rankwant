# Local dev — production topologiyasini kichraytirilgan holda takrorlaydi.
# Muhim: judge ALOHIDA konteynerda, API bilan bir joyda emas ([06-architecture] xavfsizlik chegarasi).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rankwant
      POSTGRES_USER: rankwant
      POSTGRES_PASSWORD: dev
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rankwant']
      interval: 10s
      retries: 5

  redis:
    image: redis:7
    # Host portini almashtirish mumkin: REDIS_PORT=6380 docker compose up -d redis
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5

  minio:                      # S3/R2 o'rniga local
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rankwant
      MINIO_ROOT_PASSWORD: devdevdev
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  # api:      Sprint 1 da qo'shiladi
  # worker:   Celery — Sprint 1
  # web:      Next.js — Sprint 1
  # judge:    bake-off g'olibi — Sprint 0.5 dan keyin
  #           DIQQAT: judge ga DATABASE_URL BERILMAYDI (faqat REDIS_URL va S3)

volumes:
  pgdata:
  miniodata:
