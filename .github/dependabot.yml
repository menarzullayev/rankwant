version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /apps/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # One PR per week for minor/patch bumps instead of one per package.
    # 2026-10-04: ten separate PRs were open at once; `main` requires an
    # up-to-date branch, so every merge made the other nine stale. Majors
    # stay separate PRs on purpose — each one needs a decision.
    #
    # ⚠️ Dependabot edits `requirements*.txt` only. The `.lock` files come
    # from `uv pip compile`, so a pip PR still needs both locks and the
    # licence inventory regenerated by hand before it is worth merging.
    groups:
      pip-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Django 5.2 — LTS va ADR-0003 da ATAYLAB tanlangan (6.x rad
      # etilgan: `requirements.txt` boshidagi izohga qarang). #282
      # 6.1.1 taklif qilgan edi va yopildi.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    # ⚠️ `/` — WORKSPACE ILDIZI, `/apps/web` emas. 2026-09-24 da
    # `apps/web/package-lock.json` o'chirildi va root lockfile yagona
    # haqiqat bo'ldi (CLAUDE.md shu sana). Lekin bu qator yangilanmagan
    # edi: Dependabot `apps/web/package.json` ni tahrirlar, root
    # `package-lock.json` esa tegilmasdi — natijada CI'da
    #   `npm ci` ... Missing: @types/node@22.20.4 from lock file
    # va PR yiqilardi. Ildizdan o'qilganda Dependabot lockfile'ni ham
    # o'zi yangilaydi.
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Same reason as the pip group above. A bump that adds or removes a
    # package still needs `python tools/licence_inventory.py` run by hand:
    # `--check` in CI compares package names with the lockfiles.
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # `@types/node` major === Node major. CI and `apps/web/Dockerfile`
      # are Node 22 (Maintenance LTS until 2027-04). Dependabot #143
      # offered 26 while runtime was 22 — that is a false green under
      # `skipLibCheck`. Minors/patches on 22.x still come through.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # `typescript@7` YAGONA paket qilinmaydi (2026-09-20 qarori):
      # typecheck native `@typescript/native` orqali, JS API esa
      # `@typescript/typescript6` orqali yuriladi. Shu sababli oddiy
      # `typescript` paketini 7 ga ko'tarish qarorga ZID — #284 shunday
      # taklif qilgan edi va yopildi.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /services/judge-go
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
