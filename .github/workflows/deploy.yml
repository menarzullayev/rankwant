name: Deploy

# Avtomatik build, test va deploy.
#
# Zanjir: build → test → deploy. Har bosqich oldingisiga `needs` bilan
# bog'langan, ya'ni test yiqilsa deploy UMUMAN boshlanmaydi.
#
# `ci.yml` allaqachon PR va main push'ida lint/mypy/pytest/smoke ishlatadi.
# Bu workflow o'sha tekshiruvlarni QAYTA yozmaydi — u `workflow_call` bilan
# chaqiradi va shu bilan "test o'tdi" degan shart deploy uchun majburiy
# bo'ladi. Ikkinchi nusxa saqlanmaydi: qoidalar bir joyda o'zgaradi.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Maqsad muhit
        type: choice
        options: [staging, production]
        default: staging

# Deploy job'i runner mashinasidagi shared resursga (docker compose,
# tunnel) tegadi: bir vaqtda ikkita deploy ketmasin.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  # `test` job'i `ci.yml` ni `uses:` bilan chaqiradi. Chaqiriladigan
  # workflow faqat ruxsatni KAMAYTIRA oladi, ko'paytira olmaydi: `ci.yml`
  # o'zida `pull-requests: read` so'raydi (`dorny/paths-filter` uchun),
  # caller bermasa GitHub run'ni umuman boshlamaydi — `startup_failure`,
  # 0 job. Bu yerda BERILISHI shart.
  pull-requests: read

env:
  # Self-hosted runner `nsn` foydalanuvchisi sifatida ishlaydi va
  # `~/.local/lib/.../site-packages` ni ham ko'radi. U yerdagi begona
  # paketlar pytest plaginini ro'yxatdan o'tkazadi (ci.yml dagi izoh).
  PYTHONNOUSERSITE: '1'
  # Deploy qilinadigan image tegi — rollback uchun commit SHA ishlatiladi.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1. BUILD ─────────────────────────────────────────────────────────
  # Image'lar ALOHIDA job'da quriladi, testdan keyin emas: build xatosi
  # (buzuq Dockerfile, yetishmayotgan bog'liqlik) testlardan tezroq va
  # aniqroq xabar beradi.
  build:
    name: Build — API, web va judge image'lari
    runs-on: [self-hosted, rankwant]
    # ⚠️ 10 daqiqa — ONGLI istisno (qolgan hamma joyda 1-3).
    # O'lchandi: issiq kesh bilan 166 s, lekin `apps/web` o'zgargan
    # commit'larda qayta qurish 3 daqiqaga SIGMAYDI — 3 daqiqa bilan
    # qadam "cancelled" bo'ldi (run 34898117925). Uchta image'ni
    # qurishni 3 daqiqaga tiqish chegarani emas, keshni yaxshilashni
    # talab qiladi; hozircha chegara haqiqatga mos qo'yildi.
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      # Deploy stack'i jonli preview bilan bir loyihaga tushmasin:
      # `down -v` uning bazasini o'chirib yuborardi (10-operations).
      COMPOSE_PROJECT_NAME: rankwant-build-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Docker mavjudmi
        timeout-minutes: 1
        run: |
          docker version --format '{{.Server.Version}}' || {
            echo "::error::Docker topilmadi — deploy job'i self-hosted runner talab qiladi"
            exit 1
          }

      - name: Image'larni qurish
        timeout-minutes: 10
        # `docker compose build` — build-context va build args compose
        # faylidan olinadi, ya'ni qo'lda yozilgan `docker build` buyrug'i
        # fayldan ajralib qolmaydi.
        run: |
          docker compose -f docker-compose.yml build \
            --parallel \
            api web judge

      - name: Image'larni commit SHA bilan teglash
        id: meta
        # ⚠️ Manba nomi shu job'ning `COMPOSE_PROJECT_NAME` idan keladi:
        # compose qurilgan image'ni `<project>-<servis>` deb ataydi, ya'ni
        # `rankwant-build-<run_id>-api`. Ilgari bu qadam `rankwant_web`
        # qidirardi va "No such image" bilan yiqilardi — project nomi
        # o'zgaruvchan bo'lgani uchun qidiruv emas, HISOBLASH kerak.
        timeout-minutes: 3
        run: |
          version="${GITHUB_SHA:0:12}"
          missing=0
          for svc in api web judge; do
            src="${COMPOSE_PROJECT_NAME}-${svc}:latest"
            if ! docker image inspect "$src" >/dev/null 2>&1; then
              echo "::error::$src topilmadi — build qadami image yaratmagan"
              missing=1
              continue
            fi
            docker tag "$src" "rankwant/${svc}:${version}"
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::notice::Image teglari: rankwant/{api,web,judge}:${version}"

      - name: Image hajmi
        timeout-minutes: 1
        # Kutilmagan o'sish (masalan `.venv` yoki `node_modules` kontekstga
        # tushib qolgan) build'ni sekinlashtiradi va registrni to'ldiradi.
        run: docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep '^rankwant' || true

  # ── 2. TEST ──────────────────────────────────────────────────────────
  # `ci.yml` ni QAYTA ishlatamiz. Ichida: ruff, mypy (strict), migration
  # tekshiruvi, pytest (+ qamrov), OpenAPI diff, smoke va E2E — compose
  # stack'iga qarshi. `fail-fast` yo'q: barcha job tugasin, aks holda
  # faqat birinchi yiqilish ko'rinadi va qolgani yashirin qoladi.
  ci_gate:
    name: CI natijasini kutish
    needs: build
    runs-on: [self-hosted, rankwant]
    timeout-minutes: 15
    outputs:
      green: ${{ steps.wait.outputs.green }}
    steps:
      # Deploy CI'ni QAYTA yugurtirmasligi kerak: main'ga push bo'lganda
      # CI allaqachon shu SHA uchun ishlaydi. Uni ikkinchi marta chaqirish
      # ~9 min oladi VA bitta runner'da CI/Security/Deploy navbatini
      # egallab, hammasini sekinlashtiradi (o'lchandi: CI wall 8.9 min
      # against 5.4 min ish — farqning katta qismi aynan shu navbat).
      - name: CI run'i yashil bo'lishini kutish
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50"
          pick='[.workflow_runs[] | select(.name=="CI")][0]'
          for i in $(seq 1 20); do
            st=$(gh api "$api" --jq "$pick.status" 2>/dev/null || true)
            con=$(gh api "$api" --jq "$pick.conclusion // empty" 2>/dev/null || true)
            if [ "$st" = "completed" ] && [ "$con" = "success" ]; then
              echo "CI yashil - to'plamni qayta yugurtirish shart emas"
              echo "green=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            if [ "$con" = "failure" ] || [ "$con" = "cancelled" ]; then
              echo "::error::CI $con - deploy to'xtatildi"
              exit 1
            fi
            sleep 15
          done
          echo "CI tugamadi yoki topilmadi - to'liq to'plam ishlaydi"
          echo "green=false" >> "$GITHUB_OUTPUT"

  test:
    name: Test — CI to'plami
    needs: [build, ci_gate]
    # CI allaqachon yashil bo'lsa qayta yugurtirmaymiz (yuqoriga qarang).
    if: needs.ci_gate.outputs.green != 'true'
    uses: ./.github/workflows/ci.yml

  # ── 3. DEPLOY ────────────────────────────────────────────────────────
  deploy:
    name: Deploy — ${{ github.event.inputs.environment || 'staging' }}
    needs: [build, ci_gate, test]
    # `vars.PUBLIC_ORIGIN` sharti: deploy sirli o'zgaruvchilar hali
    # sozlanmagan bo'lsa (hozir shunday — repo'da 0 secrets/variables),
    # job har push'da qizil X bilan yiqilardi. O'tkazib yuborish —
    # yashirish emas: `build` va `test` baribir to'liq ishlaydi, deploy
    # esa kulrang (skipped) bo'ladi, ya'ni "sozlanmagan" aniq ko'rinadi.
    # `test` skipped bo'lishi mumkin (CI allaqachon yashil) — shuning
    # uchun natija aniq tekshiriladi: ci_gate muvaffaqiyatli VA test
    # yoki o'tgan, yoki ataylab o'tkazib yuborilgan.
    if: >-
      ${{
        (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        && vars.PUBLIC_ORIGIN != ''
        && needs.ci_gate.result == 'success'
        && (needs.test.result == 'success' || needs.test.result == 'skipped')
      }}
    runs-on: [self-hosted, rankwant]
    # ⚠️ 3 daqiqadan ko'p — ONGLI istisno: to'liq stack `up --build`
    # (--wait-timeout 300) va 30 marta health urinishi (150 s) sig'maydi.
    # Qolgan barcha job/qadam 1-3 daqiqa ichida.
    timeout-minutes: 10
    environment:
      # `production` uchun GitHub'da required reviewer qo'yilsa, deploy
      # qo'lda tasdiqlanmaguncha kutadi. Bu 10-operations talabi:
      # «live contest paytida deploy YO'Q» — qoidani faqat odam tekshira
      # oladi, shuning uchun tasdiq majburiy bo'lishi kerak.
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - name: Konfiguratsiya
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
        run: |
          missing=0
          for name in DJANGO_SECRET_KEY DJANGO_ALLOWED_HOSTS PUBLIC_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} sozlanmagan — Environment secrets/variables bo'limiga qo'shing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # `.env.public` gitignore'da: u hech qachon repo'da bo'lmaydi,
          # shuning uchun deploy paytida qiymatlardan yasaladi.
          umask 077
          cat > .env.public <<EOF
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
          PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
          EOF
          echo "::notice::.env.public yozildi ($(wc -l < .env.public) qator)"

      - name: Live contest oynasi
        # 10-operations § Deploy qoidalari, 1-qoida: contest davomida
        # verdict yoki standings o'zgarishi natijani buzadi. Bu job'da
        # haqiqiy tekshiruv yo'q — ogohlantirish chiqariladi.
        # TODO: `manage.py contest_window` kabi buyruq qo'shilgach uni
        # shu yerda chaqiring va faol contest bo'lsa `exit 1` qiling.
        run: |
          echo "::warning::Live contest oynasi QO'LDA tekshirilsin — CI uni bilmaydi"

      - name: Sirlarni oldindan ko'chirish
        if: ${{ vars.DEPLOY_HOST != '' }}
        # Bu qadam .env.public ni YARATMAYDI — u handoff protokolida
        # ko'chiriladigan sirli fayllar (OAuth, email, tunnel kaliti)
        # uchun joy. Qiymatlar `.env.handoff.example` (R2) va 10-operations
        # § «Bir martalik sozlash» da.
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          echo "Qo'llanma: sirlar R2 orqali ko'chirilmaydi — 10-operations ga qarang"
          echo "DEPLOY_HOST=${DEPLOY_HOST} (ssh orqali ko'chirish hali avtomatlashtirilmagan)"

      - name: Stack'ni ko'tarish
        # Compose loyiha nomi ATAYLAB `rankwant`: handoff.sh ham, jonli
        # preview ham shu nomni ishlatadi, ya'ni `up` mavjud hajmlarni
        # (baza, MinIO) qayta ishlatadi. Boshqa nom ularni ko'rmaydi va
        # bo'sh baza bilan yangi stack ko'tarardi.
        run: |
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml \
            up -d --build --wait --wait-timeout 300

      - name: Health tekshiruvi
        # `--wait` konteyner healthy bo'lishini kutadi, lekin Django
        # tayyorligini bildirmaydi: migratsiya tugamagan bo'lsa 500 keladi.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null \
              -H 'Host: rankwant.uz' \
              http://127.0.0.1:8301/api/v1/health/; then
              echo "API sog'lom (urinish ${i})"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API 150 soniyada sog'lom bo'lmadi"
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml logs --tail 80 api worker
          exit 1

      - name: Smoke
        # Health — faqat API jarayoni tirikligi. Smoke esa kritik yo'lni
        # tekshiradi: submit → Redis → judge → verdict (api.yml dagi izoh).
        run: |
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml \
            run --rm smoke

      - name: Demo ma'lumot
        # Faqat staging'da. Production'da demo hisoblar zaif parolli va
        # ommaviy e'lon oldidan o'chirilishi kerak (10-operations § Ochiq
        # risklar), ya'ni ularni prodda QAYTA yaratish xatoni tiklaydi.
        if: ${{ (github.event.inputs.environment || 'staging') == 'staging' }}
        run: |
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml \
            exec -T api python manage.py seed_demo

      - name: Tunnel
        # Tashqi kirish Cloudflare Tunnel orqali, ochiq port yo'q.
        # Tunnel yuklanish jarayonida o'zi yoqilmaydi (10-operations),
        # ya'ni uni bu yerda ko'tarish shart.
        run: |
          if systemctl list-unit-files cloudflared.service >/dev/null 2>&1; then
            sudo systemctl start cloudflared
            echo "Tunnel yoqildi"
          else
            echo "::warning::cloudflared xizmati topilmadi — sayt tashqaridan ochilmaydi"
          fi

      - name: Deploy tugadi
        run: |
          echo "### Deploy: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Muhit: ${{ github.event.inputs.environment || 'staging' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compose loyihasi: rankwant" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: /api/v1/health/ ✅" >> "$GITHUB_STEP_SUMMARY"

      - name: Loglar (yiqilganda)
        if: failure()
        run: |
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml logs --tail 100

      # `down` ATAYLAB yo'q: bu jonli stack — uni tozalash saytni
      # o'chirib qo'yardi. Rollback kerak bo'lsa quyidagi job ishlatiladi.
