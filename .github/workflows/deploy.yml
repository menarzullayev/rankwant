name: Deploy

# Build, test, and deploy — started only by hand (see `on:`).
#
# Chain: build → test → deploy. Each stage `needs` the previous one,
# so a failed test means deploy NEVER starts.
#
# `ci.yml` already runs lint/mypy/OpenAPI on PR and main push.
# Heavy stack tests (pytest, smoke, E2E) live on Nightly.
# This workflow does NOT rewrite those checks — it calls them with
# `workflow_call`, which makes a passing test run a hard requirement
# for deploy. There is no second copy: the rules change in one place.

# Manual dispatch only (2026-09-17). Deploy itself has been manual since
# 2026-09-16 (see the `deploy` job), yet every push to main still ran this
# workflow: an image build plus a second full `ci.yml` pass, with the deploy
# job always skipped. On the single self-hosted runner (GitHub's free minutes
# are used up) that doubled the queue behind each merge, and queued PR jobs
# were cancelled with "The job was not acquired by Runner of type self-hosted
# even after multiple attempts". `ci.yml` already tests every push to main
# (lint/types; stack tests are Nightly).
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      # ⚠️ Added 2026-09-17: previously only an empty `vars.PUBLIC_ORIGIN`
      # held deploy back — filling that setting once was enough. After
      # the move to one engine (runner and live stack on the same Docker)
      # this job can reach the live stack DIRECTLY, so an accidental
      # start is a real deploy. An explicit confirmation is now required.
      confirm:
        description: "Touches the live stack — type `deploy` to confirm"
        type: string
        required: false
        default: ''

# The deploy job touches a shared resource on the runner machine
# (docker compose, tunnel): two deploys must not run at once.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  # The `test` job calls `ci.yml` with `uses:`. A called workflow can
  # only REDUCE permissions, not raise them: `ci.yml` asks for
  # `pull-requests: read` (for `dorny/paths-filter`). If the caller
  # does not grant it, GitHub does not start the run at all —
  # `startup_failure`, 0 jobs. It MUST be granted here.
  pull-requests: read

env:
  # The self-hosted runner runs as user `nsn` and also sees
  # `~/.local/lib/.../site-packages`. Stray packages there register
  # pytest plugins (same note as in ci.yml).
  PYTHONNOUSERSITE: '1'
  # Image tag being deployed — commit SHA for rollback.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1. BUILD ─────────────────────────────────────────────────────────
  # Images are built in a SEPARATE job, not after tests: a build error
  # (broken Dockerfile, missing dependency) reports faster and more
  # clearly than a test failure.
  build:
    name: Build — API, web, and judge images
    runs-on: [self-hosted, rankwant]
    # ⚠️ 10 minutes — a DELIBERATE exception (everywhere else is 1–3).
    # Measured: 166 s with a warm cache, but rebuilds after `apps/web`
    # changes DO NOT FIT in 3 minutes — the step was "cancelled"
    # (run 34898117925). Stuffing three image builds into 3 minutes
    # would require a better cache, not a tighter limit; for now the
    # limit matches reality.
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      # The deploy stack must not land in the same project as the live
      # preview: `down -v` would wipe its database (10-operations).
      COMPOSE_PROJECT_NAME: rankwant-build-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Docker present
        timeout-minutes: 1
        run: |
          docker version --format '{{.Server.Version}}' || {
            echo "::error::Docker not found — the deploy job needs the self-hosted runner"
            exit 1
          }

      - name: Build images
        timeout-minutes: 10
        # `docker compose build` — build context and build args come
        # from the compose file, so a hand-written `docker build`
        # command cannot drift from the file.
        run: |
          docker compose -f docker-compose.yml build \
            --parallel \
            api web judge

      - name: Tag images with the commit SHA
        id: meta
        # ⚠️ The source name comes from this job's `COMPOSE_PROJECT_NAME`:
        # compose names a built image `<project>-<service>`, i.e.
        # `rankwant-build-<run_id>-api`. This step used to look for
        # `rankwant_web` and failed with "No such image" — because the
        # project name is variable, COMPUTE it, do not search.
        timeout-minutes: 3
        run: |
          version="${GITHUB_SHA:0:12}"
          missing=0
          for svc in api web judge; do
            src="${COMPOSE_PROJECT_NAME}-${svc}:latest"
            if ! docker image inspect "$src" >/dev/null 2>&1; then
              echo "::error::$src not found — the build step did not create the image"
              missing=1
              continue
            fi
            docker tag "$src" "rankwant/${svc}:${version}"
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "::notice::Image tags: rankwant/{api,web,judge}:${version}"

      - name: Image size
        timeout-minutes: 1
        # Unexpected growth (e.g. `.venv` or `node_modules` falling
        # into the context) slows the build and fills the registry.
        run: docker images --format '{{.Repository}}:{{.Tag}}\t{{.Size}}' | grep '^rankwant' || true

  # ── 2. TEST ──────────────────────────────────────────────────────────
  # REUSE `ci.yml`. Inside: ruff, mypy (strict), migration check,
  # OpenAPI diff. Smoke, E2E, and pytest live on Nightly. No `fail-fast`:
  # every job finishes, otherwise only the first failure is visible and
  # the rest stay hidden.
  test:
    name: Test — CI suite
    needs: build
    uses: ./.github/workflows/ci.yml

  # ── 3. DEPLOY ────────────────────────────────────────────────────────
  deploy:
    name: Deploy — ${{ github.event.inputs.environment || 'staging' }}
    needs: [build, test]
    # `vars.PUBLIC_ORIGIN` gate: if deploy secrets are not set yet
    # (they are not — 0 secrets/variables in the repo), the job would
    # fail with a red X on every push. Skipping is not hiding: `build`
    # and `test` still run in full, deploy is grey (skipped), so
    # "not configured" is visible.
    #
    # ⚠️ DECISION (2026-09-16): deploy STAYS MANUAL — a deliberate
    # choice. The reason was measured: this job CANNOT deploy
    # production, because the live stack is on the Docker Desktop
    # engine (image `rankwant-api:latest`) and the runner was on a
    # SEPARATE engine inside WSL Ubuntu (`rankwant/api:<sha>`). So
    # `up` raised its own stack on the second engine — 8300/8301
    # taken, or a parallel stack nobody routed. On top of that: no
    # migration step here, no environment protection
    # (`environments` = 0), so an automatic deploy would have gone
    # out during a live contest too (rule №1).
    #
    # Manual path: `bash tools/deploy.sh` (checks the live window
    # itself). Full evidence: docs/10-operations/deploy-runbook.md § 1.
    #
    # ⚠️ NEW GATE (2026-09-17): `confirm == 'deploy'`. Reason — after
    # the move to one engine this job can reach the live stack
    # (previously the engine split stopped it). The other two gaps
    # are still there: no migration step and no `environments`
    # protection (required reviewer). Automatic deploy stays OFF
    # until those are added.
    if: >-
      ${{
        (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        && vars.PUBLIC_ORIGIN != ''
        && github.event.inputs.confirm == 'deploy'
      }}
    runs-on: [self-hosted, rankwant]
    # ⚠️ More than 3 minutes — a DELIBERATE exception: a full stack
    # `up --build` (--wait-timeout 300) plus 30 health attempts
    # (150 s) do not fit. Every other job/step is 1–3 minutes.
    timeout-minutes: 10
    environment:
      # If production has a required reviewer in GitHub, deploy waits
      # until a human confirms. This is a 10-operations requirement:
      # "NO deploy during a live contest" — only a person can check
      # that rule, so confirmation must be mandatory.
      name: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configuration
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_ALLOWED_HOSTS: ${{ vars.DJANGO_ALLOWED_HOSTS }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
        run: |
          missing=0
          for name in DJANGO_SECRET_KEY DJANGO_ALLOWED_HOSTS PUBLIC_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set — add it under Environment secrets/variables"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # `.env.public` is gitignored: it is never in the repo, so
          # it is built from the values at deploy time.
          umask 077
          cat > .env.public <<EOF
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
          PUBLIC_ORIGIN=${PUBLIC_ORIGIN}
          EOF
          echo "::notice::.env.public written ($(wc -l < .env.public) lines)"

      - name: Live contest window
        # 10-operations § Deploy rules, rule 1: during a contest a
        # change to verdicts or standings corrupts the result.
        #
        # This is now a REAL check: `tools/check_deploy_window.py`
        # reads `is_running` from the live API. Three exit codes on
        # purpose: 0 — clear, 1 — an active contest, 2 — unknown.
        # Only 1 stops: treating 2 ("API did not answer") as a stop
        # would block the deploy that fixes a down site; treating it
        # as "clear" would be a false green.
        run: |
          set +e
          python3 tools/check_deploy_window.py
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::An active contest/arena is running — deploy stopped (rule №1)"
            exit 1
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::Window could not be determined — confirm by hand"
          fi

      - name: Copy secrets first
        if: ${{ vars.DEPLOY_HOST != '' }}
        # This step does NOT CREATE .env.public — it is a slot for
        # secret files copied by the handoff protocol (OAuth, email,
        # tunnel key). Values are in `.env.handoff.example` (R2) and
        # 10-operations § "One-time setup".
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          echo "Guide: secrets are not copied via R2 — see 10-operations"
          echo "DEPLOY_HOST=${DEPLOY_HOST} (ssh copy is not automated yet)"

      - name: Bring the stack up
        # Compose project name is `rankwant` ON PURPOSE: handoff.sh and
        # the live preview use that name, so `up` reuses existing
        # volumes (database, MinIO). Another name would not see them
        # and would raise a new stack with an empty database.
        run: |
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml \
            up -d --build --wait --wait-timeout 300

      - name: Health check
        # `--wait` waits for the container to be healthy, but does not
        # say Django is ready: if migrations have not finished, 500.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null \
              -H 'Host: rankwant.uz' \
              http://127.0.0.1:8301/api/v1/health/; then
              echo "API healthy (attempt ${i})"
              exit 0
            fi
            sleep 5
          done
          echo "::error::API was not healthy after 150 seconds"
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml logs --tail 80 api worker
          exit 1

      - name: Smoke
        # Health is only "the API process is alive". Smoke checks the
        # critical path: submit → Redis → judge → verdict (same note
        # as in ci.yml).
        run: |
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml \
            run --rm smoke

      - name: Demo data
        # Staging only. On production the demo accounts have weak
        # passwords and must be deleted before a public launch
        # (10-operations § Open risks), so recreating them in prod
        # restores the mistake.
        if: ${{ (github.event.inputs.environment || 'staging') == 'staging' }}
        run: |
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml \
            exec -T api python manage.py seed_demo

      - name: Tunnel
        # External access is through Cloudflare Tunnel; no open port.
        # The tunnel does not start itself during boot (10-operations),
        # so it must be brought up here.
        #
        # ⚠️ 2026-09-17: this step was written for LINUX (`systemctl`).
        # A container runner has NO systemd, and on the Windows side
        # the tunnel is managed by `tools/handoff.ps1` with a PID file.
        # So the step now DETECTS the environment and prints a clear
        # message — it does not stop at a silent "not found" warning.
        run: |
          if ! command -v systemctl >/dev/null 2>&1; then
            echo "no systemd (container runner) — the tunnel is managed"
            echo "on the Windows side: tools/handoff.ps1 / RankWant Tunnel Monitor."
            exit 0
          fi
          if systemctl list-unit-files cloudflared.service >/dev/null 2>&1; then
            sudo systemctl start cloudflared
            echo "Tunnel started"
          else
            echo "::warning::cloudflared service not found — the site will not open from outside"
          fi

      - name: Deploy finished
        run: |
          echo "### Deploy: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ github.event.inputs.environment || 'staging' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compose project: rankwant" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: /api/v1/health/ ✅" >> "$GITHUB_STEP_SUMMARY"

      - name: Logs (on failure)
        if: failure()
        run: |
          docker compose -p rankwant --env-file .env.public \
            -f docker-compose.yml -f docker-compose.public.yml logs --tail 100

      # ⚠️ Old images are cleaned ON PURPOSE (2026-09-16).
      # Measured: 122 `rankwant-build-*` piled up and filled the
      # runner's WSL disk — C: had 9.59 GB left. This job builds a
      # new image every run; nothing used to delete the old ones.
      #
      # THIS run's images are KEPT: they are attached to containers
      # that are running now. Only previous runs' images go.
      - name: Clean old images
        if: always()
        run: |
          set -u
          echo "--> images from previous runs (other than ${COMPOSE_PROJECT_NAME}-*)"
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E '^rankwant-build-' \
            | grep -v "^${COMPOSE_PROJECT_NAME}-" \
            | xargs -r docker rmi -f || true
          echo "--> CI leftovers older than 6 hours (rw-*)"
          docker images --format '{{.ID}}|{{.CreatedSince}}|{{.Repository}}' \
            | awk -F'|' '$3 ~ /^rw-/ && $2 ~ /hours|days|weeks|months/ {print $1}' \
            | sort -u | xargs -r docker rmi -f || true
          echo "--> build cache (older than 7 days)"
          # ⚠️ `docker builder prune` is not split by project — it hits
          # the whole engine. On one engine that also makes the live
          # cache a candidate; that is why the window went from 24
          # hours to 7 days. The complete fix is a daemon-level
          # cache-size cap (open).
          docker builder prune -f --filter 'until=168h' || true

      # `down` is ABSENT ON PURPOSE: this is the live stack — tearing
      # it down would take the site down. Use the rollback job if needed.
