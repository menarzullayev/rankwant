name: Update Visual Baselines

# Visual regression snapshot'larini CI muhitida (Linux konteyner) yangilaydi.
# Baseline'lar faqat Linux'da barqaror — Windows/Mac'da olinganlar
# konteyner shriftlari bilan mos kelmaydi.
#
# Ishlatish:
#   gh workflow run update-visual-baselines.yml --ref main
#
# Natija: yangi snapshot'lar branchga push qilinadi va PR ochiladi.

on:
  workflow_dispatch:
  # Vaqtinchalik: GitHub yangi workflow'ni faqat push'dan keyin registratsiya qiladi
  push:
    branches: [fix/visual-baseline-push-trigger]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: rw-visual-update
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PUSH_IMAGE_CACHE: ${{ github.event.repository.fork && '0' || '1' }}
      E2E_BASE_URL: http://web:3000
      E2E_API_BASE: http://api:8000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stack
        run: bash tools/ci_stack.sh

      - name: Run actions/setup-node@v7
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: E2E deps
        run: cd tests/e2e && npm ci

      - name: Update visual baselines
        run: |
          bash tools/ci_playwright.sh -- \
            npx playwright test --project=visual --update-snapshots --reporter=list

      - name: Upload new baselines as artifact
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: tests/e2e/visual/visual.spec.ts-snapshots/
          retention-days: 7

      - name: Commit and push
        run: |
          git config user.name "CI Bot"
          git config user.email "ci@rankwant.uz"
          git add tests/e2e/visual/visual.spec.ts-snapshots/
          git diff --cached --quiet && echo "No changes" && exit 0
          git checkout -b ci/update-visual-baselines
          git commit -m "chore: update visual baselines from CI

Generated by workflow: ${{ github.workflow }}
Run: ${{ github.run_id }}
Ref: ${{ github.ref }}"
          git push -u origin ci/update-visual-baselines

      - name: Create PR
        if: success()
        run: |
          gh pr create \
            --base main \
            --head ci/update-visual-baselines \
            --title "chore: update visual baselines from CI" \
            --body "Automated update of visual regression baselines.

- Workflow: ${{ github.workflow }}
- Run: ${{ github.run_id }}
- Ref: ${{ github.ref }}

These snapshots were generated in the CI Linux container and should
match the nightly visual gate environment."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
