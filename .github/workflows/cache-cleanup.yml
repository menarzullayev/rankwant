name: Cache cleanup

# A closed pull request leaves its caches behind (`refs/pull/<n>/merge`), and
# only the base branch can reuse nothing of them. Together they pushed the
# repository above GitHub's 10 GB cache limit, which then evicts the caches
# `main` actually needs (owner decision 2026-11-15). Deleting them on close
# keeps the budget for `main`.
on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    name: Delete the pull request's caches
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Delete caches of refs/pull/${{ github.event.pull_request.number }}/merge
        env:
          GH_TOKEN: ${{ github.token }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: |
          set -euo pipefail
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$REF" --limit 100 --json id --jq '.[].id')
          for id in $ids; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done
          echo "deleted: $(echo "$ids" | grep -c . || true)"
