name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      burst:
        description: 'Also run the judge burst (about 45 minutes; never on the schedule)'
        type: boolean
        default: false
      burst_size:
        description: 'Submissions sent at once'
        type: string
        default: '1000'
      burst_judges:
        description: 'Judge replicas taking from the queue'
        type: string
        default: '1'
      burst_canary:
        description: 'Share of heavy fixed-work solutions (0 to 0.5)'
        type: string
        default: '0.10'

# Keep stray `~/.local` packages out of the job (self-hosted runner).
env:
  PYTHONNOUSERSITE: '1'

permissions:
  contents: read
  packages: write

jobs:
  #: The ONLY job that writes the image cache (2026-10-07).
  #:
  #: Before, five jobs each ended with `--push-only`. On a day the judge
  #: changed (run of c3623d9) each of them uploaded the same multi-GB image:
  #: 5.2-6.5 minutes per job, and the `latency` job was cancelled by its
  #: time limit inside that step, after its measurement had passed.
  #:
  #: No job `needs:` this one. Every job still resolves its own images
  #: (pull when the registry has them, build when it does not), so a day
  #: with a changed image costs each job its build and nobody a queue.
  images:
    name: Image cache
    runs-on: ubuntu-latest
    # A changed judge Dockerfile rebuilds every toolchain here (measured
    # 7-10 min) and then uploads it; everything else is a pull.
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: rw-${{ github.job }}-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PUSH_IMAGE_CACHE: ${{ github.event.repository.fork && '0' || '1' }}
      CI_STACK_UP: '0'
      CI_ONLY_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve images
        run: bash tools/ci_stack.sh
      - name: Push image cache
        if: ${{ env.CI_PUSH_IMAGE_CACHE == '1' }}
        run: bash tools/ci_stack.sh --push-only
      - name: Clean images
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}'             | grep -E "^${COMPOSE_PROJECT_NAME}-"             | xargs -r docker rmi -f || true

  load:
    name: Load — read capacity
    runs-on: ubuntu-latest
    # ⚠️ More than 3 minutes — a DELIBERATE exception: this job brings
    # up the full compose stack with `up -d --build --wait`, so image
    # builds are inside it. A 3-minute cap makes the job a guaranteed
    # red (measured on deploy/build). There IS a limit; unlimited is
    # not the goal.
    timeout-minutes: 15
    # Compose project is PER JOB. On one runner jobs ran in series so
    # this did not show; with a second runner two jobs sharing a stack
    # name would take each other's containers down with `down -v`.
    env:
      COMPOSE_PROJECT_NAME: rw-${{ github.job }}-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PUSH_IMAGE_CACHE: ${{ github.event.repository.fork && '0' || '1' }}
      # `docker-compose.ci.yml` jonli loyihaga qarshi ishlatilsa stack'ni
      # buzadi — fayl shu sentinelsiz yuklanmaydi (2026-09-24).
      CI_ONLY_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        if: ${{ vars.STAGING_URL == '' }}
        run: |
          bash tools/ci_stack.sh
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_demo
      - name: k6 — bounded load
        if: ${{ vars.STAGING_URL == '' }}
        # `--vus 1 --duration 1s` was a syntax check. The `ci` scenario
        # is a measurement that does not knock the runner over but still
        # gives a real number. Anon throttle is raised on the CI stack —
        # otherwise the measurement shows the rate limit, not capacity
        # (it was 94% 429).
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --network "${COMPOSE_PROJECT_NAME}_default" -v "${HOST_REPO_ROOT:-$PWD}:/w" -w /w \
            -e SCENARIO=ci -e API_BASE=http://api:8000/api/v1 \
            grafana/k6:latest run tests/load/main.js
      - name: Staging load
        if: ${{ vars.STAGING_URL != '' }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${HOST_REPO_ROOT:-$PWD}:/w" -w /w grafana/k6:latest \
            run -e SCENARIO=spike -e API_BASE="${{ vars.STAGING_URL }}/api/v1" \
            tests/load/main.js
      - name: Tear down
        if: always()
        run: CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
      # `down -v` leaves the images this run built. Since 2026-09-17 CI
      # runs on the Docker Desktop engine next to the live stack, and one
      # nightly run left 18 of them behind (`rw-load-*`, `rw-e2e-*`,
      # `rw-chaos-*`) until an unrelated CI run's cleanup removed them
      # hours later. On a day without other CI they would pile up, the
      # way 420 `rw-smoke-*` images filled the WSL disk to 58 GB on
      # 2026-09-16.
      - name: Clean images
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E "^${COMPOSE_PROJECT_NAME}-" \
            | xargs -r docker rmi -f || true

  #: ⚠️ Brauzerlar ALOHIDA job matritsasida (2026-09-28).
  #:
  #: Ilgari to'rtta loyiha (`e2e`, `firefox`, `webkit`, `mobile`) BITTA
  #: qadamda ketma-ket yurardi va butun Nightly'ning devor-soatini aynan
  #: o'sha qadam belgilardi. O'lchandi (run 36411801103): qolgan 6 job
  #: **≤6.5 daqiqada** tugadi, brauzer qadami esa **12+ daqiqadan** keyin
  #: ham davom etayotgan edi. Ya'ni yig'indi emas — bitta qadam butun
  #: ishni ushlab turardi.
  #:
  #: Endi har loyiha o'z jobida parallel yuradi ⇒ devor-soat = eng sekin
  #: LOYIHA, to'rttasining yig'indisi emas.
  #:
  #: ⚠️ `COMPOSE_PROJECT_NAME` da `matrix.project` SHART. `github.job`
  #: barcha matritsa a'zolarida bir xil, ya'ni loyihasiz nom to'qnashardi
  #: va bittasining `down -v` i boshqasining konteynerlarini o'chirardi —
  #: bu faylning boshqa joyida yozilgan tuzoqning aynan o'zi.
  e2e-browsers:
    name: E2E — ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      #: Bittasi yiqilsa qolgani TO'XTAMASIN: nightly'da to'rttasining
      #: natijasi kerak, birinchisining xatosi emas.
      fail-fast: false
      matrix:
        project: [e2e, firefox, webkit, mobile]
    env:
      COMPOSE_PROJECT_NAME: rw-e2e-${{ matrix.project }}-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #: Keshni faqat bitta job yozadi — to'rttasi bir vaqtda push qilsa
      #: GHCR'da poyga bo'lardi.
      CI_PUSH_IMAGE_CACHE: '0'
      CI_ONLY_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        if: ${{ vars.STAGING_URL == '' }}
        run: |
          bash tools/ci_stack.sh
          # Web healthcheck `/` ni seed'dan oldin uradi; Next Data Cache
          # keyin bo'sh `/roadmaps/` ni 300s ushlab qoladi.
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_demo
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml restart web
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait web
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: E2E deps
        run: npm ci
        working-directory: tests/e2e
      - name: Playwright — ${{ matrix.project }}
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL || 'http://web:3000' }}
          E2E_API_BASE: ${{ vars.STAGING_URL && format('{0}/api/v1', vars.STAGING_URL) || 'http://api:8000/api/v1' }}
        run: bash tools/ci_playwright.sh -- npx playwright test --project=${{ matrix.project }} --reporter=list
      - name: Upload diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.project }}-diffs
          path: |
            tests/e2e/test-results/
            tests/e2e/visual/**/*-diff.png
            tests/e2e/visual/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down
        if: always()
        run: CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
      - name: Clean images
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep "^${COMPOSE_PROJECT_NAME}-" | xargs -r docker rmi -f || true

  e2e:
    name: E2E — visual gate and bake-off
    runs-on: ubuntu-latest
    # ⚠️ More than 3 minutes — a DELIBERATE exception: this job brings
    # up the full compose stack with `up -d --build --wait`, so image
    # builds are inside it. A 3-minute cap makes the job a guaranteed
    # red (measured on deploy/build). There IS a limit; unlimited is
    # not the goal. 20 min: smoke + bake-off folded in from main CI
    # (2026-09-20); chromium-only smoke used to need 20 on its own.
    #
    # ⚠️ 20 daqiqa (2026-09-28). Ilgari bu job brauzer matritsasini ham
    # yuritardi va 20 daqiqa yetmasdi (o'lchandi: 23 daqiqada ham
    # tugamadi). Matritsa `e2e-browsers` ga ko'chgach bu yerda faqat
    # stack + smoke + 3 vizual qadam + bake-off qoldi — ular 20 daqiqaga
    # sig'adi. Haqiqiy davomiylik keyingi yurishda o'lchanadi.
    timeout-minutes: 20
    # Compose project is PER JOB. On one runner jobs ran in series so
    # this did not show; with a second runner two jobs sharing a stack
    # name would take each other's containers down with `down -v`.
    env:
      COMPOSE_PROJECT_NAME: rw-${{ github.job }}-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PUSH_IMAGE_CACHE: ${{ github.event.repository.fork && '0' || '1' }}
      # `docker-compose.ci.yml` jonli loyihaga qarshi ishlatilsa stack'ni
      # buzadi — fayl shu sentinelsiz yuklanmaydi (2026-09-24).
      CI_ONLY_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        # Against STAGING_URL when set, otherwise against its own stack.
        if: ${{ vars.STAGING_URL == '' }}
        run: |
          bash tools/ci_stack.sh
          # Web healthcheck hits `/` before seed. Next Data Cache then keeps
          # empty `/roadmaps/` for 300s (`browse.spec.ts` «O'quv rejalari»).
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_demo
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml restart web
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait web
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: E2E deps
        run: npm ci
        working-directory: tests/e2e
      #: ⚠️ Brauzer matritsasi BU YERDAN `e2e-browsers` ga ko'chdi
      #: (2026-09-28) — u bitta qadamda ketma-ket yurib, butun Nightly'ning
      #: devor-soatini belgilardi. Bu job endi faqat vizual darvoza va
      #: bake-off ni yuritadi; ikkalasi ham chromium-only va stack'ni
      #: allaqachon ko'targan.
      # RW-ARCH-016: pixel comparison, chromium only (other engines render
      # fonts and shadows differently, so one baseline cannot serve all).
      # Separate step so a screenshot diff is distinguishable from a
      # functional failure in the run summary.
      #
      # ⚠️ Baselines are committed under `tests/e2e/visual/*-snapshots/`.
      # An intentional design change needs
      # `--project=visual --update-snapshots` and the new PNGs in the PR.
      #
      # ⚠️ `--forbid-only` would be wrong here; instead the step relies on
      # the default "no baseline = fail" behaviour. On a brand-new page the
      # first run writes the baseline and fails once — that is on purpose:
      # a screenshot nobody reviewed must not silently become the truth.
      - name: Visual regression (pixel diff)
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL || 'http://web:3000' }}
          E2E_API_BASE: ${{ vars.STAGING_URL && format('{0}/api/v1', vars.STAGING_URL) || 'http://api:8000/api/v1' }}
        run: bash tools/ci_playwright.sh -- npx playwright test --project=visual --reporter=list
      # ⚠️ Baseline'lar FAQAT shu image'da olinadi.
      #
      # 2026-09-24 o'lchandi: Windows'da olingan baseline Linux
      # konteynerida 6/6 sahifada **3–4%** farq berdi (chegara 1%).
      # Diff rasmda butun matn qizil — ya'ni sabab shrink antialiasing,
      # layout emas. Konteynerda 50 ta shrift bor, `Inter` yo'q.
      #
      # Ya'ni baseline'ni boshqa muhitda yangilash CI'ni darhol qizil
      # qiladi. Ushbu qadam buni JIM qoldirmaydi.
      - name: Visual baselines match this image
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL || 'http://web:3000' }}
          E2E_API_BASE: ${{ vars.STAGING_URL && format('{0}/api/v1', vars.STAGING_URL) || 'http://api:8000/api/v1' }}
        run: bash tools/ci_playwright.sh -- bash /e2e/scripts/check-baseline-drift.sh
      # ⚠️ Proof the pixel gate is not decorative.
      #
      # 2026-09-24: the first "non-vacuous proof" mutated `--rw-rank-grey`
      # and the suite stayed green — the token simply is not visible on the
      # pages we screenshot. The conclusion "the gate works" was wrong; the
      # mutation was dead. This step re-runs the check with a token we KNOW
      # is visible (`--rw-ground`) and requires a real pixel count in the
      # output. It is the only thing standing between us and a suite that
      # diffs nothing.
      #
      #
      # ⚠️ Against THIS job's compose stack (2026-11-10). Until then both
      # steps below pointed at `localhost:3400`, which the CI stack never
      # serves (`docker-compose.ci.yml` resets every host port): they warned
      # and exited 0 on every hosted run, i.e. measured nothing (runs
      # 42716046958, 42721061218). Now the proof serves a control and a
      # rebuilt mutant web image next to the stack (~4-5 min; the stack's
      # own `web` is not touched), and a missing stack FAILS the step.
      # `check_decisions.py` → `nightly_live_gates_measure` keeps it so.
      - name: Visual gate is live (mutation proof)
        if: ${{ vars.STAGING_URL == '' }}
        timeout-minutes: 10
        run: bash tools/ci_visual_gate.sh
      # CSP nonce coverage — the same slot as the visual gate, for the same
      # reason: it reads a rendered page, so it needs the stack. It does not
      # rebuild, so it costs seconds rather than minutes. Measured 2026-09-24:
      # four scripts were blocked on the live `/login` (the three pre-hydration
      # bootstrap tags and the dictionary's fast path) while every gate in the
      # repo stayed green. It reads the stack's web container by its address
      # on the compose network.
      #
      # `!cancelled()`: it does not depend on the pixel gate, so a visual
      # diff must not leave it unmeasured (the same reason as smoke and
      # bake-off below).
      - name: CSP nonce coverage is live
        if: ${{ !cancelled() && vars.STAGING_URL == '' }}
        timeout-minutes: 3
        run: bash tools/ci_csp_gate.sh
      # Screenshots land in the container's `test-results/`, which is bind
      # mounted from the repo, so the artifact upload below picks them up.
      - name: Upload visual diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: |
            tests/e2e/test-results/
            tests/e2e/visual/**/*-diff.png
            tests/e2e/visual/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 7
      # ⚠️ Smoke SHU YERDA — visual qadamlardan KEYIN. Sabab: smoke
      # `submit → Redis → judge → verdict` yuritadi, ya'ni stack'ga
      # yechim qo'shadi va `/rating`, `/profile`, `/problems`
      # sahifalarining ko'rinishini o'zgartiradi. Ilgari smoke
      # visual'dan OLDIN yurardi va pixel diff shu ifloslangan holat
      # bilan solishtirilardi — natijada 5% threshold ham yetmasdi.
      # Tasdiq: toza stack'da (`refresh-visual` workflow'i, run
      # 36428814887) snapshot'lar commit'dagilar bilan BAYT-BAYT
      # BIR XIL chiqdi — ya'ni baseline'lar to'g'ri, muammo tartibda
      # edi. Visual endi toza (seed qilingan) stack'da yuradi.
      #
      # ⚠️ `!cancelled()` (2026-11-10, audit Q-04). Smoke va bake-off
      # vizual qadamlarga BOG'LIQ EMAS, lekin standart `success()` sharti
      # ularni har vizual farqda o'tkazib yuborardi. O'lchandi: `login.png`
      # eskirgani uchun Nightly 2026-10-26 dan 15 kun ketma-ket qizil bo'ldi
      # va shu 15 kunda haqiqiy nsjail'dagi bake-off BIR MARTA HAM yurmadi —
      # judge izolyatsiyasi ikki hafta tekshirilmadi, sabab esa «piksel farqi»
      # deb ko'rinardi. Endi vizual yiqilsa ham ikkalasi yuradi va o'z
      # natijasini o'zi aytadi.
      - name: Smoke
        if: ${{ !cancelled() && vars.STAGING_URL == '' }}
        timeout-minutes: 5
        # Critical path: submit → Redis → judge → verdict. Moved off
        # main CI (2026-09-20): the stack is already up here.
        run: CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm smoke
      - name: Bake-off — validator cases (real nsjail)
        if: ${{ !cancelled() && vars.STAGING_URL == '' }}
        # ⚠️ `continue-on-error` YO'Q (2026-11-10, audit Q-04). 2026-09-28
        # dan beri bu yerda «vaqtincha» `continue-on-error: true` turardi:
        # bake-off o'shanda natija qaytarmay timeout bo'lardi. U qator
        # qolgan holda judge izolyatsiyasi yiqilsa ham Nightly YASHIL
        # chiqardi — ya'ni ADR-0004 darvozasi bezak edi. Endi yiqilgan
        # bake-off butun Nightly'ni qizartiradi; `check_decisions.py` →
        # `nightly_bakeoff_is_a_gate` qatorning qaytishini ushlaydi.
        timeout-minutes: 8
        # ADR-0020: a bad input is rejected BEFORE a submission runs.
        # Full suite (21 cases), measured 2026-09-16 — all in 11.2 s.
        # After E2E: worker/beat would drain harness results if left up.
        run: |
          C="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          $C stop worker beat
          $C --profile bakeoff run --rm bakeoff
      - name: Tear down
        if: always()
        run: CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
      # `down -v` leaves the images this run built. Since 2026-09-17 CI
      # runs on the Docker Desktop engine next to the live stack, and one
      # nightly run left 18 of them behind (`rw-load-*`, `rw-e2e-*`,
      # `rw-chaos-*`) until an unrelated CI run's cleanup removed them
      # hours later. On a day without other CI they would pile up, the
      # way 420 `rw-smoke-*` images filled the WSL disk to 58 GB on
      # 2026-09-16.
      - name: Clean images
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E "^${COMPOSE_PROJECT_NAME}-" \
            | xargs -r docker rmi -f || true
          # Was on CI smoke (2026-09-20): that job is gone, so Nightly
          # e2e prunes the shared build cache. 7 days: live deploy cache
          # is usually reused within a week.
          docker builder prune -f || true

  chaos:
    name: Chaos — dependency cut
    runs-on: ubuntu-latest
    # ⚠️ More than 3 minutes — a DELIBERATE exception: this job brings
    # up the full compose stack with `up -d --build --wait`, so image
    # builds are inside it. A 3-minute cap makes the job a guaranteed
    # red (measured on deploy/build). There IS a limit; unlimited is
    # not the goal.
    timeout-minutes: 15
    # Compose project is PER JOB. On one runner jobs ran in series so
    # this did not show; with a second runner two jobs sharing a stack
    # name would take each other's containers down with `down -v`.
    env:
      COMPOSE_PROJECT_NAME: rw-${{ github.job }}-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PUSH_IMAGE_CACHE: ${{ github.event.repository.fork && '0' || '1' }}
      # `docker-compose.ci.yml` jonli loyihaga qarshi ishlatilsa stack'ni
      # buzadi — fayl shu sentinelsiz yuklanmaydi (2026-09-24).
      CI_ONLY_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        run: |
          bash tools/ci_stack.sh
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_demo
      - name: Chaos
        # Chaos BREAKS services ON PURPOSE. The runner's own stack —
        # there is nothing else to break, so staging is not required.
        env:
          COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
          I_UNDERSTAND_THIS_IS_STAGING: 'yes'
        run: tests/chaos/run.sh
      - name: Tear down
        if: always()
        run: CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
      # `down -v` leaves the images this run built. Since 2026-09-17 CI
      # runs on the Docker Desktop engine next to the live stack, and one
      # nightly run left 18 of them behind (`rw-load-*`, `rw-e2e-*`,
      # `rw-chaos-*`) until an unrelated CI run's cleanup removed them
      # hours later. On a day without other CI they would pile up, the
      # way 420 `rw-smoke-*` images filled the WSL disk to 58 GB on
      # 2026-09-16.
      - name: Clean images
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E "^${COMPOSE_PROJECT_NAME}-" \
            | xargs -r docker rmi -f || true

  compatibility:
    name: Language matrix
    runs-on: ubuntu-latest
    # ⚠️ More than 3 minutes — a DELIBERATE exception: this job brings
    # up the full compose stack with `up -d --build --wait`, so image
    # builds are inside it. A 3-minute cap makes the job a guaranteed
    # red (measured on deploy/build). There IS a limit; unlimited is
    # not the goal.
    #
    # ⚠️ 25 daqiqa (2026-09-28) — 10 YETMAYDI. Xuddi `e2e` kabi: job
    # `Stack` da erta yiqilardi va haqiqiy davomiyligi o'lchanmagan edi.
    # Stack tuzatilgach o'lchandi — 10 daqiqada ham tugamadi
    # (10m16s da chegara bekor qildi). 25 — zaxira bilan.
    timeout-minutes: 25
    # Compose project is PER JOB. On one runner jobs ran in series so
    # this did not show; with a second runner two jobs sharing a stack
    # name would take each other's containers down with `down -v`.
    env:
      COMPOSE_PROJECT_NAME: rw-${{ github.job }}-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PUSH_IMAGE_CACHE: ${{ github.event.repository.fork && '0' || '1' }}
      CI_STACK_SERVICES: judge
      CI_STACK_UP: '0'
      # `docker-compose.ci.yml` jonli loyihaga qarshi ishlatilsa stack'ni
      # buzadi — fayl shu sentinelsiz yuklanmaydi (2026-09-24).
      CI_ONLY_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Judge image
        run: bash tools/ci_stack.sh
      - name: Declared versions match the image
        # Each language prints its own runtime version. This check
        # catches "shown as Python 3.12, actually 3.11" — that mismatch
        # looks like a confusing SyntaxError to the user.
        run: python3 tests/compatibility/check_languages.py "${COMPOSE_PROJECT_NAME}-judge"
      - name: Tear down
        # The tag is per run now, so it has to go, like the smoke job's images.
        if: always()
        run: docker image rm "${COMPOSE_PROJECT_NAME}-judge" || true

  security:
    name: Security — static suite
    runs-on: ubuntu-latest
    # ⚠️ The time limit is REQUIRED: nothing on the self-hosted runner may
    # wait forever. This job installs one wheel and reads repository files —
    # measured locally, the checks themselves take under a second. 3 minutes
    # is the cap, not a budget to spend.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      # `check_compose.py` parses `docker-compose.yml` with PyYAML, so the
      # suite needs one wheel the runner does not ship.
      #
      # It is NOT taken from `apps/api/requirements.lock`: that would install
      # the whole Django stack (~1 min) to parse one file. It is NOT run
      # inside the `api` image either — that would make `tools/ci_stack.sh`
      # build an image (measured: 120–180 s warm) for a job that never starts
      # a service. These checks read repository FILES, not a running stack.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: PyYAML for the compose check
        run: pip install pyyaml
      - name: Static suite — judge host, IDOR, PAT hash, rate limits
        # Open divergence of docs/research/2026-09-21-security-boundary/ § 5:
        # `tests/security/run.sh` was invoked only from the DISABLED
        # `security.yml` (`workflow_dispatch` + `if: false`), so its static
        # half ran nowhere automatically while the file itself claimed it ran
        # on every PR.
        #
        # `SECURITY_STATIC_ONLY=1` is deliberate, not a shortcut: the dynamic
        # half (isolation cases 09-fork-bomb … 13-symlink) already runs in
        # this workflow's `e2e` job via `--profile bakeoff`, with the same
        # `runner.py` and the same case set (all 25 in
        # `services/bakeoff/cases/`, no `--cases` filter). Running it a second
        # time would add a full stack to a job that needs none and buy no
        # extra assurance. See docs/research/2026-09-21-security-suite/.
        #
        # Own job, not a step in `e2e`: same reasoning as the latency job
        # above — a security failure inside the browser matrix would be
        # attributed to the wrong thing.
        env:
          SECURITY_STATIC_ONLY: '1'
        run: tests/security/run.sh

  #: ── Dependency and secret scanners — REPORT ONLY (2026-11-10, audit Q-11)
  #:
  #: gitleaks, pip-audit and npm audit lived only in `security.yml`, which is
  #: disabled (owner decision 2026-09-21: `workflow_dispatch` + `if: false`),
  #: so none of them ran anywhere. The owner chose Nightly, report-only:
  #:   * a FINDING never fails the job — it is a `::warning::` and a table on
  #:     the run page (also in the log), so a new advisory upstream cannot turn Nightly red and
  #:     hide the gates that do block;
  #:   * a BROKEN SCANNER does fail it. Each job first feeds its tool a planted
  #:     finding (a canary) and fails when the tool does not see it, and the
  #:     real report must parse. "0 findings" from a blind scanner is the dead
  #:     gate this repo keeps finding: measured 2026-11-10, `.gitleaks.toml`
  #:     had no `[extend] useDefault = true`, so gitleaks loaded ZERO rules
  #:     and `security.yml` would have reported a clean history forever.
  #:
  #: Not on PRs: nothing here may block a merge (`pr_skips_heavy_ci`).
  scan-secrets:
    name: Scan — secrets (gitleaks, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS: zricethezav/gitleaks:v8.30.1
    steps:
      # gitleaks reads the whole history, so a full clone.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: The scanner sees a planted token (canary)
        # The token is generated here, never committed: a committed one would
        # itself be a finding in every later history scan.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canary"
          python3 -c "import secrets, string; a = string.ascii_letters + string.digits; print('token = \"ghp_' + ''.join(secrets.choice(a) for _ in range(36)) + '\"')" \
            > "$RUNNER_TEMP/canary/settings.py"
          rc=0
          docker run --rm -v "$RUNNER_TEMP/canary:/scan:ro" -v "$PWD/.gitleaks.toml:/cfg.toml:ro" "$GITLEAKS" \
            dir /scan --config /cfg.toml --no-banner --redact --exit-code 7 > /dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 7 ]; then
            echo "::error::gitleaks did not report a planted ghp_ token (exit $rc, 7 expected) — the history scan below would be blind"
            exit 1
          fi
          echo "canary seen ✓"
      - name: gitleaks — full history
        run: |
          set -euo pipefail
          # `--exit-code 0`: findings are reported, not fatal. An error in
          # gitleaks itself still exits non-zero and fails this step.
          docker run --rm -v "$PWD:/repo" "$GITLEAKS" git /repo --config /repo/.gitleaks.toml \
            --no-banner --redact --exit-code 0 --report-format json --report-path /repo/gitleaks.json
          n=$(jq length gitleaks.json)
          {
            echo "### gitleaks — $n finding(s) in the full history (redacted)"
            if [ "$n" -gt 0 ]; then
              echo
              echo "| Rule | File | Commit |"
              echo "| ---- | ---- | ------ |"
              jq -r '.[] | "| \(.RuleID) | `\(.File):\(.StartLine)` | `\(.Commit[0:8])` |"' gitleaks.json
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then echo "::warning::gitleaks: $n finding(s) — see the run summary"; fi

  scan-python:
    name: Scan — Python advisories (pip-audit, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: pip-audit
        run: pip install pip-audit==2.10.1
      # `--no-deps --disable-pip`: the locks are fully pinned, so nothing is
      # resolved or installed — the pins themselves are looked up.
      - name: The auditor sees a known advisory (canary)
        run: |
          set -euo pipefail
          echo "django==3.2.0" > "$RUNNER_TEMP/canary.txt"
          pip-audit -r "$RUNNER_TEMP/canary.txt" --no-deps --disable-pip --progress-spinner off \
            -f json -o "$RUNNER_TEMP/canary.json" > /dev/null || true
          n=$(jq '[.dependencies[] | (.vulns // [])[]] | length' "$RUNNER_TEMP/canary.json")
          if [ "${n:-0}" -eq 0 ]; then
            echo "::error::pip-audit found no advisory for django==3.2.0 — the audit below would be blind"
            exit 1
          fi
          echo "canary seen ✓ ($n advisories)"
      - name: pip-audit — API runtime and dev locks
        run: |
          set -euo pipefail
          total=0
          echo "### pip-audit" | tee -a "$GITHUB_STEP_SUMMARY"
          for lock in apps/api/requirements.lock apps/api/requirements-dev.lock; do
            out="$RUNNER_TEMP/$(basename "$lock").json"
            # Exit 1 means "vulnerabilities found" — reported, not fatal. A
            # report that does not parse means the audit did not run.
            pip-audit -r "$lock" --no-deps --disable-pip --progress-spinner off -f json -o "$out" > /dev/null || true
            jq -e '.dependencies' "$out" > /dev/null \
              || { echo "::error::pip-audit produced no readable report for $lock"; exit 1; }
            n=$(jq '[.dependencies[] | (.vulns // [])[]] | length' "$out")
            total=$((total + n))
            {
              echo
              echo "**\`$lock\`** — $n advisory(ies)"
              if [ "$n" -gt 0 ]; then
                echo
                echo "| Package | Version | Advisory | Fixed in |"
                echo "| ------- | ------- | -------- | -------- |"
                jq -r '.dependencies[] | . as $d | (.vulns // [])[] | "| \($d.name) | \($d.version) | \(.id) | \(.fix_versions | join(", ")) |"' "$out"
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          if [ "$total" -gt 0 ]; then echo "::warning::pip-audit: $total advisory(ies) — see the run summary"; fi

  scan-node:
    name: Scan — npm advisories (npm audit, report only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Node 22's bundled npm falls back to the retired quick-audit endpoint
      # (400 "Invalid package tree", then 410); npm 11 uses /advisories/bulk.
      NPM: npm@11.21.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: The auditor sees a known advisory (canary)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/canary" && cd "$RUNNER_TEMP/canary"
          echo '{"name":"canary","version":"0.0.0","private":true,"dependencies":{"lodash":"4.17.15"}}' > package.json
          npx --yes "$NPM" install --package-lock-only --ignore-scripts --no-audit --no-fund > /dev/null
          npx --yes "$NPM" audit --json > audit.json || true
          n=$(jq '.metadata.vulnerabilities.total // 0' audit.json)
          if [ "$n" -eq 0 ]; then
            echo "::error::npm audit found no advisory for lodash@4.17.15 — the audit below would be blind"
            exit 1
          fi
          echo "canary seen ✓ ($n advisories)"
      - name: npm audit — workspace and e2e lockfiles
        run: |
          set -euo pipefail
          total=0
          echo "### npm audit" | tee -a "$GITHUB_STEP_SUMMARY"
          for dir in . tests/e2e; do
            out="$RUNNER_TEMP/npm-audit-$(echo "$dir" | tr '/.' '__').json"
            # Exit 1 means "vulnerabilities found" — reported, not fatal.
            (cd "$dir" && npx --yes "$NPM" audit --json > "$out") || true
            jq -e '.metadata.vulnerabilities' "$out" > /dev/null \
              || { echo "::error::npm audit produced no readable report for $dir/package-lock.json"; exit 1; }
            n=$(jq '.metadata.vulnerabilities.total' "$out")
            total=$((total + n))
            {
              echo
              echo "**\`$dir/package-lock.json\`** — $n package(s): $(jq -r '.metadata.vulnerabilities | "critical \(.critical), high \(.high), moderate \(.moderate), low \(.low)"' "$out")"
              if [ "$n" -gt 0 ]; then
                echo
                echo "| Package | Severity | Fix available |"
                echo "| ------- | -------- | ------------- |"
                jq -r '.vulnerabilities | to_entries[] | "| \(.key) | \(.value.severity) | \(.value.fixAvailable | if type == "object" then "\(.name)@\(.version)" else tostring end) |"' "$out"
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          if [ "$total" -gt 0 ]; then echo "::warning::npm audit: $total vulnerable package(s) — see the run summary"; fi

  latency:
    name: Latency — judge budget
    runs-on: ubuntu-latest
    # ⚠️ More than 3 minutes — a DELIBERATE exception: this job brings
    # up the full compose stack with `up -d --build --wait`, so image
    # builds are inside it. A 3-minute cap makes the job a guaranteed
    # red (measured on deploy/build). There IS a limit; unlimited is
    # not the goal.
    timeout-minutes: 15
    # Compose project is PER JOB. On one runner jobs ran in series so
    # this did not show; with a second runner two jobs sharing a stack
    # name would take each other's containers down with `down -v`.
    env:
      COMPOSE_PROJECT_NAME: rw-${{ github.job }}-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PUSH_IMAGE_CACHE: ${{ github.event.repository.fork && '0' || '1' }}
      # `docker-compose.ci.yml` jonli loyihaga qarshi ishlatilsa stack'ni
      # buzadi — fayl shu sentinelsiz yuklanmaydi (2026-09-24).
      CI_ONLY_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        # The full stack — `worker` must be alive to drain the judge queue,
        # so unlike the compatibility job this does not narrow the services.
        run: |
          bash tools/ci_stack.sh
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_demo
      - name: Judge latency — launch gate (p50 < 5 s, p95 < 15 s)
        # Open item of docs/09-development-plan/README.md § "Launch gate".
        # Own job on purpose: a gate coupled to the E2E browser matrix
        # would go red for unrelated reasons, and the failure would be
        # attributed to the wrong thing. Measured on THIS runner, which is
        # not the production machine — the number here is the regression
        # baseline; point the same harness at production with `API=` for
        # the launch-gate figure (see the harness docstring).
        timeout-minutes: 8
        # `tee` — the harness's output is needed twice: as the job log, and
        # as the source of the `LATENCY_JSON:` line the next step reads.
        # `set -o pipefail` keeps the harness's exit code, so a budget
        # breach still turns this job red; without it `tee`'s 0 would win
        # and the gate would go green while the budget was broken.
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile latency run --rm latency | tee "${RUNNER_TEMP}/latency.log"
      - name: Record the latency figure on the run page
        # Open item of docs/09-development-plan/README.md § "Launch gate" —
        # the harness prints the number into the log, where nobody reads it,
        # so the gate stayed open while the job was green. This step moves
        # the figure onto the run page (`$GITHUB_STEP_SUMMARY`), where it can
        # actually be seen and cited. See docs/research/2026-09-21-judge-latency/.
        #
        # `always()`: a RED latency job is exactly when the number matters
        # most — the figure that breached the budget is written too.
        # Exit 2 when the `LATENCY_JSON:` line is missing (harness died
        # early), so a lost measurement can never look like a pass.
        if: always()
        run: python3 tools/latency_summary.py "${RUNNER_TEMP}/latency.log"
      - name: Evaluation paths — special checker, interactive, scorer
        # The three checker types nothing else exercises end to end: every
        # listed submission of the reference problems goes through the real
        # queue, judge and checker / interactor, and its verdict and score
        # are compared (`tests/evaluation/check_evaluation_paths.py`). It
        # shares this job's stack - the same full stack, already up.
        # `always()`: a breached latency budget says nothing about whether
        # answers are graded correctly.
        if: always()
        timeout-minutes: 6
        run: |
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_reference_problems
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile evaluation run --rm evaluation
      - name: Tear down
        if: always()
        run: CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
      # `down -v` leaves the images this run built. Since 2026-09-17 CI
      # runs on the Docker Desktop engine next to the live stack, and one
      # nightly run left 18 of them behind (`rw-load-*`, `rw-e2e-*`,
      # `rw-chaos-*`) until an unrelated CI run's cleanup removed them
      # hours later. On a day without other CI they would pile up, the
      # way 420 `rw-smoke-*` images filled the WSL disk to 58 GB on
      # 2026-09-16.
      - name: Clean images
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E "^${COMPOSE_PROJECT_NAME}-" \
            | xargs -r docker rmi -f || true

  #: Judge under a burst (2026-10-23) — only when asked for by hand.
  #:
  #: "What if 1000 submissions arrive at once?" is a capacity question, not a
  #: regression check: it takes about 35 minutes of judge time and would
  #: double the Nightly's cost for nothing. It runs from a manual dispatch with
  #: `burst: true`, on this runner — not the production machine — so the
  #: figures are a floor to compare against, not a promise.
  burst:
    name: Judge burst — 1000 at once
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.burst }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      COMPOSE_PROJECT_NAME: rw-${{ github.job }}-${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_ONLY_STACK: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        run: |
          bash tools/ci_stack.sh
          CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_demo
      - name: More judges
        # Each replica is a separate process taking from the same queue.
        if: ${{ inputs.burst_judges != '1' }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            up -d --no-build --no-deps --scale judge=${{ inputs.burst_judges }} judge
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps judge
      - name: Burst
        timeout-minutes: 100
        run: |
          set -o pipefail
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile burst run --rm -e BURST="${{ inputs.burst_size }}" \
            -e BURST_CANARY="${{ inputs.burst_canary }}" burst \
            | tee "${RUNNER_TEMP}/burst.log"
      - name: Record the figures on the run page
        if: always()
        run: |
          {
            echo '### Judge burst'
            echo
            echo "Judge replicas: ${{ inputs.burst_judges }} · heavy share: ${{ inputs.burst_canary }}"
            echo
            echo '```'
            grep -vE '^BURST_JSON' "${RUNNER_TEMP}/burst.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Judge log
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail=40 judge || true
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color worker | grep -E "qotib qolgan|reap" | tail -20 || true
      - name: Tear down
        if: always()
        run: CI_ONLY_STACK=1 docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
      - name: Clean images
        if: always()
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E "^${COMPOSE_PROJECT_NAME}-" \
            | xargs -r docker rmi -f || true

  #: The suite runs in shards (2026-10-07): in one job it took 323 s and was
  #: the longest job of a warm Nightly. `tools/pytest_shard.py` deals the
  #: test FILES out; the count below, the matrix and the two calls of the
  #: script must name the same number.
  coverage:
    name: API coverage (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      # One red shard must not hide what the other two would have said.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rankwant_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432']
      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - run: pip install -r requirements-dev.lock
        working-directory: apps/api
      - name: Every test file is in exactly one shard
        run: python3 tools/pytest_shard.py --check 3
      - name: pytest --cov
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/rankwant_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/0
          CELERY_EAGER: '1'
          # Settings fail fast without it (ADR-0044); a throwaway value.
          DJANGO_SECRET_KEY: ci-django-secret
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
        # The report is printed once, over all shards, by `coverage-report`.
        run: |
          mapfile -t files < <(python3 ../../tools/pytest_shard.py ${{ matrix.shard }} 3)
          pytest -n 4 --cov --cov-report= "${files[@]}"
        working-directory: apps/api
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: apps/api/.coverage.shard-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage-report:
    name: API coverage — report
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: The same coverage the shards measured with
        run: pip install "$(grep -i '^coverage==' requirements-dev.lock)"
        working-directory: apps/api
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: apps/api
      - name: Combined report
        run: |
          coverage combine
          coverage report --show-missing
        working-directory: apps/api

  #: Readiness gate (WP1 · D8 · D8-F · ADR-0037) — `check_negative.py` ning
  #: api guruhi. U pytest'ni `rankwant-api-dev:audit` ICHIDA yuritadi, ya'ni
  #: image kerak. Per-PR `web` job buni qila olmaydi: byudjeti 3 daqiqa va
  #: image umuman yo'q — shu sabab guruh o'sha yerda ochiq skip qilinadi
  #: (ADR 0048). Yagona yuritadigan joy — shu job.
  #:
  #: ⚠️ O'z job'i ATAYLAB, `latency` bilan bir mantiq: boshqa guruhga
  #: bog'langan darvoza aloqasiz sababdan qizil bo'lardi.
  readiness:
    name: Readiness — content gates (WP1 · ADR-0037)
    runs-on: ubuntu-latest
    # ⚠️ More than 3 minutes — a DELIBERATE exception, like `load` and
    # `latency`: the api image is built here, then the dev image on top of
    # it. A 3-minute cap makes the job a guaranteed red.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: API image
        # Context `apps/api` — the same one compose uses (`x-api-build`).
        # Built here rather than through `ci_stack.sh` because the group
        # needs only the image, not a running stack.
        run: docker build -t rankwant-api:readiness apps/api
      - name: Dev image with the test dependencies
        # `tools/ci.Dockerfile` takes the repo ROOT as its context (it copies
        # `apps/api/requirements-dev.lock`) and the api image as its base.
        run: |
          docker build -f tools/ci.Dockerfile \
            --build-arg BASE=rankwant-api:readiness \
            -t rankwant-api-dev:audit .
      - name: Readiness group — WP1 · ADR-0037
        # While the group's case files are not committed the group reports an
        # explicit skip — "the group has not arrived with its PR yet" is not
        # "the environment is broken". Once the files land, a missing image or
        # a red baseline becomes a hard failure here.
        run: python3 tools/check_negative.py --group neg_refsolution_gate
      - name: Clean images
        if: always()
        run: |
          docker rmi -f rankwant-api:readiness rankwant-api-dev:audit || true
          docker builder prune -f || true
