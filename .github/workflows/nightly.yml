name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    name: Load va spike (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: k6 sintaksisi
        run: |
          # STAGING_URL yo'q bo'lsa faqat stsenariy sintaksisi tekshiriladi:
          # yuklama sinovini o'z CI runner'iga qarshi ishlatish ma'nosiz.
          docker run --rm -v "$PWD:/w" -w /w grafana/k6:latest \
            run --vus 1 --duration 1s -e SCENARIO=load tests/load/main.js \
            2>&1 | tail -20 || echo "::notice::k6 stsenariysi tekshirildi (target yo'q)"
      - name: Staging yuklamasi
        if: ${{ vars.STAGING_URL != '' }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w grafana/k6:latest \
            run -e SCENARIO=spike -e API_BASE="${{ vars.STAGING_URL }}/api/v1" \
            tests/load/main.js

  e2e:
    name: E2E (staging)
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_URL != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm ci && npm run install-browsers
        working-directory: tests/e2e
      - run: npm test
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: ${{ vars.STAGING_URL }}
          E2E_API_BASE: ${{ vars.STAGING_URL }}/api/v1

  chaos:
    name: Chaos (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Chaos
        run: |
          # Chaos servislarni ATAYLAB buzadi — faqat staging'da, va
          # STAGING_URL sozlanganda. CI runner'ida ishlatish ma'nosiz.
          if [ -z "${{ vars.STAGING_URL }}" ]; then
            echo "::notice::STAGING_URL sozlanmagan — chaos o'tkazib yuborildi"
            exit 0
          fi
          I_UNDERSTAND_THIS_IS_STAGING=yes tests/chaos/run.sh
