name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    name: Load — o'qish sig'imi
    runs-on: [self-hosted, rankwant]
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        if: ${{ vars.STAGING_URL == '' }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_demo
      - name: k6 — chegaralangan yuklama
        if: ${{ vars.STAGING_URL == '' }}
        # `--vus 1 --duration 1s` sintaksis tekshiruvi edi. `ci` ssenariysi
        # runner'ni yiqitmaydigan, lekin haqiqiy raqam beradigan o'lchov.
        # CI stack'ida anon throttle ko'tarilgan — aks holda o'lchov
        # sig'imni emas, rate limitni ko'rsatadi (94% 429 bo'lgan edi).
        run: |
          docker run --rm --network rankwant-ci_default -v "$PWD:/w" -w /w \
            -e SCENARIO=ci -e API_BASE=http://api:8000/api/v1 \
            grafana/k6:latest run tests/load/main.js
      - name: Staging yuklamasi
        if: ${{ vars.STAGING_URL != '' }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w grafana/k6:latest \
            run -e SCENARIO=spike -e API_BASE="${{ vars.STAGING_URL }}/api/v1" \
            tests/load/main.js
      - name: Tozalash
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  e2e:
    name: E2E — to'liq brauzer matritsasi
    runs-on: [self-hosted, rankwant]
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        # STAGING_URL sozlangan bo'lsa unga qarshi, aks holda o'z stack'iga.
        if: ${{ vars.STAGING_URL == '' }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_demo
      - name: Chromium, Firefox, WebKit va mobil
        run: |
          docker run --rm --network rankwant-ci_default \
            -v "$PWD/tests/e2e:/e2e" -w /e2e \
            -e E2E_BASE_URL="${{ vars.STAGING_URL || 'http://web:3000' }}" \
            -e E2E_API_BASE="${{ vars.STAGING_URL && format('{0}/api/v1', vars.STAGING_URL) || 'http://api:8000/api/v1' }}" \
            -e CI=1 \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            sh -c 'npm ci --silent && npx playwright test --reporter=list'
      - name: Tozalash
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  chaos:
    name: Chaos — bog'liqlik uzilishi
    runs-on: [self-hosted, rankwant]
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
          docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api \
            python manage.py seed_demo
      - name: Chaos
        # Chaos servislarni ATAYLAB buzadi. Runner'ning o'z stack'i —
        # buziladigan boshqa narsa yo'q, shuning uchun staging shart emas.
        env:
          COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
          I_UNDERSTAND_THIS_IS_STAGING: 'yes'
        run: tests/chaos/run.sh
      - name: Tozalash
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  compatibility:
    name: Til matritsasi
    runs-on: [self-hosted, rankwant]
    steps:
      - uses: actions/checkout@v7
      - name: Judge image
        run: docker build -t rankwant/judge-go:ci services/judge-go
      - name: E'lon qilingan versiyalar image bilan mos
        # Har til o'z runtime versiyasini chop etadi. Bu tekshiruv
        # "Python 3.12" deb ko'rsatib 3.11 ishlatish holatini ushlaydi —
        # bunday nomuvofiqlik foydalanuvchiga tushunarsiz SyntaxError
        # bo'lib ko'rinadi.
        run: python3 tests/compatibility/check_languages.py rankwant/judge-go:ci
