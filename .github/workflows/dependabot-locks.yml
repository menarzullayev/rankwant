name: Dependabot locks

# Dependabot edits `apps/api/requirements*.txt` but cannot write the files
# the image is built from: `requirements.lock` and `requirements-dev.lock`
# are compiled by `uv pip compile`, a format it does not know. Such a pull
# request passes CI and changes nothing at runtime — Docker still installs
# the old versions (measured 2026-09-28, eight pull requests). This workflow
# recompiles the locks on the pull request's own branch.
#
# Two jobs, on purpose:
#   compile  resolves packages. It holds no write token and hands its result
#            over as an artifact. It runs no code of the pull request: the
#            checkout is `main`, the pull request's dependency files are
#            copied in as data, and `uv` installs wheels only (`--no-build`)
#            — a source distribution would run that package's code.
#   commit   has `contents: write`, runs no package code, and only copies
#            the generated files in and pushes.
#
# `pull_request_target`, not `pull_request`: a Dependabot run of the latter
# gets a read-only token. The workflow file itself is always the one on
# `main`. ⚠️ Under `pull_request_target` every job also holds `main`'s
# Actions cache scope: code run here could write a cache that `main` CI
# later restores (CodeQL `actions/cache-poisoning/poisonable-step`, alert 26,
# 2026-11-26). Hence "no code of the pull request" above — a write-free
# token is not enough on its own.
#
# A push made with the workflow token starts no CI run, so the last step
# starts one itself (`ci.yml` has `workflow_dispatch`). Its checks land on
# the new commit, which is where the branch rules look.
#
# npm and Go pull requests too (2026-11-10, audit Q-08). Dependabot writes
# `package-lock.json` / `go.mod` itself, but not the licence inventory, and
# `licence_inventory.py --check` in CI compares package names with those
# files. A bump that adds or drops one package therefore left the pull
# request red until someone ran the generator by hand (#474: BLOCKED on
# "Litsenziya inventari lockfile'lardan chetlashgan"). For those pull
# requests only the inventory is regenerated; the API locks are compiled
# only when an API requirement file changed, so an npm bump never drags
# Python pins along.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - apps/api/requirements.txt
      - apps/api/requirements-dev.txt
      # Every file `tools/licence_inventory.py` reads a package list from.
      - package.json
      - package-lock.json
      - apps/web/package.json
      - packages/*/package.json
      - tests/e2e/package.json
      - tests/e2e/package-lock.json
      - services/judge-go/go.mod
  # For a pull request opened before this workflow existed.
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of a Dependabot pull request"
        required: true
        type: number

permissions: {}

env:
  # Every file this workflow writes; nothing else is committed.
  GENERATED: >-
    apps/api/requirements.lock
    apps/api/requirements-dev.lock
    docs/research/2026-09-21-licence-inventory/README.md
    docs/research/2026-09-21-licence-inventory/packages.tsv

concurrency:
  group: dependabot-locks-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile locks
    # A human PR that touches a package list (e.g. apps/web/package.json) also
    # fires `pull_request_target`; it is skipped here instead of failing the
    # guard step below (measured on #488, 2026-11-10). The guard stays as the
    # second line of defence.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      changed: ${{ steps.diff.outputs.changed }}
      pip: ${{ steps.pr.outputs.pip }}
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}" > pr.json
          author="$(jq -r .user.login pr.json)"
          repo="$(jq -r .head.repo.full_name pr.json)"
          # Only Dependabot's own branches in this repository: the next job
          # pushes to the branch named here.
          if [ "$author" != "dependabot[bot]" ] || [ "$repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::#${NUMBER} is not a Dependabot pull request of this repository (${author}, ${repo})"
            exit 1
          fi
          echo "branch=$(jq -r .head.ref pr.json)" >> "$GITHUB_OUTPUT"
          # Which ecosystem: the API locks are recompiled only for a pip
          # bump. Recompiling them on an npm one could move Python pins that
          # pull request never asked to touch.
          if gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/files" --jq '.[].filename' \
              | grep -qxE 'apps/api/requirements(-dev)?\.txt'; then
            echo "pip=true" >> "$GITHUB_OUTPUT"
          else
            echo "pip=false" >> "$GITHUB_OUTPUT"
          fi
      # `main`, not the pull request's branch: every script below runs from
      # this checkout. The branch is read only as data, in the next step.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The files the steps below READ, at the pull request's version: the
      # requirement files `uv pip compile` resolves, judge-py's project file
      # for `uv export`, and every file the inventory reads or rewrites —
      # listed by the script itself, so the two lists cannot drift. A file
      # missing on the branch fails the job: a stale branch would otherwise
      # be described with `main`'s files.
      - name: Take the pull request's dependency files (data only)
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${BRANCH}"
          mapfile -t INVENTORY < <(python3 tools/licence_inventory.py --inputs)
          git checkout FETCH_HEAD -- apps/api/requirements.txt apps/api/requirements-dev.txt \
            services/judge-py/pyproject.toml "${INVENTORY[@]}"
          git status --short
      # No cache: a cache saved here would land in `main`'s scope.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false
      # `--no-build` on every `uv pip` line: a package without a wheel stops
      # the job with an error instead of running its build code. Measured
      # 2026-11-26: every package of both locks has a Linux wheel for 3.14.
      - name: uv pip compile
        if: steps.pr.outputs.pip == 'true'
        working-directory: apps/api
        run: |
          set -euo pipefail
          uv pip compile requirements.txt -o requirements.lock --python-version 3.14 --no-build --quiet
          uv pip compile requirements-dev.txt -o requirements-dev.lock --python-version 3.14 --no-build --quiet
      # A bump can pull in a package the inventory has never seen, and
      # `licence_inventory.py --check` then fails CI on the pull request.
      # The inventory reads Python licences from installed metadata, so the
      # dev lock (a superset of the runtime one) is installed into a scratch
      # environment first — on an npm pull request too: without it every
      # Python row would be rewritten as UNKNOWN. Node and Go licences come
      # straight from the lockfiles, so nothing of theirs is installed.
      #
      # The judge-py lock is installed too, every package of it, whatever
      # its environment marker says. The inventory lists that lock by name,
      # and a package this runner would skip had no metadata to read:
      # `colorama` (`sys_platform == 'win32'`, a pytest dependency) was
      # rewritten as UNKNOWN by every npm pull request (measured on #586,
      # 2026-11-13). `--no-deps`: the lock already names everything, and the
      # versions must not move the API packages installed just above.
      #
      # ⚠️ No `if:` here, on purpose: this step is the whole point for an
      # npm or Go pull request (`tools/check_decisions.py` guards it).
      - name: Regenerate the licence inventory
        run: |
          set -euo pipefail
          uv venv .licence-venv --python 3.14 --quiet
          uv pip install --no-build -r apps/api/requirements-dev.lock --python .licence-venv --quiet
          (cd services/judge-py && uv export --frozen --all-extras --no-emit-project --no-hashes --quiet) \
            | sed -E 's/[[:space:]]*;.*$//' | grep -E '^[A-Za-z0-9]' > "$RUNNER_TEMP/judge-py-packages.txt"
          uv pip install --no-build --no-deps -r "$RUNNER_TEMP/judge-py-packages.txt" --python .licence-venv --quiet
          python3 tools/licence_inventory.py --venv .licence-venv
      - name: Did anything change?
        id: diff
        run: |
          read -r -a FILES <<< "$FILES"
          if git diff --quiet -- "${FILES[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Locks and inventory already match the requirement files." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- "${FILES[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
        env:
          FILES: ${{ env.GENERATED }}
      - uses: actions/upload-artifact@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          name: locks
          path: |
            apps/api/requirements.lock
            apps/api/requirements-dev.lock
            docs/research/2026-09-21-licence-inventory/README.md
            docs/research/2026-09-21-licence-inventory/packages.tsv
          retention-days: 1

  commit:
    name: Commit locks
    needs: compile
    if: needs.compile.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.compile.outputs.branch }}
      - uses: actions/download-artifact@v8
        with:
          name: locks
          # The artifact keeps paths from the files' common root — the
          # repository root.
          path: .
      - name: Commit and push
        env:
          BRANCH: ${{ needs.compile.outputs.branch }}
          PIP: ${{ needs.compile.outputs.pip }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          read -r -a FILES <<< "$GENERATED"
          git add -- "${FILES[@]}"
          if [ "$PIP" = "true" ]; then
            subject="chore(deps): recompile the API locks"
          else
            subject="chore(deps): regenerate the licence inventory"
          fi
          # `[dependabot skip]`: without it Dependabot treats the branch as
          # edited by someone else and stops rebasing it; with it, it
          # force-pushes over this commit and this workflow runs again.
          git commit -m "$subject" -m "[dependabot skip]"
          git push origin "HEAD:${BRANCH}"
      - name: Start CI on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.compile.outputs.branch }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # The push does create the pull request's own CI run, but GitHub
          # parks it as `action_required` because a bot pushed it, and the
          # branch rules wait for exactly that run (measured 2026-10-05: a
          # green dispatched run left the pull request BLOCKED). Approve it.
          run_id=""
          for _ in $(seq 1 12); do
            run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&event=pull_request" \
              --jq '[.workflow_runs[] | select(.conclusion == "action_required")][0].id // empty')"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -n "$run_id" ] && gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" > /dev/null; then
            echo "Approved the pull request's CI run ${run_id}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fallback: the checks of a dispatched run land on the commit and
          # show whether it is sound, but the pull request still needs a
          # person to press "Approve and run".
          gh workflow run ci.yml --ref "$BRANCH" -f run_all=true
          echo "Could not approve the pull request's CI run; started a manual one. Press **Approve and run** on the pull request." >> "$GITHUB_STEP_SUMMARY"
