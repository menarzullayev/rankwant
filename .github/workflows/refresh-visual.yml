name: Refresh Visual Baselines

on:
  workflow_dispatch:
  push:
    branches: [fix/visual-baseline-push-trigger]

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate visual snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: rw-visual-refresh
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CI_PUSH_IMAGE_CACHE: '0'
      E2E_BASE_URL: http://web:3000
      E2E_API_BASE: http://api:8000/api/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Stack
        run: bash tools/ci_stack.sh

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: E2E deps
        run: cd tests/e2e && npm ci

      - name: Regenerate snapshots
        run: |
          bash tools/ci_playwright.sh -- \
            npx playwright test --project=visual --update-snapshots --reporter=list

      - name: Upload new snapshots
        uses: actions/upload-artifact@v7
        with:
          name: new-visual-snapshots
          path: tests/e2e/visual/visual.spec.ts-snapshots/
          if-no-files-found: error
          retention-days: 7
