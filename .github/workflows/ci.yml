name: CI

on:
  pull_request:
  push:
    branches: [main]
  # `deploy.yml` calls this suite with `uses: ./.github/workflows/ci.yml`.
  # That makes a passing test run a hard requirement for deploy, without
  # keeping a second copy of the checks: the rules change in one place.
  # `pull_request` and `push` STAY HERE — a reusable workflow keeps its
  # own triggers; `workflow_call` is extra.
  workflow_call:
  # Manual full run. Path filters correctly skip most jobs on a normal
  # push, but that does not answer "does everything work together?".
  # `run_all` is for that question.
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run every job (ignore path filters)"
        type: boolean
        default: true

# The self-hosted runner runs as user `nsn` on the development machine
# and can see Python packages in `~/.local/lib/.../site-packages`.
# Stray packages there (for example `dash`) register pytest plugins
# and pytest loads them automatically. The job must use only its own
# environment.
env:
  PYTHONNOUSERSITE: '1'

concurrency:
  # `cancel-in-progress` ONLY on `pull_request` and `push`. Cancelling
  # when deploy calls this (`workflow_call`) is DANGEROUS: deploy waits
  # for the `test` job, a cancelled job returns `failure`/`cancelled`,
  # and the gated deploy job never starts — rapid successive pushes
  # would silently skip deploy. A called run also uses a different
  # group, so there is no collision.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read
  # `dorny/paths-filter` reads changed files from the GitHub API; without
  # this it fails with "Resource not accessible by integration" and the
  # whole CI stops here.
  pull-requests: read

jobs:
  # Path filter and docs checks share one job: both finish in a few
  # seconds, and GitHub bills each job rounded up to a minute — as
  # separate jobs they burned ~86 minutes a month.
  changes:
    name: Changes and docs integrity
    runs-on: [self-hosted, rankwant]
    timeout-minutes: 2
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      judge: ${{ steps.filter.outputs.judge }}
      code: ${{ steps.filter.outputs.code }}
      tools: ${{ steps.filter.outputs.tools }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:   ['apps/api/**']
            web:   ['apps/web/**']
            judge: ['services/**']
            code:  ['apps/**', 'services/**', 'tools/**', 'tests/**', 'docker-compose*.yml']
            # When the checks themselves change, the job that runs them
            # must start. `code` is too wide for that: it also matches
            # `apps/api/**`, so an API change would wake the web job
            # for nothing. `.githooks/**` is here too —
            # `neg_hook_gates_new_branch` in `check_negative.py` tests
            # the pre-push hook.
            tools: ['tools/**', '.githooks/**']
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Links, tables, writing, and STATUS
        run: python3 tools/check_docs.py
      - name: Confusable letters in identifiers (Cyrillic/Greek ↔ Latin)
        run: python3 tools/check_confusables.py
      - name: Judge contract (protocol.md ↔ Go ↔ Python)
        run: python3 tools/check_contract.py
      - name: DRF `ordering` tiebreaker (unstable pagination)
        run: python3 tools/check_ordering.py
      - name: Owner decisions in code (CLAUDE.md § Saidakbar aka qarorlari)
        run: python3 tools/check_decisions.py
      - name: .env.example completeness (variables read by code and compose)
        run: python3 tools/check_env_example.py

  api:
    name: API — lint, types, tests
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, rankwant]
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rankwant_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        # GitHub picks the host port: on the self-hosted runner 5432 is
        # already taken by the live preview stack.
        ports: ['5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379']
    steps:
      - uses: actions/checkout@v7
      - name: Scaffolded?
        id: check
        run: |
          if [ -f apps/api/requirements-dev.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api is not scaffolded yet (Sprint 1) — skipped"
          fi
      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'true'
        # `cache:` is OMITTED ON PURPOSE. The runner is self-hosted:
        # `~/.npm` (1.5 GB) and the pip cache live on the machine between
        # jobs. `cache:` re-downloads them from GitHub storage — measured:
        # a 440 MB npm-cache archive at ~2 MB/s took 127 seconds while
        # the local copy was already sitting there.
        with:
          python-version: '3.12'
      - if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements-dev.lock
        working-directory: apps/api
      - name: Ruff
        if: steps.check.outputs.ready == 'true'
        run: ruff check . && ruff format --check .
        working-directory: apps/api
      - name: mypy (strict)
        if: steps.check.outputs.ready == 'true'
        # `--show-traceback`: on 2026-09-12 this step failed with
        # `INTERNAL ERROR — Error constructing plugin instance of
        # NewSemanalDjangoPlugin`, but the one-line message hid the
        # cause. The same code passes on 280 files in the `rankwant-api`
        # image (same requirements), so the problem is the runner
        # environment — the traceback shows it. This flag can go once
        # the cause is known.
        run: mypy --show-traceback .
        working-directory: apps/api
      - name: Detect service host
        id: svc
        # Service-container ports are published on the Docker HOST, not
        # where the runner process lives. If the runner is inside a
        # container, its `localhost` is itself and the connection FAILS.
        #
        # Measured (2026-09-17, one-off test containers):
        #   sibling container → localhost:<port>              -> FAIL
        #   sibling container → host.docker.internal:<port>   -> OK
        #   default gateway 172.17.0.1                        -> FAIL
        #
        # On a WSL runner (not a container) `localhost` is correct, so
        # this step is backward-compatible: the value does not change
        # if the environment does not.
        run: |
          if [ -f /.dockerenv ]; then
            echo "host=host.docker.internal" >> "$GITHUB_OUTPUT"
          else
            echo "host=localhost" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrations fully written
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@${{ steps.svc.outputs.host }}:${{ job.services.postgres.ports['5432'] }}/rankwant_test
        run: python manage.py makemigrations --check --dry-run
        working-directory: apps/api
      - name: pytest
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@${{ steps.svc.outputs.host }}:${{ job.services.postgres.ports['5432'] }}/rankwant_test
          REDIS_URL: redis://${{ steps.svc.outputs.host }}:${{ job.services.redis.ports['6379'] }}/0
          # `CELERY_EAGER=1` — tasks run synchronously, broker skipped.
          # That does NOT mean the Redis SERVICE is unused: `CACHES` and
          # throttle still use Redis. The reason is DETERMINISM: through
          # the broker a task is queued and the test does not wait, so
          # the result depends on scheduling order. Local measurement:
          # 14m54s → 1m57s.
          CELERY_EAGER: '1'
        # `-n 6`: measured (8 CPUs) — -n 4: 102 s, -n 6: 88 s,
        # -n 8: 92 s. 6 is the fastest point; at 8 the workers crowd
        # each other. Not `auto`: the runner shares this machine with
        # the live preview.
        run: pytest -n 6 --cov --cov-report=term-missing
        working-directory: apps/api

  # ⚠️ Besides building web, this job also runs the CHECK SUITE
  # (`check_i18n`, `check_i18n_runtime`, `check_negative`, `check_contrast`).
  # They live here because `check_i18n_runtime.mjs` loads `typescript`
  # from `apps/web/node_modules` — so the suite needs the `npm ci`
  # below. Moving them to another job would repeat that install.
  #
  # ⚠️ So the gate is NOT tied to the `web` filter alone. It used to
  # be, and the result was measured (2026-09-15): PRs that only
  # changed `tools/` — including #13 rewriting `check_negative.py`
  # and #14 adding a new group — left this job `skipped`. The suite
  # that tests the checks did not run when those checks changed.
  web:
    name: Web — lint, types, build, and check suite
    needs: changes
    if: >-
      ${{ needs.changes.outputs.web == 'true'
          || needs.changes.outputs.tools == 'true'
          || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, rankwant]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Scaffolded?
        id: check
        run: |
          if [ -f apps/web/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web is not scaffolded yet (Sprint 1) — skipped"
          fi
      - uses: actions/setup-node@v7
        if: steps.check.outputs.ready == 'true'
        # `cache:` is OMITTED ON PURPOSE. The runner is self-hosted:
        # `~/.npm` (1.5 GB) and the pip cache live on the machine between
        # jobs. `cache:` re-downloads them from GitHub storage — measured:
        # a 440 MB npm-cache archive at ~2 MB/s took 127 seconds while
        # the local copy was already sitting there.
        with:
          node-version: '22'
      # `npm ci` also runs when only `tools/` changed, ON PURPOSE:
      # `check_i18n_runtime.mjs` loads `typescript` from
      # `apps/web/node_modules` (`createRequire`). Without it,
      # `node_precondition()` in `check_negative.py` stops the WHOLE
      # suite with "Cannot find module 'typescript'" before any test
      # runs.
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
        working-directory: apps/web
      # Lint / typecheck / build ONLY when web changed. On a tools-only
      # run they would check nothing new — the job is still needed
      # because the check suite is below.
      - if: ${{ steps.check.outputs.ready == 'true' && needs.changes.outputs.web == 'true' }}
        run: npm run lint
        working-directory: apps/web
      - if: ${{ steps.check.outputs.ready == 'true' && needs.changes.outputs.web == 'true' }}
        run: npm run typecheck
        working-directory: apps/web
      - name: Unit tests (Vitest)
        if: ${{ steps.check.outputs.ready == 'true' && needs.changes.outputs.web == 'true' }}
        run: npm run test
        working-directory: apps/web
      # Types catch a missing key, but not an empty string or a copy
      # left untranslated.
      - name: i18n completeness
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_i18n.py
      # Fallback path of `t()`: throws in dev, logs once in prod.
      # `check_i18n.py` cannot see that — it only reads the strings —
      # so the module is run in Node (this step has `actions/setup-node`).
      - name: i18n runtime (dev throw / prod log)
        if: steps.check.outputs.ready == 'true'
        run: node tools/check_i18n_runtime.mjs
      # Tests the checks themselves — each is given a deliberately
      # broken state and must `exit 1`.
      #
      # `NODE` precondition: `check_negative.py` also runs Node checks,
      # and `node` can appear under different names on PATH.
      - name: Negative tests
        if: steps.check.outputs.ready == 'true'
        env:
          NODE: node
        run: python3 tools/check_negative.py
      - name: Text contrast (WCAG AA)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_contrast.py
      - if: ${{ steps.check.outputs.ready == 'true' && needs.changes.outputs.web == 'true' }}
        run: npm run build
        working-directory: apps/web

  judge:
    name: Judge — bake-off candidates
    needs: changes
    if: ${{ needs.changes.outputs.judge == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, rankwant]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Go — vet, format, build, test
        run: |
          if [ ! -f services/judge-go/go.mod ]; then
            echo "judge-go is not scaffolded yet — skipped"
            exit 0
          fi
          cd services/judge-go
          test -z "$(gofmt -l .)" || { echo "::error::gofmt: $(gofmt -l .)"; exit 1; }
          go vet ./...
          go build ./...
          go test ./...
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python judge — lint, types, test
        run: |
          if [ ! -f services/judge-py/pyproject.toml ]; then
            echo "judge-py is not scaffolded yet — skipped"
            exit 0
          fi
          cd services/judge-py
          pip install -e '.[dev]'
          ruff check .
          ruff format --check .
          mypy .
          pytest

  openapi:
    name: OpenAPI schema diff
    # `api` was dropped ON PURPOSE: this job only looks at the `changes`
    # filter, not at the RESULT of the API tests. With
    # `needs: [changes, api]` it waited for API to finish (measured:
    # 2.7 min) and stretched wall time on a single runner by that much.
    # It now sits alongside API.
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, rankwant]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate schema and diff
        run: |
          if [ ! -f apps/api/manage.py ]; then
            echo "::notice::apps/api is not scaffolded yet — schema diff skipped"
            exit 0
          fi
          cd apps/api
          pip install -r requirements-dev.lock
          python manage.py spectacular --file /tmp/schema.yml
          diff -u openapi/schema.yml /tmp/schema.yml || {
            echo "::error::OpenAPI schema changed. Update it:"
            echo "::error::  cd apps/api && python manage.py spectacular --file openapi/schema.yml"
            exit 1
          }

  smoke:
    name: Smoke and E2E — full stack
    runs-on: [self-hosted, rankwant]
    # ⚠️ 20 minutes — a DELIBERATE exception. This job BUILDS the full
    # compose stack (api+web+judge images), loads demo data, runs smoke,
    # and runs Playwright E2E. At 3 minutes it was simply `cancelled`
    # (run 34902927949) — a guaranteed red. Each step also has its own
    # limit so a slow stage is visible.
    timeout-minutes: 20
    needs: changes
    # Not on PR (2026-09-18): smoke spends ~2 minutes building the stack
    # and holds the queue. Main push, `workflow_dispatch`, and deploy
    # `workflow_call` keep the full path. The `!= pull_request` line is
    # a decision — removing it fails `tools/check_decisions.py`.
    if: >-
      ${{ (needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch')
          && github.event_name != 'pull_request' }}
    # Compose project is PER JOB. With a second runner, two jobs sharing
    # a stack name would take each other's containers down with `down -v`.
    env:
      COMPOSE_PROJECT_NAME: rw-${{ github.job }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        timeout-minutes: 10
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
      - name: Demo data
        timeout-minutes: 3
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api python manage.py seed_demo
      - name: Smoke
        timeout-minutes: 5
        # Critical path: submit → Redis → judge → verdict. This is the
        # only step that runs API and judge TOGETHER — when they are
        # tested separately, a contract mismatch stays hidden.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm smoke
      - name: Bake-off — validator cases (real nsjail)
        timeout-minutes: 3
        # ADR-0020's most important protection: a bad input is rejected
        # BEFORE a submission runs. Only a real sandbox can confirm that
        # — unit tests replace `sandboxed` with a fake executor, so
        # nsjail, compilation, and the exit code are invisible to them.
        # Measured: with the protection removed, case 19 returns `AC`
        # instead of `WRONG_TEST`.
        #
        # In this job because the stack (with the judge image) is
        # already built: the step adds a few seconds. A separate job
        # would have to rebuild nsjail from source.
        #
        # Full suite (21 cases), not only the three validator ones:
        # measured 2026-09-16 — all in 11.2 s (p50 33 ms, p95 1742 ms).
        # The guess that "the rest are much slower" was WRONG, so fork
        # bomb, network, `/proc`, symlink, and file-write isolation
        # also go through this gate.
        #
        # ⚠️ `worker` and `beat` are stopped: `drain_results` would
        # consume results from the queue BEFORE the harness and the
        # report would say it failed security — even though the
        # sandbox is fine (CLAUDE.md § Bake-off).
        run: |
          C="docker compose -f docker-compose.yml -f docker-compose.ci.yml"
          $C stop worker beat
          set +e
          $C --profile bakeoff run --rm bakeoff
          status=$?
          set -e
          $C start worker beat
          exit $status
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Language matrix — declared version matches the image
        timeout-minutes: 2
        # If the platform says "Python 3.13" but the judge runs 3.11,
        # the user gets a confusing `SyntaxError` and blames THEIR
        # code. The only way to know is to run a program that prints
        # each language's version, which needs the judge IMAGE — so
        # this step is in this job, after the stack is up.
        #
        # The check itself sat DEAD for a long time: after a sixth
        # column was added to the seed row it raised `ValueError`
        # without checking anything, and no gate called it
        # (2026-09-16).
        run: python3 tests/compatibility/check_languages.py "${COMPOSE_PROJECT_NAME}-judge"
      - name: E2E (chromium only — full matrix is nightly)
        timeout-minutes: 10
        # `HOST_REPO_ROOT` — the bind-mount source is resolved on the
        # DAEMON side, NOT by the runner process. If the runner is
        # inside a container, `$PWD` (e.g. /home/runner/_work/...) is
        # a path the daemon does not have, so the mount comes up EMPTY.
        #
        # Measured (2026-09-17): Windows path (`C:/Users/...`) -> OK,
        # Linux-style path -> empty directory inside the VM.
        #
        # The variable is set ONLY on the container runner. On a WSL
        # runner it is empty and `${VAR:-$PWD}` keeps current behavior.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "${HOST_REPO_ROOT:-$PWD}/tests/e2e:/e2e" -w /e2e \
            -e E2E_BASE_URL=http://web:3000 -e E2E_API_BASE=http://api:8000/api/v1 -e CI=1 \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            sh -c 'npm ci --silent && npx playwright test --project=chromium --reporter=list'
      - name: Logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 60
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
      # ⚠️ `down -v` removes containers and volumes, but LEAVES THE
      # BUILT IMAGES — that was the hole.
      #
      # Measured 2026-09-16: 420 `rw-smoke-*` + 122 `rankwant-build-*`
      # piled up and filled the runner's WSL disk (58 GB) — C: had
      # 9.59 GB left and the machine slowed down.
      #
      # Two things are removed:
      #   1. images this run built (`${COMPOSE_PROJECT_NAME}-*`)
      #   2. leftovers from broken/half-finished runs, `rw-*` older
      #      than 6 hours
      #
      # Base images (postgres, redis, minio, playwright) are NOT
      # touched: they are reused every run; deleting them re-pulls.
      - name: Clean images
        if: always()
        run: |
          set -u
          echo "--> images from this run (${COMPOSE_PROJECT_NAME}-*)"
          docker images --format '{{.Repository}}:{{.Tag}}' \
            | grep -E "^${COMPOSE_PROJECT_NAME}-" \
            | xargs -r docker rmi -f || true
          echo "--> leftovers older than 6 hours (rw-*, rankwant-build-*)"
          docker images --format '{{.ID}}|{{.CreatedSince}}|{{.Repository}}' \
            | awk -F'|' '$3 ~ /^rw-/ && $2 ~ /hours|days|weeks|months/ {print $1}' \
            | sort -u | xargs -r docker rmi -f || true
          echo "--> build cache (older than 7 days)"
          # ⚠️ COMPROMISE: Docker does not split the build cache BY
          # PROJECT — `docker builder prune` hits the whole engine.
          # On one engine (2026-09-17 decision) that means the live
          # stack's cache is a candidate too.
          #
          # 24 hours -> 7 days: the live deploy cache is usually
          # reused within a week, so in practice it is left alone;
          # CI leftovers stay bounded. This is NOT a complete fix —
          # the right fix is a daemon-level cache-size cap. Open.
          docker builder prune -f --filter 'until=168h' || true
