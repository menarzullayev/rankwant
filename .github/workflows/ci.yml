name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      judge: ${{ steps.filter.outputs.judge }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:   ['apps/api/**']
            web:   ['apps/web/**']
            judge: ['services/**']

  docs:
    name: Hujjat yaxlitligi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Havola, jadval, yozuv va STATUS tekshiruvi
        run: python3 tools/check_docs.py
      - name: Judge shartnomasi (protocol.md ↔ Go ↔ Python)
        run: python3 tools/check_contract.py

  api:
    name: API — lint, types, tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rankwant_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v7
      - name: Scaffold qilinganmi?
        id: check
        run: |
          if [ -f apps/api/requirements-dev.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api hali scaffold qilinmagan (Sprint 1) — o'tkazib yuborildi"
          fi
      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements-dev.txt
        working-directory: apps/api
      - name: Ruff
        if: steps.check.outputs.ready == 'true'
        run: ruff check . && ruff format --check .
        working-directory: apps/api
      - name: mypy (strict)
        if: steps.check.outputs.ready == 'true'
        run: mypy .
        working-directory: apps/api
      - name: Migratsiyalar to'liq yozilganmi
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rankwant_test
        run: python manage.py makemigrations --check --dry-run
        working-directory: apps/api
      - name: pytest
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rankwant_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov --cov-report=term-missing
        working-directory: apps/api

  web:
    name: Web — lint, types, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scaffold qilinganmi?
        id: check
        run: |
          if [ -f apps/web/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web hali scaffold qilinmagan (Sprint 1) — o'tkazib yuborildi"
          fi
      - uses: actions/setup-node@v7
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
        working-directory: apps/web
      - if: steps.check.outputs.ready == 'true'
        run: npm run lint
        working-directory: apps/web
      - if: steps.check.outputs.ready == 'true'
        run: npm run typecheck
        working-directory: apps/web
      - if: steps.check.outputs.ready == 'true'
        run: npm run build
        working-directory: apps/web

  judge:
    name: Judge — bake-off nomzodlari
    needs: changes
    if: needs.changes.outputs.judge == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Go — vet, format, build, test
        run: |
          if [ ! -f services/judge-go/go.mod ]; then
            echo "judge-go hali scaffold qilinmagan — o'tkazib yuborildi"
            exit 0
          fi
          cd services/judge-go
          test -z "$(gofmt -l .)" || { echo "::error::gofmt: $(gofmt -l .)"; exit 1; }
          go vet ./...
          go build ./...
          go test ./...
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python judge — lint, types, test
        run: |
          if [ ! -f services/judge-py/pyproject.toml ]; then
            echo "judge-py hali scaffold qilinmagan — o'tkazib yuborildi"
            exit 0
          fi
          cd services/judge-py
          pip install -e '.[dev]'
          ruff check .
          ruff format --check .
          mypy .
          pytest

  openapi:
    name: OpenAPI schema diff
    needs: [changes, api]
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Schema generatsiya va diff
        run: |
          if [ ! -f apps/api/manage.py ]; then
            echo "::notice::apps/api hali scaffold qilinmagan — schema diff o'tkazib yuborildi"
            exit 0
          fi
          cd apps/api
          pip install -r requirements-dev.txt
          python manage.py spectacular --file /tmp/schema.yml
          diff -u openapi/schema.yml /tmp/schema.yml || {
            echo "::error::OpenAPI schema o'zgardi. Yangilang:"
            echo "::error::  cd apps/api && python manage.py spectacular --file openapi/schema.yml"
            exit 1
          }

  smoke:
    name: Smoke — to'liq stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
      - name: Demo ma'lumot
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api python manage.py seed_demo
      - name: Smoke
        # Kritik yo'l: submit → Redis → judge → verdict. Bu qadam API va
        # judge'ni BIRGA ishlatadigan yagona joy — ular alohida sinalganda
        # ikkita shartnoma nomuvofiqligi ko'rinmay qolgan edi.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm smoke
      - name: Loglar (yiqilganda)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 60
      - name: Tozalash
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
