name: CI

on:
  pull_request:
  push:
    branches: [main]
  # `deploy.yml` calls this suite with `uses: ./.github/workflows/ci.yml`.
  # That makes a passing test run a hard requirement for deploy, without
  # keeping a second copy of the checks: the rules change in one place.
  # `pull_request` and `push` STAY HERE — a reusable workflow keeps its
  # own triggers; `workflow_call` is extra.
  workflow_call:
  # Manual full run. Path filters correctly skip most jobs on a normal
  # push, but that does not answer "does everything work together?".
  # `run_all` is for that question.
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run every job (ignore path filters)"
        type: boolean
        default: true

# The self-hosted runner runs as user `nsn` on the development machine
# and can see Python packages in `~/.local/lib/.../site-packages`.
# Stray packages there (for example `dash`) register pytest plugins
# and pytest loads them automatically. The job must use only its own
# environment.
env:
  PYTHONNOUSERSITE: '1'

concurrency:
  # `cancel-in-progress` ONLY on `pull_request` and `push`. Cancelling
  # when deploy calls this (`workflow_call`) is DANGEROUS: deploy waits
  # for the `test` job, a cancelled job returns `failure`/`cancelled`,
  # and the gated deploy job never starts — rapid successive pushes
  # would silently skip deploy. A called run also uses a different
  # group, so there is no collision.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read
  # `dorny/paths-filter` reads changed files from the GitHub API; without
  # this it fails with "Resource not accessible by integration" and the
  # whole CI stops here.
  pull-requests: read

jobs:
  # Filter is ONLY path outputs. Docs/contract checks used to sit in this
  # job, so three PRs each held a runner for ~20 s before API/Web could
  # start (2026-09-18, three agents). Integrity runs after those jobs so
  # it does not steal a slot from pytest. GitHub still bills a job to a
  # full minute — one extra job is acceptable: hosted minutes are unused.
  filter:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      judge: ${{ steps.filter.outputs.judge }}
      code: ${{ steps.filter.outputs.code }}
      tools: ${{ steps.filter.outputs.tools }}
      tools_node: ${{ steps.filter.outputs.tools_node }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:   ['apps/api/**']
            # RW-ARCH-013: `packages/shared` is imported by the web app, so a
            # change there has to run the web gates (typecheck/build/tests).
            web:   ['apps/web/**', 'packages/**']
            judge: ['services/**']
            code:  ['apps/**', 'packages/**', 'services/**', 'tools/**', 'tests/**', 'docker-compose*.yml']
            # When the checks themselves change, the job that runs them
            # must start. `code` is too wide for that: it also matches
            # `apps/api/**`, so an API change would wake the web job
            # for nothing. `.githooks/**` is here too —
            # `neg_hook_gates_new_branch` in `check_negative.py` tests
            # the pre-push hook.
            tools: ['tools/**', '.githooks/**']
            # Node modules faqat shu fayllar uchun. Python-only tools/
            # (`check_decisions.py`, `deploy_timer.sh`) `npm ci` (14–20 s)
            # qilmasin. `check_i18n_runtime.mjs` TypeScript ni
            # `apps/web/node_modules` dan o'qiydi.
            #
            # RW-ARCH-013: the npm workspace lockfile moved to the root and
            # `packages/shared` became a source of truth, so a change to
            # either must trigger the Node job.
            tools_node:
              - 'tools/**/*.mjs'
              - 'package.json'
              - 'package-lock.json'
              - 'packages/**'
              - 'apps/web/package.json'

  api:
    name: API — lint, types, migrations
    needs: filter
    if: ${{ needs.filter.outputs.api == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # pytest (~2 min, two shards) moved to Nightly `coverage`. This job
    # is ruff / mypy / OpenAPI / makemigrations only.
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rankwant_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        # GitHub picks the host port: on the self-hosted runner 5432 is
        # already taken by the live preview stack.
        ports: ['5432']
    steps:
      - uses: actions/checkout@v7
      - name: Scaffolded?
        id: check
        run: |
          if [ -f apps/api/requirements-dev.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api is not scaffolded yet (Sprint 1) — skipped"
          fi
      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements-dev.lock
        working-directory: apps/api
      - name: Ruff
        if: steps.check.outputs.ready == 'true'
        run: ruff check . && ruff format --check .
        working-directory: apps/api
      - name: API messages English
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_api_english.py
      # Was a sibling job: on two runners it stole a slot for pip+diff
      # (~15 s) while another PR's Web waited (2026-09-18). pip is
      # already installed here.
      - name: OpenAPI schema diff
        if: steps.check.outputs.ready == 'true'
        run: |
          python manage.py spectacular --file /tmp/schema.yml
          diff -u openapi/schema.yml /tmp/schema.yml || {
            echo "::error::OpenAPI schema changed. Update it:"
            echo "::error::  cd apps/api && python manage.py spectacular --file openapi/schema.yml"
            exit 1
          }
        working-directory: apps/api
      - uses: actions/cache@v6
        if: steps.check.outputs.ready == 'true'
        with:
          path: apps/api/.mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('apps/api/requirements-dev.lock') }}-${{ hashFiles('apps/api/**/*.py') }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-${{ hashFiles('apps/api/requirements-dev.lock') }}-
      - name: mypy (strict)
        if: steps.check.outputs.ready == 'true'
        # `--show-traceback`: on 2026-09-12 this step failed with
        # `INTERNAL ERROR — Error constructing plugin instance of
        # NewSemanalDjangoPlugin`, but the one-line message hid the
        # cause. The same code passes on 280 files in the `rankwant-api`
        # image (same requirements), so the problem is the runner
        # environment — the traceback shows it. This flag can go once
        # the cause is known.
        run: mypy --show-traceback .
        working-directory: apps/api
      - name: Detect service host
        id: svc
        # Service-container ports are published on the Docker HOST, not
        # where the runner process lives. If the runner is inside a
        # container, its `localhost` is itself and the connection FAILS.
        #
        # Measured (2026-09-17, one-off test containers):
        #   sibling container → localhost:<port>              -> FAIL
        #   sibling container → host.docker.internal:<port>   -> OK
        #   default gateway 172.17.0.1                        -> FAIL
        #
        # On a WSL runner (not a container) `localhost` is correct, so
        # this step is backward-compatible: the value does not change
        # if the environment does not.
        run: |
          if [ -f /.dockerenv ]; then
            echo "host=host.docker.internal" >> "$GITHUB_OUTPUT"
          else
            echo "host=localhost" >> "$GITHUB_OUTPUT"
          fi

      - name: Migrations fully written
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@${{ steps.svc.outputs.host }}:${{ job.services.postgres.ports['5432'] }}/rankwant_test
        run: python manage.py makemigrations --check --dry-run
        working-directory: apps/api

  # ⚠️ Besides building web, this job also runs the CHECK SUITE
  # (`check_i18n`, `check_i18n_runtime`, `check_negative`, `check_contrast`).
  # They live here because `check_i18n_runtime.mjs` loads `typescript`
  # from `apps/web/node_modules` — so the suite needs the `npm ci`
  # below. Moving them to another job would repeat that install.
  #
  # ⚠️ So the gate is NOT tied to the `web` filter alone. It used to
  # be, and the result was measured (2026-09-15): PRs that only
  # changed `tools/` — including #13 rewriting `check_negative.py`
  # and #14 adding a new group — left this job `skipped`. The suite
  # that tests the checks did not run when those checks changed.
  web:
    name: Web — lint, types, build, and check suite
    needs: filter
    if: >-
      ${{ needs.filter.outputs.web == 'true'
          || needs.filter.outputs.tools == 'true'
          || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Scaffolded?
        id: check
        run: |
          if [ -f apps/web/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web is not scaffolded yet (Sprint 1) — skipped"
          fi
      - name: Need Node?
        id: node
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ "${{ needs.filter.outputs.web }}" = "true" ] \
            || [ "${{ needs.filter.outputs.tools_node }}" = "true" ] \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "need=true" >> "$GITHUB_OUTPUT"
          else
            echo "need=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: ${{ steps.check.outputs.ready == 'true' && steps.node.outputs.need == 'true' }}
        with:
          node-version: '22'
          cache: npm
          # RW-ARCH-013: the repo is an npm workspace, so the single
          # authoritative lockfile sits at the root and npm hoists the dev
          # dependencies there. Pointing at `apps/web/package-lock.json`
          # made the cache key miss on every run and `npm ci` in `apps/web`
          # re-resolve against a stale per-package tree.
          cache-dependency-path: package-lock.json
      # `npm ci` ONLY when web or Node tools changed. Python-only
      # `tools/` used to pay 14–20 s × PR+main for `typescript` that
      # those PRs never load. NODE_CASES then skip via NEGATIVE_SKIP_NODE.
      - if: ${{ steps.check.outputs.ready == 'true' && steps.node.outputs.need == 'true' }}
        run: npm ci
      - uses: actions/cache@v6
        if: ${{ steps.check.outputs.ready == 'true' && needs.filter.outputs.web == 'true' }}
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/src/**/*.ts', 'apps/web/src/**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # Lint / typecheck / build ONLY when web changed. On a tools-only
      # run they would check nothing new — the job is still needed
      # because the check suite is below.
      - name: Lint and typecheck
        if: ${{ steps.check.outputs.ready == 'true' && needs.filter.outputs.web == 'true' }}
        run: |
          npm run lint &
          p1=$!
          npm run typecheck &
          p2=$!
          e=0
          wait "$p1" || e=1
          wait "$p2" || e=1
          exit "$e"
        working-directory: apps/web
      - name: Unit tests (Vitest)
        if: ${{ steps.check.outputs.ready == 'true' && needs.filter.outputs.web == 'true' }}
        run: npm run test
        working-directory: apps/web
      # Types catch a missing key, but not an empty string or a copy
      # left untranslated.
      - name: i18n completeness
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_i18n.py
      - name: Email locales (all 10)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_email_locales.py
      - name: API messages English
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_api_english.py
      # Shriftlar repodan beriladi, Google'dan emas. `next/font/google`
      # har build'da jonli so'rov qilardi va Google javobi ~1/60 holatda
      # o'qib bo'lmaydigan shaklda qaytardi — CI tasodifiy yiqilardi
      # (vercel/next.js#99114). Ikki qo'riqchi:
      #   `check_no_google_fonts.py` — import qaytib kelmasin;
      #   `check_fonts.py` — `fonts.ts` literal ro'yxati manifest bilan
      #   mos bo'lsin (yo'l, weight, style, fayl diskda bormi).
      - name: No Google Fonts import
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_no_google_fonts.py
      - name: Font definitions match the vendored files
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_fonts.py
      # Fallback path of `t()`: throws in dev, logs once in prod.
      # `check_i18n.py` cannot see that — it only reads the strings —
      # so the module is run in Node (this step has `actions/setup-node`).
      - name: i18n runtime (dev throw / prod log)
        if: ${{ steps.check.outputs.ready == 'true' && steps.node.outputs.need == 'true' }}
        run: node tools/check_i18n_runtime.mjs
      # Tests the checks themselves — each is given a deliberately
      # broken state and must `exit 1`.
      #
      # `NODE` precondition: `check_negative.py` also runs Node checks,
      # and `node` can appear under different names on PATH.
      # Python-only tools: skip those two cases, do not fail the suite.
      #
      # ⚠️ ORDER: this runs AFTER `npm run build`, not before.
      #
      # The suite contains the `bundle_budget` group, whose control cases
      # invoke `check_bundle_budget.py` and require `apps/web/.next/static`.
      # While this step sat above the build, that group reported
      # "o'lchab bo'lmadi (exit 2)" on every run — the job went red for a
      # missing artifact, not a broken check. Measured 2026-09-24:
      #
      #     ✕ tor oqim: check_bundle_budget.py exit 2 berdi (0 kerak)
      #     ✕ bundle: o'lchab bo'lmadi (exit 2) — build qilinmagan
      #
      # The `visual` group is skipped here by design: it needs the
      # Playwright CLI (`tests/e2e/node_modules`) and a live web stack,
      # neither of which this job provisions. It is exercised by
      # `tools/ci_visual_gate.sh` in the dedicated visual job instead.
      - if: ${{ steps.check.outputs.ready == 'true' && needs.filter.outputs.web == 'true' }}
        run: npm run build
        working-directory: apps/web
      - name: Negative tests
        if: steps.check.outputs.ready == 'true'
        env:
          NODE: node
          # Four isolated git-archive copies. One tree cannot mutate in
          # parallel; 176 cases on one process were 42–48 s of the web job.
          NEGATIVE_JOBS: '4'
          NEGATIVE_SKIP_NODE: ${{ steps.node.outputs.need == 'true' && '0' || '1' }}
        run: python3 tools/check_negative.py
      - name: Text contrast (WCAG AA)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_contrast.py
      - name: Design tokens (no raw colour / px font)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_design_tokens.py
      - name: CSS scan sources (every @source path resolves)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_css_sources.py
      - name: Feature boundaries (layer rule)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_features.py
      - name: Import integrity (@/ paths resolve)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_imports.py
      - name: Accessibility (static rules)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_a11y.py
      # Sxemadan generatsiya qilingan TS tiplar eskirgan bo'lsa — qizil.
      # `openapi/schema.yml` o'zgargan-u `schema.ts` yangilanmagan bo'lsa,
      # mijoz tiplari jimgina noto'g'ri bo'lib qolardi.
      #
      # ⚠️ NODE qo'riqchisi SHART (2026-09-24, o'lchandi: run 35969866974).
      # `npm run openapi:check` `openapi-typescript` ni `node_modules` dan
      # oladi, ya'ni `npm ci` kerak. Faqat `ready` bilan qo'riqlangan edi:
      # Python-only `tools/` o'zgarganda Web job'i uyg'onadi-yu node
      # o'rnatilmaydi (`Need Node?` = false) va qadam yiqilardi:
      #
      #     sh: 1: openapi-typescript: not found
      #     ##[error]Process completed with exit code 127
      #
      # Sabab kodda emas, muhitda — `i18n runtime` qadami bilan bir xil
      # shart qo'yiladi.
      - name: Generated API types are current
        if: ${{ steps.check.outputs.ready == 'true' && steps.node.outputs.need == 'true' }}
        run: npm run openapi:check
        working-directory: apps/web
      # `next build` never fails on a fat bundle, so this is the only place
      # the budget is enforced. Reads `apps/web/.next/static` — must come
      # AFTER the build above. RW-ARCH-016.
      - name: Bundle budget
        if: ${{ steps.check.outputs.ready == 'true' && needs.filter.outputs.web == 'true' }}
        run: python3 tools/check_bundle_budget.py

  judge:
    name: Judge — bake-off candidates
    needs: filter
    if: ${{ needs.filter.outputs.judge == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Go — vet, format, build, test
        run: |
          if [ ! -f services/judge-go/go.mod ]; then
            echo "judge-go is not scaffolded yet — skipped"
            exit 0
          fi
          cd services/judge-go
          test -z "$(gofmt -l .)" || { echo "::error::gofmt: $(gofmt -l .)"; exit 1; }
          go vet ./...
          go build ./...
          go test ./...
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/judge-py/pyproject.toml
      - name: Python judge — lint, types, test
        run: |
          if [ ! -f services/judge-py/pyproject.toml ]; then
            echo "judge-py is not scaffolded yet — skipped"
            exit 0
          fi
          cd services/judge-py
          pip install -e '.[dev]'
          ruff check .
          ruff format --check .
          mypy .
          pytest

  # Hosted VMs have spare parallelism (20 jobs). Integrity no longer
  # waits for API/Web/Judge: those used to serialize a 7–11 s job behind
  # pytest so a docs check would not steal the laptop's second runner.
  # `always()` is still required if a future `needs` is skipped.
  integrity:
    name: Docs and contract integrity
    needs: [filter]
    if: ${{ always() && needs.filter.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Links, tables, writing, and STATUS
        run: python3 tools/check_docs.py
      - name: Confusable letters in identifiers (Cyrillic/Greek ↔ Latin)
        run: python3 tools/check_confusables.py
      - name: Judge contract (protocol.md ↔ Go ↔ Python)
        run: python3 tools/check_contract.py
      - name: DRF `ordering` tiebreaker (unstable pagination)
        run: python3 tools/check_ordering.py
      - name: Owner decisions in code (CLAUDE.md § Saidakbar aka qarorlari)
        run: python3 tools/check_decisions.py
      - name: Customization contract vs the code (api keys ↔ client writes)
        run: python3 tools/check_customization_contract.py
      - name: Deployed security boundary (loopback only, judge publishes nothing)
        run: python3 tools/check_security_boundary.py
      - name: Dependency licence inventory (drift against the lockfiles)
        run: python3 tools/licence_inventory.py --check
      - name: .env.example completeness (variables read by code and compose)
        run: python3 tools/check_env_example.py

