name: CI

on:
  pull_request:
  push:
    branches: [main]
  # `deploy.yml` shu to'plamni `uses: ./.github/workflows/ci.yml` bilan
  # chaqiradi. Ya'ni "test o'tdi" sharti deploy uchun majburiy bo'ladi,
  # tekshiruvlar esa ikki nusxada saqlanmaydi: qoida bir joyda o'zgaradi.
  # `pull_request` va `push` BU YERDA QOLADI — chaqiriladigan workflow
  # o'z triggerlarini saqlaydi, `workflow_call` ularga qo'shimcha.
  workflow_call:

# Self-hosted runner ishlab chiqish mashinasida, `nsn` foydalanuvchisi
# sifatida ishlaydi — Python `~/.local/lib/.../site-packages` ni ham
# ko'radi. U yerdagi begona paketlar (masalan `dash`) pytest plaginini
# ro'yxatdan o'tkazadi va pytest ularni avtomatik yuklaydi. Ish faqat
# o'z muhitidan foydalanishi kerak.
env:
  PYTHONNOUSERSITE: '1'

concurrency:
  # `cancel-in-progress` FAQAT `pull_request` va `push` da. Deploy uni
  # chaqirganda (`workflow_call`) bekor qilish XAVFLI: deploy `test` job'i
  # tugashini kutadi, bekor qilingan job esa `failure`/`cancelled` bo'lib
  # qaytadi va shartsiz deploy job'i hech qachon ishga tushmaydi —
  # ya'ni tez ketma-ket push'larda deploy jimgina o'tkazib yuborilardi.
  # Qayta chaqirilganda guruh ham boshqacha, to'qnashuv yo'q.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read
  # `dorny/paths-filter` PR'dagi o'zgargan fayllarni GitHub API'dan
  # oladi; bu ruxsatsiz u «Resource not accessible by integration» deb
  # yiqiladi va butun CI shu yerda to'xtaydi.
  pull-requests: read

jobs:
  # Yo'l filtri va hujjat tekshiruvi bitta job'da: ikkalasi ham bir necha
  # soniya ishlaydi, GitHub esa har jobni daqiqagacha yaxlitlab hisoblaydi
  # — alohida turganda ular oyiga ~86 daqiqa yeb turardi.
  changes:
    name: O'zgarishlar va hujjat yaxlitligi
    runs-on: [self-hosted, rankwant]
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      judge: ${{ steps.filter.outputs.judge }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:   ['apps/api/**']
            web:   ['apps/web/**']
            judge: ['services/**']
            code:  ['apps/**', 'services/**', 'tools/**', 'tests/**', 'docker-compose*.yml']
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Havola, jadval, yozuv va STATUS tekshiruvi
        run: python3 tools/check_docs.py
      - name: Judge shartnomasi (protocol.md ↔ Go ↔ Python)
        run: python3 tools/check_contract.py

  api:
    name: API — lint, types, tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: [self-hosted, rankwant]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rankwant_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        # Host portini GitHub tanlaydi: self-hosted runner'da 5432 jonli
        # preview stack tomonidan band.
        ports: ['5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['6379']
    steps:
      - uses: actions/checkout@v7
      - name: Scaffold qilinganmi?
        id: check
        run: |
          if [ -f apps/api/requirements-dev.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/api hali scaffold qilinmagan (Sprint 1) — o'tkazib yuborildi"
          fi
      - uses: actions/setup-python@v7
        if: steps.check.outputs.ready == 'true'
        # `cache:` ATAYIN yo'q. Runner self-hosted: `~/.npm` (1.5 GB) va
        # pip keshi mashinada, joblar orasida saqlanadi. `cache:` ularni
        # GitHub saqlagichidan qayta yuklaydi — o'lchandi: npm keshining
        # 440 MB lik arxivi ~2 MB/s da 127 soniya olgan, mahalliy nusxa
        # yonida tura turib.
        with:
          python-version: '3.12'
      - if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements-dev.lock
        working-directory: apps/api
      - name: Ruff
        if: steps.check.outputs.ready == 'true'
        run: ruff check . && ruff format --check .
        working-directory: apps/api
      - name: mypy (strict)
        if: steps.check.outputs.ready == 'true'
        # `--show-traceback`: 2026-09-12 da bu qadam `INTERNAL ERROR —
        # Error constructing plugin instance of NewSemanalDjangoPlugin`
        # bilan yiqildi, lekin bir qatorlik xabar SABABNI ko'rsatmaydi.
        # O'sha kod `rankwant-api` image'ida (bir xil requirements) 280
        # faylda xatosiz o'tadi, ya'ni muammo runner muhitida — traceback
        # uni ko'rsatadi. Sabab topilgach bu qator olib tashlanishi mumkin.
        run: mypy --show-traceback .
        working-directory: apps/api
      - name: Migratsiyalar to'liq yozilganmi
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/rankwant_test
        run: python manage.py makemigrations --check --dry-run
        working-directory: apps/api
      - name: pytest
        if: steps.check.outputs.ready == 'true'
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/rankwant_test
          REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}/0
        # `-n 4`: o'lchandi — 123 s → 39 s. `auto` EMAS: runner shu
        # mashinada, jonli preview bilan yonma-yon ishlaydi.
        run: pytest -n 4 --cov --cov-report=term-missing
        working-directory: apps/api

  web:
    name: Web — lint, types, build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: [self-hosted, rankwant]
    steps:
      - uses: actions/checkout@v7
      - name: Scaffold qilinganmi?
        id: check
        run: |
          if [ -f apps/web/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/web hali scaffold qilinmagan (Sprint 1) — o'tkazib yuborildi"
          fi
      - uses: actions/setup-node@v7
        if: steps.check.outputs.ready == 'true'
        # `cache:` ATAYIN yo'q. Runner self-hosted: `~/.npm` (1.5 GB) va
        # pip keshi mashinada, joblar orasida saqlanadi. `cache:` ularni
        # GitHub saqlagichidan qayta yuklaydi — o'lchandi: npm keshining
        # 440 MB lik arxivi ~2 MB/s da 127 soniya olgan, mahalliy nusxa
        # yonida tura turib.
        with:
          node-version: '22'
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
        working-directory: apps/web
      - if: steps.check.outputs.ready == 'true'
        run: npm run lint
        working-directory: apps/web
      - if: steps.check.outputs.ready == 'true'
        run: npm run typecheck
        working-directory: apps/web
      # Tiplar kalit yetishmasligini ushlaydi, lekin bo'sh satrni yoki
      # tarjimasiz qoldirilgan nusxani ko'rmaydi.
      - name: i18n to'liqligi
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_i18n.py
      - name: Matn kontrasti (WCAG AA)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/check_contrast.py
      - if: steps.check.outputs.ready == 'true'
        run: npm run build
        working-directory: apps/web

  judge:
    name: Judge — bake-off nomzodlari
    needs: changes
    if: needs.changes.outputs.judge == 'true'
    runs-on: [self-hosted, rankwant]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Go — vet, format, build, test
        run: |
          if [ ! -f services/judge-go/go.mod ]; then
            echo "judge-go hali scaffold qilinmagan — o'tkazib yuborildi"
            exit 0
          fi
          cd services/judge-go
          test -z "$(gofmt -l .)" || { echo "::error::gofmt: $(gofmt -l .)"; exit 1; }
          go vet ./...
          go build ./...
          go test ./...
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python judge — lint, types, test
        run: |
          if [ ! -f services/judge-py/pyproject.toml ]; then
            echo "judge-py hali scaffold qilinmagan — o'tkazib yuborildi"
            exit 0
          fi
          cd services/judge-py
          pip install -e '.[dev]'
          ruff check .
          ruff format --check .
          mypy .
          pytest

  openapi:
    name: OpenAPI schema diff
    needs: [changes, api]
    if: needs.changes.outputs.api == 'true'
    runs-on: [self-hosted, rankwant]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Schema generatsiya va diff
        run: |
          if [ ! -f apps/api/manage.py ]; then
            echo "::notice::apps/api hali scaffold qilinmagan — schema diff o'tkazib yuborildi"
            exit 0
          fi
          cd apps/api
          pip install -r requirements-dev.lock
          python manage.py spectacular --file /tmp/schema.yml
          diff -u openapi/schema.yml /tmp/schema.yml || {
            echo "::error::OpenAPI schema o'zgardi. Yangilang:"
            echo "::error::  cd apps/api && python manage.py spectacular --file openapi/schema.yml"
            exit 1
          }

  smoke:
    name: Smoke va E2E — to'liq stack
    runs-on: [self-hosted, rankwant]
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Compose loyihasi HAR JOB uchun alohida. Bitta runner'da joblar
    # ketma-ket ketgani uchun bu ilgari sezilmasdi; ikkinchi runner
    # qo'shilishi bilan ikkita job bir xil nomdagi stack'ni ko'tarib,
    # birining `down -v` si ikkinchisining konteynerlarini o'chirardi.
    env:
      COMPOSE_PROJECT_NAME: rw-${{ github.job }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - name: Stack
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait
      - name: Demo ma'lumot
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml exec -T api python manage.py seed_demo
      - name: Smoke
        # Kritik yo'l: submit → Redis → judge → verdict. Bu qadam API va
        # judge'ni BIRGA ishlatadigan yagona joy — ular alohida sinalganda
        # ikkita shartnoma nomuvofiqligi ko'rinmay qolgan edi.
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm smoke
      - name: E2E (faqat chromium — to'liq matritsa nightly da)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --network "${COMPOSE_PROJECT_NAME}_default" \
            -v "$PWD/tests/e2e:/e2e" -w /e2e \
            -e E2E_BASE_URL=http://web:3000 -e E2E_API_BASE=http://api:8000/api/v1 -e CI=1 \
            mcr.microsoft.com/playwright:v1.63.0-noble \
            sh -c 'npm ci --silent && npx playwright test --project=chromium --reporter=list'
      - name: Loglar (yiqilganda)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 60
      - name: Tozalash
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
