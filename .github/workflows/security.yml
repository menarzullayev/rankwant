name: Security

on:
  # Not on PR (2026-09-18): every PR ran a CI+Security pair and doubled
  # the single-runner queue. gitleaks / pip / npm audit stay on main
  # push and overnight.
  push:
    branches: [main]      # no branch protection (private + free plan) — main is scanned too
  schedule:
    - cron: '0 3 * * *'

# The self-hosted runner runs as user `nsn` on the development machine
# and can see Python packages in `~/.local/lib/.../site-packages`.
# Stray packages there (for example `dash`) register pytest plugins
# and pytest loads them automatically. The job must use only its own
# environment.
env:
  PYTHONNOUSERSITE: '1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # All three checks in one job: together they take 43 seconds, but as
  # separate jobs GitHub billed each rounded up to a minute — 43 seconds
  # of work became 3 minutes.
  audit:
    name: Security checks
    runs-on: ubuntu-latest
    # ⚠️ The time limit is REQUIRED: nothing on the self-hosted runner
    # may wait forever. 3 minutes is enough (measured: ~43 s + pip/npm
    # audit).
    timeout-minutes: 3
    steps:
      # gitleaks sees the full history, so a full clone.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: gitleaks
        # Direct scanner, not an Action: no GitHub API permission
        # needed, so it also works on Dependabot PRs (read-only token).
        #
        # `--config` is REQUIRED: it excludes public captcha site keys
        # in competitor-audit screenshots (details: `.gitleaks.toml`).
        timeout-minutes: 3
        run: |
          # `HOST_REPO_ROOT` — bind source is resolved on the daemon
          # side (see ci.yml § Detect service host / mount). Set on the
          # container runner.
          docker run --rm -v "${HOST_REPO_ROOT:-$PWD}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --no-banner --verbose

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: pip-audit
        timeout-minutes: 3
        run: |
          pip install pip-audit pyyaml
          if [ -f apps/api/requirements.lock ]; then
            pip-audit -r apps/api/requirements.lock
          fi
          if [ -f services/judge-py/pyproject.toml ]; then
            pip-audit --path services/judge-py || true
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit
        timeout-minutes: 3
        run: |
          if [ -f apps/web/package-lock.json ]; then
            # Node 22's bundled npm still falls back to
            # /-/npm/v1/security/audits/quick. npmjs browned that
            # out (400 "Invalid package tree") and is retiring it
            # (410). npm 11 talks to /advisories/bulk only, so the
            # high+ gate keeps working without rewriting the lockfile.
            cd apps/web && npx --yes npm@11 audit --audit-level=high
          fi

      - name: Judge sandbox — escape tests
        timeout-minutes: 3
        run: |
          if [ -x tests/security/run.sh ]; then
            tests/security/run.sh
          else
            echo "Sandbox harness is not here yet — enable after bake-off (Sprint 0.5)"
            echo "Tests: fork bomb, file write, network, /proc, symlink, setuid"
          fi
