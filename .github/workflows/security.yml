name: Security

on:
  pull_request:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  deps:
    name: Bog'liqlik auditi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pip-audit
        run: |
          pip install pip-audit
          if [ -f apps/api/requirements.txt ]; then pip-audit -r apps/api/requirements.txt; fi
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm audit
        run: |
          if [ -f apps/web/package-lock.json ]; then
            cd apps/web && npm audit --audit-level=high
          fi

  secrets:
    name: Secret sizishi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sandbox:
    name: Judge sandbox izolyatsiyasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escape sinovlari
        run: |
          if [ -x tests/security/run.sh ]; then
            tests/security/run.sh
          else
            echo "Sandbox harness hali yo'q — bake-off (Sprint 0.5) dan keyin yoqiladi"
            echo "Sinovlar: fork bomb, fayl yozish, tarmoq, /proc, symlink, setuid"
          fi
