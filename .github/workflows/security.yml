name: Security

on:
  # PR'da yo'q (2026-09-18): har PR CI+Security juftligi bitta runner
  # navbatini 2× qilardi. gitleaks/pip/npm audit main push va kechasi qoladi.
  push:
    branches: [main]      # branch protection yo'q (private + free plan) — main ham skanerlanadi
  schedule:
    - cron: '0 3 * * *'

# Self-hosted runner ishlab chiqish mashinasida, `nsn` foydalanuvchisi
# sifatida ishlaydi — Python `~/.local/lib/.../site-packages` ni ham
# ko'radi. U yerdagi begona paketlar (masalan `dash`) pytest plaginini
# ro'yxatdan o'tkazadi va pytest ularni avtomatik yuklaydi. Ish faqat
# o'z muhitidan foydalanishi kerak.
env:
  PYTHONNOUSERSITE: '1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # Uchala tekshiruv bitta job'da: birgalikda 43 soniya ishlaydi, lekin
  # alohida turganda GitHub har birini daqiqagacha yaxlitlab hisoblardi —
  # 43 soniyalik ish 3 daqiqa bo'lib ketardi.
  audit:
    name: Xavfsizlik tekshiruvlari
    runs-on: [self-hosted, rankwant]
    # ⚠️ Vaqt chegarasi SHART: self-hosted runner'da hech narsa abadiy
    # kutmasligi kerak. 3 daqiqa yetadi (o'lchandi: ~43 s + pip/npm audit).
    timeout-minutes: 3
    steps:
      # gitleaks butun tarixni ko'radi, shuning uchun to'liq klon.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: gitleaks
        # Action emas, to'g'ridan-to'g'ri skaner: GitHub API ruxsatiga bog'liq emas,
        # shuning uchun Dependabot PR'larida ham (read-only token) ishlaydi.
        #
        # `--config` SHART: raqobatchi audit tasvirlaridagi ochiq captcha
        # site key'larini istisno qiladi (batafsil: `.gitleaks.toml`).
        timeout-minutes: 3
        run: |
          # `HOST_REPO_ROOT` — bind manbai daemon tomonida yechiladi (qarang:
          # ci.yml § Service host / mount). Konteyner runner'da o'rnatiladi.
          docker run --rm -v "${HOST_REPO_ROOT:-$PWD}:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --no-banner --verbose

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: pip-audit
        timeout-minutes: 3
        run: |
          pip install pip-audit pyyaml
          if [ -f apps/api/requirements.lock ]; then
            pip-audit -r apps/api/requirements.lock
          fi
          if [ -f services/judge-py/pyproject.toml ]; then
            pip-audit --path services/judge-py || true
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: npm audit
        timeout-minutes: 3
        run: |
          if [ -f apps/web/package-lock.json ]; then
            cd apps/web && npm audit --audit-level=high
          fi

      - name: Judge sandbox — escape sinovlari
        timeout-minutes: 3
        run: |
          if [ -x tests/security/run.sh ]; then
            tests/security/run.sh
          else
            echo "Sandbox harness hali yo'q — bake-off (Sprint 0.5) dan keyin yoqiladi"
            echo "Sinovlar: fork bomb, fayl yozish, tarmoq, /proc, symlink, setuid"
          fi
