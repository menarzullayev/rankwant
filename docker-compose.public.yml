# Ommaviy preview — bitta domen ortida (masalan rankwant.uz).
#
# Web va API BIR XIL origin'da: `/api/*` API ga, qolgani web ga yo'naltiriladi
# (reverse proxy yoki Cloudflare Tunnel ingress). Shu sababli CORS ham,
# CSRF cross-origin tekshiruvi ham umuman ishga tushmaydi.
#
# Sirlar `.env.public` da (gitignore). Ishga tushirish:
#   docker compose --env-file .env.public \
#     -f docker-compose.yml -f docker-compose.public.yml up -d --build --wait
#
# DIQQAT: bu 10-operations dagi to'rt-hostli production topologiyasi EMAS —
# bitta mashinada ishlaydigan ko'rsatuv nusxasi.
# Mashina qayta yuklansa stack o'zi ko'tarilsin — aks holda sayt
# jimgina o'chib qoladi.
#
# ⚠️⚠️ XAVFSIZLIK TO'SIG'I (2026-09-24) — bu fayl `rankwant` loyihasidagi
# JONLI stack'ni boshqaradi, shuning uchun `.env.public` MAJBURIY.
#
# Nega kerak bo'ldi: komanda env-faylsiz yurgizilsa compose o'zgaruvchilarni
# BO'SH qilib qo'yadi (`DJANGO_SECRET_KEY=`, `DJANGO_ALLOWED_HOSTS=`) va
# `api` konteynerini QAYTA YARATADI. Django `ALLOWED_HOSTS` bo'sh bo'lsa
# HAR so'rovga 400 beradi, healthcheck yiqiladi, api `unhealthy` bo'ladi,
# sayt esa 503 «maintenance» ko'rsatadi. O'lchandi (2026-09-24):
#
#     rankwant-api-1   Up 2 minutes (unhealthy)
#     django.core.exceptions.DisallowedHost: Invalid HTTP_HOST header ...
#     GET https://rankwant.uz/api/v1/health/  →  503
#
# Ya'ni bitta unutilgan `--env-file` jonli saytni yiqitadi. Compose fayli
# buni O'ZI to'xtatadi: `:?` xato bilan chiqadi va konteynerga tegmaydi.
#
# To'g'ri chaqiruv (env-fayl ASOSIY checkout'da qoladi, worktree'da yo'q —
# u `.gitignore` da):
#   docker compose -p rankwant --env-file D:/Linux/Web_Projects/rankwant/.env.public \
#     -f docker-compose.yml -f docker-compose.public.yml up -d --build --wait
#
# ⚠️ FAQAT `up`/`run`/`start`/`restart`/`create` uchun. `down`, `logs`,
# `ps`, `exec` esa env-faylsiz ham ishlashi kerak (nosozlikni tekshirish
# shoshilinch bo'ladi) — shuning uchun xato `up` ga bog'langan.
x-env-guard: &env-guard
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?--env-file .env.public MAJBURIY — usiz jonli api secret-siz qayta yaratiladi}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?--env-file .env.public MAJBURIY — bo'sh bo'lsa Django har so'rovga 400 qaytaradi va sayt 503 beradi}

x-restart: &restart
  restart: unless-stopped

# Email zanjiri (`core.mailer`) — kalitlar `.env.public` da.
# `api` ga `send_test_email` uchun, `worker` ga `core.send_email` task'i
# uchun kerak: zanjir so'rov ichida emas, fon rejimida yuriladi.
# Sozlanmagani jimgina tushib qoladi, shu bois hammasining standarti bo'sh.
x-email: &email
  EMAIL_CHAIN: ${EMAIL_CHAIN:-brevo,mailjet,resend,mailersend}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-RankWant}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  BREVO_FROM: ${BREVO_FROM:-}
  MAILJET_API_KEY: ${MAILJET_API_KEY:-}
  MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
  MAILJET_FROM: ${MAILJET_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}
  MAILERSEND_FROM: ${MAILERSEND_FROM:-}

# Ijtimoiy kirish — ADR-0016. Kaliti yo'q provayder `/auth/providers/`
# ro'yxatiga tushmaydi va uning tugmasi umuman chizilmaydi.
x-oauth: &oauth
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  # Login endi OIDC: Client ID/Secret @BotFather -> Login Widget'dan.
  # `TELEGRAM_BOT_TOKEN` bot bildirishnomalari uchun qoladi.
  TELEGRAM_CLIENT_ID: ${TELEGRAM_CLIENT_ID:-}
  TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}

# Bot himoyasi (9-qaror) — `core.turnstile`. Kalitlar `.env.public` da.
# Sayt kaliti `/auth/providers/` orqali brauzerga yetkaziladi, ya'ni
# `web` konteyneriga env KERAK EMAS — bitta manba qoladi.
# ⚠️ Kalitlar compose'da e'lon qilinmasa konteynerga UMUMAN yetib
# bormaydi (`.env.public` da bo'lishi yetarli emas) — o'lchandi.
x-turnstile: &turnstile
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  TURNSTILE_FAIL_OPEN: ${TURNSTILE_FAIL_OPEN:-1}

# `register` throttle (9-qaror bilan bog'liq). Turnstile yoqilgach
# yumshatish xavfsiz: himoya throttle'dan OLDIN turadi.
x-throttle: &throttle
  THROTTLE_REGISTER: ${THROTTLE_REGISTER:-40/hour}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    <<: *restart
    logging: *default-logging
    ports: !reset []
  redis:
    <<: *restart
    logging: *default-logging
    ports: !reset []
  minio:
    <<: *restart
    logging: *default-logging
    ports: !reset []

  migrate:
    logging: *default-logging
    environment:
      # ⚠️ `*env-guard` — env-faylsiz `up` to'xtatiladi (fayl boshiga qarang).
      <<: *env-guard
      DJANGO_DEBUG: "0"

  api:
    <<: *restart
    logging: *default-logging
    # Faqat localhost: tashqariga Cloudflare Tunnel chiqaradi, port emas.
    ports: !override ['127.0.0.1:8301:8000']
    environment:
      # ⚠️ Bu ikki kalit `x-env-guard` orqali keladi — ya'ni env-faylsiz
      # `up` UMUMAN ishlamaydi (sababi fayl boshida). `djenv` bilan bu
      # yerda takror yozilmaydi: bitta manba qoladi.
      <<: [*env-guard, *email, *oauth, *turnstile, *throttle]
      DJANGO_DEBUG: "0"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN}
      # Cloudflare buni HAR so'rovda qayta yozadi, ya'ni mijoz
      # soxtalashtira olmaydi. Port faqat 127.0.0.1 da, tashqariga
      # tunnel chiqaradi — demak Cloudflare'ni chetlab o'tib bo'lmaydi.
      TRUSTED_CLIENT_IP_HEADER: HTTP_CF_CONNECTING_IP
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}

  worker:
    <<: *restart
    logging: *default-logging
    environment:
      # ⚠️ `*env-guard` — env-faylsiz `up` to'xtatiladi (fayl boshiga qarang).
      <<: [*env-guard, *email]
      DJANGO_DEBUG: "0"

  beat:
    <<: *restart
    logging: *default-logging
    environment:
      # ⚠️ `*env-guard` — env-faylsiz `up` to'xtatiladi (fayl boshiga qarang).
      <<: *env-guard
      DJANGO_DEBUG: "0"

  web:
    <<: *restart
    logging: *default-logging
    build:
      args:
        # Brauzer bundle'i — o'sha domenning o'zi, ya'ni same-origin.
        NEXT_PUBLIC_API_BASE: ${PUBLIC_ORIGIN}/api/v1
    ports: !override ['127.0.0.1:8300:3000']

  judge:
    <<: *restart
    logging: *default-logging
