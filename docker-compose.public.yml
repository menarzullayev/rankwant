# Ommaviy preview — bitta domen ortida (masalan rankwant.bugvector.uz).
#
# Web va API BIR XIL origin'da: `/api/*` API ga, qolgani web ga yo'naltiriladi
# (reverse proxy yoki Cloudflare Tunnel ingress). Shu sababli CORS ham,
# CSRF cross-origin tekshiruvi ham umuman ishga tushmaydi.
#
# Sirlar `.env.public` da (gitignore). Ishga tushirish:
#   docker compose --env-file .env.public \
#     -f docker-compose.yml -f docker-compose.public.yml up -d --build --wait
#
# DIQQAT: bu 10-operations dagi to'rt-hostli production topologiyasi EMAS —
# bitta mashinada ishlaydigan ko'rsatuv nusxasi.
# Mashina qayta yuklansa stack o'zi ko'tarilsin — aks holda sayt
# jimgina o'chib qoladi.
x-restart: &restart
  restart: unless-stopped

# Email zanjiri (`core.mailer`) — kalitlar `.env.public` da.
# `api` ga `send_test_email` uchun, `worker` ga `core.send_email` task'i
# uchun kerak: zanjir so'rov ichida emas, fon rejimida yuriladi.
# Sozlanmagani jimgina tushib qoladi, shu bois hammasining standarti bo'sh.
x-email: &email
  EMAIL_CHAIN: ${EMAIL_CHAIN:-brevo,mailjet,resend,mailersend}
  EMAIL_FROM: ${EMAIL_FROM:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-RankWant}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  BREVO_FROM: ${BREVO_FROM:-}
  MAILJET_API_KEY: ${MAILJET_API_KEY:-}
  MAILJET_SECRET_KEY: ${MAILJET_SECRET_KEY:-}
  MAILJET_FROM: ${MAILJET_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-}
  MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}
  MAILERSEND_FROM: ${MAILERSEND_FROM:-}

services:
  postgres:
    <<: *restart
    ports: !reset []
  redis:
    <<: *restart
    ports: !reset []
  minio:
    <<: *restart
    ports: !reset []

  migrate:
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"

  api:
    <<: *restart
    # Faqat localhost: tashqariga Cloudflare Tunnel chiqaradi, port emas.
    ports: !override ['127.0.0.1:8301:8000']
    environment:
      <<: *email
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN}
      # Cloudflare buni HAR so'rovda qayta yozadi, ya'ni mijoz
      # soxtalashtira olmaydi. Port faqat 127.0.0.1 da, tashqariga
      # tunnel chiqaradi — demak Cloudflare'ni chetlab o'tib bo'lmaydi.
      TRUSTED_CLIENT_IP_HEADER: HTTP_CF_CONNECTING_IP

  worker:
    <<: *restart
    environment:
      <<: *email
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}

  beat:
    <<: *restart
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}

  web:
    <<: *restart
    build:
      args:
        # Brauzer bundle'i — o'sha domenning o'zi, ya'ni same-origin.
        NEXT_PUBLIC_API_BASE: ${PUBLIC_ORIGIN}/api/v1
    ports: !override ['127.0.0.1:8300:3000']

  judge:
    <<: *restart
